}

/* ---------- Usuarios (administrar: crear, editar, inactivar, país) ---------- */
function UsuarioFormModal({ paises, editUser, editPaisIds, onClose, onSaved }) {
  const [usuario, setUsuario] = useState(editUser ? editUser.usuario || "" : "");
  const [password, setPassword] = useState("");
  const [nombre, setNombre] = useState(editUser ? editUser.nombre || "" : "");
  const [estado, setEstado] = useState(editUser ? editUser.estado || "Activo" : "Activo");
  const [paisIds, setPaisIds] = useState(editPaisIds || []);
  const [saving, setSaving] = useState(false);

  const togglePais = id => {
    setPaisIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  };
  const seleccionarTodos = () => setPaisIds(paises.map(p => p.id));
  const seleccionarNinguno = () => setPaisIds([]);

  const guardar = async () => {
    if (!usuario.trim() || !nombre.trim()) { alert("Usuario y nombre son requeridos."); return; }
    if (!editUser && !password.trim()) { alert("La contraseña es requerida para un usuario nuevo."); return; }
    setSaving(true);
    try {
      // evitar usuario duplicado
      const { data: existentes, error: eDup } = await supabase.from("usuarios").select("id").eq("usuario", usuario.trim());
      if (eDup) throw eDup;
      if ((existentes || []).some(x => x.id !== (editUser && editUser.id))) {
        alert("Ya existe un usuario con ese nombre de usuario.");
        setSaving(false);
        return;
      }

      let usuarioId = editUser ? editUser.id : null;
      if (editUser) {
        const payload = { usuario: usuario.trim(), nombre: nombre.trim(), estado };
        if (password.trim()) payload.password = password.trim();
        const { error } = await supabase.from("usuarios").update(payload).eq("id", editUser.id);
        if (error) throw error;
      } else {
        const { data, error } = await supabase.from("usuarios").insert([{ usuario: usuario.trim(), password: password.trim(), nombre: nombre.trim(), estado }]).select();
        if (error) throw error;
        usuarioId = data && data[0] && data[0].id;
      }

      if (usuarioId) {
        try {
          // Reemplaza por completo la lista de países asignados: borra lo anterior y vuelve a insertar lo seleccionado.
          await supabase.from("proyecto_usuario_paises").delete().eq("usuarioId", usuarioId);
          if (paisIds.length > 0) {
            await supabase.from("proyecto_usuario_paises").insert(paisIds.map(pid => ({ usuarioId, pais_id: pid })));
          }
        } catch (e) {
          console.warn("proyecto_usuario_paises no disponible:", e.message || e);
        }
      }

      onSaved();
      onClose();
    } catch (e) {
      alert("No se pudo guardar: " + (e.message || e));
    } finally {
      setSaving(false);
    }
  };

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,.6)",zIndex:600,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={e => e.target === e.currentTarget && onClose()}>
      <div style={{background:y.surface,borderRadius:12,padding:"1.5rem",width:460,maxWidth:"92vw",maxHeight:"88vh",overflowY:"auto",boxShadow:"0 20px 50px rgba(0,0,0,.3)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
          <strong style={{fontSize:15,color:y.text}}>{editUser ? "Editar usuario" : "Agregar usuario"}</strong>
          <button onClick={onClose} style={{background:"none",border:"none",color:y.text3,cursor:"pointer",fontSize:18,lineHeight:1}}>✕</button>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div>
            <label style={{fontSize:11,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>Usuario *</label>
            <input value={usuario} onChange={e => setUsuario(e.target.value)} style={{...inputStyle, marginTop:4}} placeholder="nombre.apellido" />
          </div>
          <div>
            <label style={{fontSize:11,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>{editUser ? "Contraseña (vacío = sin cambiar)" : "Contraseña *"}</label>
            <input type="password" value={password} onChange={e => setPassword(e.target.value)} style={{...inputStyle, marginTop:4}} placeholder="••••••••" />
          </div>
          <div>
            <label style={{fontSize:11,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>Nombre completo *</label>
            <input value={nombre} onChange={e => setNombre(e.target.value)} style={{...inputStyle, marginTop:4}} placeholder="Nombre Apellido" />
          </div>
          <div>
            <label style={{fontSize:11,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>Estado</label>
            <select value={estado} onChange={e => setEstado(e.target.value)} style={{...inputStyle, marginTop:4}}>
              <option>Activo</option>
              <option>Inactivo</option>
            </select>
          </div>
          <div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
              <label style={{fontSize:11,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>Países ({paisIds.length === paises.length && paises.length > 0 ? "todos" : paisIds.length})</label>
              <div style={{display:"flex",gap:10}}>
                <button type="button" onClick={seleccionarTodos} style={{background:"none",border:"none",color:y.primary,fontSize:11,fontWeight:600,cursor:"pointer",padding:0}}>Todos</button>
                <button type="button" onClick={seleccionarNinguno} style={{background:"none",border:"none",color:y.text3,fontSize:11,fontWeight:600,cursor:"pointer",padding:0}}>Ninguno</button>
              </div>
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:8,padding:"0.6rem",background:y.grayBg,borderRadius:8,border:"1px solid "+y.border}}>
              {paises.length === 0 && <span style={{fontSize:12,color:y.text3}}>No hay países en el catálogo.</span>}
              {paises.map(p => (
                <label key={p.id} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,cursor:"pointer",padding:"4px 9px",borderRadius:7,background: paisIds.includes(p.id) ? y.primaryLight : y.surface, border:"1px solid "+(paisIds.includes(p.id) ? y.primary : y.border), fontWeight: paisIds.includes(p.id) ? 600 : 400, color: paisIds.includes(p.id) ? y.primary : y.text2}}>
                  <input type="checkbox" checked={paisIds.includes(p.id)} onChange={() => togglePais(p.id)} />
                  {bandera(p.nombre)} {p.nombre}
                </label>
              ))}
            </div>
          </div>
        </div>
        <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:20}}>
          <Btn onClick={onClose} disabled={saving}>Cancelar</Btn>
          <Btn primary onClick={guardar} disabled={saving}>{saving ? "Guardando..." : "Guardar"}</Btn>
        </div>
      </div>
    </div>
  );
}

function UsuariosView({ paises, usuarioPaises, usuarioPaisesDisponibles, onChanged, session }) {
  const [usuarios, setUsuarios] = useState([]);
  const [loading, setLoading] = useState(true);
  const [formAbierto, setFormAbierto] = useState(null); // null | {} (nuevo) | usuario (editar)
  const [toDelete, setToDelete] = useState(null);
  const [deleting, setDeleting] = useState(false);

  const cargar = async () => {
    setLoading(true);
    try {
      const { data, error } = await supabase.from("usuarios").select("*").order("nombre");
      if (error) throw error;
      setUsuarios(data || []);
    } catch (e) {
      console.error(e);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { cargar(); }, []);

  const paisesDe = usuarioId => {
    const filas = (usuarioPaises || []).filter(x => x.usuarioId === usuarioId);
    return filas.map(f => (paises || []).find(p => p.id === f.pais_id)).filter(Boolean);
  };

  const toggleEstado = async u => {
    const nuevo = u.estado === "Activo" ? "Inactivo" : "Activo";
    setUsuarios(prev => prev.map(x => x.id === u.id ? { ...x, estado: nuevo } : x));
    try {
      const { error } = await supabase.from("usuarios").update({ estado: nuevo }).eq("id", u.id);
      if (error) throw error;
    } catch (e) {
      setUsuarios(prev => prev.map(x => x.id === u.id ? { ...x, estado: u.estado } : x));
      alert("No se pudo cambiar el estado: " + (e.message || e));
    }
  };

  // Elimina el usuario y, para no dejar registros huérfanos, también su fila de rol en
  // Accesos (proyecto_permisos) y sus países asignados (proyecto_usuario_paises) — así
  // "Accesos" queda al día solo, sin tener que borrar nada aparte ahí. Estas dos tablas
  // son opcionales (ver README), así que si todavía no existen simplemente no hacen nada.
  const eliminar = async () => {
    setDeleting(true);
    try {
      const { error } = await supabase.from("usuarios").delete().eq("id", toDelete.id);
      if (error) throw error;
      try { await supabase.from("proyecto_permisos").delete().eq("usuarioId", toDelete.id); } catch (e) { /* tabla opcional */ }
      try { await supabase.from("proyecto_usuario_paises").delete().eq("usuarioId", toDelete.id); } catch (e) { /* tabla opcional */ }
      setToDelete(null);
      await cargar();
      onChanged && onChanged();
    } catch (e) {
      alert("No se pudo eliminar el usuario: " + (e.message || e));
    } finally {
      setDeleting(false);
    }
  };

  return (
    <Card mb={0}>
      <CardHeader icon="ti-users" left={"Usuarios (" + usuarios.length + ")"} right={
        <React.Fragment>
          <span style={{fontSize:11,color:y.text3}}>Cuentas que pueden entrar a esta página (misma base que Kielsa CI)</span>
          <Btn sm primary onClick={() => setFormAbierto({})}><i className="ti ti-user-plus"/> Agregar usuario</Btn>
        </React.Fragment>
      } />
      {!usuarioPaisesDisponibles && (
        <div style={{padding:"0.6rem 1.1rem",fontSize:11.5,color:y.text3,background:"#fffbea",borderBottom:"1px solid "+y.border}}>
          El campo de país por usuario todavía no está activado en Supabase (ver README). Mientras tanto no se muestra ni se puede asignar.
        </div>
      )}
      {loading ? (
        <div style={{padding:"2rem",textAlign:"center",fontSize:12,color:y.text3}}>Cargando...</div>
      ) : (
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead>
            <tr style={{background:y.grayBg}}>
              <th style={{padding:"0.5rem 0.75rem",textAlign:"left",fontSize:10,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>Nombre</th>
              <th style={{padding:"0.5rem 0.75rem",textAlign:"left",fontSize:10,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>Usuario</th>
              <th style={{padding:"0.5rem 0.75rem",textAlign:"left",fontSize:10,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>País</th>
              <th style={{padding:"0.5rem 0.75rem",textAlign:"left",fontSize:10,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>Estado</th>
              <th style={{padding:"0.5rem 0.75rem",textAlign:"right",fontSize:10,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>Acciones</th>
            </tr>
          </thead>
          <tbody>
            {usuarios.length === 0 && (
              <tr><td colSpan={5} style={{padding:"1.5rem",textAlign:"center",color:y.text3,fontSize:12}}>Sin usuarios</td></tr>
            )}
            {usuarios.map(u => {
              const paisesU = paisesDe(u.id);
              const todosPaises = (paises || []).length > 0 && paisesU.length === (paises || []).length;
              return (
                <tr key={u.id} style={{borderTop:"1px solid "+y.border}}>
                  <td style={{padding:"0.55rem 0.75rem",fontSize:12.5,fontWeight:700,color:y.text}}>{u.nombre || "—"}</td>
                  <td style={{padding:"0.55rem 0.75rem",fontSize:12.5,color:y.text2}}>{u.usuario}</td>
                  <td style={{padding:"0.55rem 0.75rem",fontSize:12.5,color:y.text2,maxWidth:220}}>
                    {!usuarioPaisesDisponibles ? "—" :
                      todosPaises ? <span style={{fontWeight:600,color:y.primary}}>Todos los países</span> :
                      paisesU.length === 0 ? "—" :
                      paisesU.map(p => bandera(p.nombre)).join(" ") + " " + paisesU.map(p => p.nombre).join(", ")}
                  </td>
                  <td style={{padding:"0.55rem 0.75rem"}}>
                    <span style={{display:"inline-flex",alignItems:"center",padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:700,background: u.estado==="Activo" ? y.successBg : y.grayBg, color: u.estado==="Activo" ? y.success : y.gray}}>{u.estado || "—"}</span>
                  </td>
                  <td style={{padding:"0.55rem 0.75rem",textAlign:"right",whiteSpace:"nowrap"}}>
                    <Btn sm onClick={() => setFormAbierto(u)}><i className="ti ti-pencil"/> Editar</Btn>{" "}
                    <Btn sm onClick={() => toggleEstado(u)}>
                      <i className={"ti "+(u.estado === "Activo" ? "ti-lock" : "ti-lock-open")}/> {u.estado === "Activo" ? "Inactivar" : "Activar"}
                    </Btn>{" "}
                    <Btn sm danger disabled={session && u.id === session.id} title={session && u.id === session.id ? "No puedes eliminar tu propia cuenta mientras tienes la sesión abierta" : "Eliminar usuario"} onClick={() => setToDelete(u)}>
                      <i className="ti ti-trash"/>
                    </Btn>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      )}
      {formAbierto !== null && (
        <UsuarioFormModal
          paises={paises || []}
          editUser={formAbierto && formAbierto.id ? formAbierto : null}
          editPaisIds={formAbierto && formAbierto.id ? paisesDe(formAbierto.id).map(p => p.id) : []}
          onClose={() => setFormAbierto(null)}
          onSaved={() => { cargar(); onChanged && onChanged(); }}
        />
      )}
      {toDelete && (
        <ConfirmDelete
          titulo="Eliminar usuario"
          nombre={toDelete.nombre || toDelete.usuario}
          deleting={deleting}
          nota='También se quita su rol en "Accesos" y sus países asignados, si los tenía.'
          onConfirm={eliminar}
          onClose={() => setToDelete(null)}
        />
      )}
    </Card>
  );
}

/* ---------- Accesos (asignar rol por usuario) ---------- */
function AccesosView({ session, onChanged }) {
  const [usuarios, setUsuarios] = useState([]);
  const [permisos, setPermisos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [disponible, setDisponible] = useState(true);
  const [guardandoId, setGuardandoId] = useState(null);

  useEffect(() => {
    (async () => {
      setLoading(true);
      try {
        const [{ data: us, error: e1 }, { data: pe, error: e2 }] = await Promise.all([
          supabase.from("usuarios").select("*").order("nombre"),
          supabase.from("proyecto_permisos").select("*")
        ]);
        if (e1) throw e1;
        setUsuarios(us || []);
        if (e2) throw e2;
        setPermisos(pe || []);
        setDisponible(true);
      } catch (e) {
        console.warn("proyecto_permisos no disponible:", e.message || e);
        setDisponible(false);
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  const rolDe = usuarioId => {
    const row = permisos.find(p => p.usuarioId === usuarioId);
    return row ? row.rol : "admin";
  };

  const cambiarRol = async (usuarioId, nuevoRol) => {
    setGuardandoId(usuarioId);
    const existing = permisos.find(p => p.usuarioId === usuarioId);
    try {
      if (existing) {
        const { error } = await supabase.from("proyecto_permisos").update({ rol: nuevoRol }).eq("id", existing.id);
        if (error) throw error;
        setPermisos(list => list.map(p => p.id === existing.id ? { ...p, rol: nuevoRol } : p));
      } else {
        const { data, error } = await supabase.from("proyecto_permisos").insert({ usuarioId, rol: nuevoRol }).select();
        if (error) throw error;
        setPermisos(list => [...list, ...(data || [])]);
      }
      onChanged && onChanged();
    } catch (e) {
      alert("No se pudo cambiar el rol: " + (e.message || e));
    } finally {
      setGuardandoId(null);
    }
  };

  return (
    <React.Fragment>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:16}}>
        <div style={{background:y.primaryLight,border:"1px solid #c7d2fe",borderRadius:10,padding:"0.8rem 0.9rem"}}>
          <div style={{fontSize:12,fontWeight:800,color:y.primary,marginBottom:4}}>Administrador</div>
          <div style={{fontSize:11,color:y.text2,lineHeight:1.5}}>Acceso total: crear, editar, eliminar proyectos y gestionar usuarios.</div>
        </div>
        <div style={{background:y.warningBg,border:"1px solid #fde68a",borderRadius:10,padding:"0.8rem 0.9rem"}}>
          <div style={{fontSize:12,fontWeight:800,color:y.warning,marginBottom:4}}>Editor</div>
          <div style={{fontSize:11,color:y.text2,lineHeight:1.5}}>Crea y edita proyectos, mueve el Kanban y comenta. No puede eliminar ni gestionar usuarios.</div>
        </div>
        <div style={{background:y.grayBg,border:"1px solid "+y.border,borderRadius:10,padding:"0.8rem 0.9rem"}}>
          <div style={{fontSize:12,fontWeight:800,color:y.gray,marginBottom:4}}>Solo lectura</div>
          <div style={{fontSize:11,color:y.text2,lineHeight:1.5}}>Ve proyectos, filtra y exporta a Excel/PDF. No puede crear, editar ni comentar.</div>
        </div>
      </div>

      <Card mb={0}>
        <CardHeader icon="ti-shield-lock" left={"Accesos (" + usuarios.length + ")"} right={<span style={{fontSize:11,color:y.text3}}>Rol de cada usuario en esta página</span>} />
        {!disponible ? (
          <div style={{fontSize:12,color:y.text3,padding:"1.5rem",textAlign:"center"}}>Esta función todavía no está activada en la base de datos (falta crear la tabla "proyecto_permisos"). Mientras tanto, todos los usuarios activos tienen acceso completo (Administrador).</div>
        ) : loading ? (
          <div style={{fontSize:12,color:y.text3,padding:"1.5rem",textAlign:"center"}}>Cargando usuarios...</div>
        ) : (
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead>
              <tr style={{background:y.grayBg}}>
                <th style={{padding:"0.5rem 0.75rem",textAlign:"left",fontSize:10,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>Usuario</th>
                <th style={{padding:"0.5rem 0.75rem",textAlign:"left",fontSize:10,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>Estado</th>
                <th style={{padding:"0.5rem 0.75rem",textAlign:"left",fontSize:10,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>Rol en Proyectos</th>
              </tr>
            </thead>
            <tbody>
              {usuarios.map(u => (
                <tr key={u.id} style={{borderTop:"1px solid "+y.border}}>
                  <td style={{padding:"0.55rem 0.75rem",fontSize:12.5}}>
                    <div style={{fontWeight:700,color:y.text}}>{u.nombre || u.usuario}{u.id === session.id && <span style={{fontWeight:400,color:y.text3}}> (tú)</span>}</div>
                    <div style={{fontSize:10.5,color:y.text3}}>{u.usuario}</div>
                  </td>
                  <td style={{padding:"0.55rem 0.75rem"}}>
                    <span style={{display:"inline-flex",alignItems:"center",padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:700,background: u.estado==="Activo" ? y.successBg : y.grayBg, color: u.estado==="Activo" ? y.success : y.gray}}>{u.estado || "—"}</span>
                  </td>
                  <td style={{padding:"0.55rem 0.75rem"}}>
                    <select value={rolDe(u.id)} disabled={guardandoId === u.id} onChange={e => cambiarRol(u.id, e.target.value)} style={{...inputStyle,fontSize:12,width:"auto",padding:"0.3rem 0.5rem"}}>
                      <option value="admin">Administrador</option>
                      <option value="editor">Editor</option>
                      <option value="lector">Solo lectura</option>
                    </select>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </Card>
    </React.Fragment>
  );
}

/* ---------- Catálogo genérico (Áreas / Países / Responsables) ---------- */
function CatalogoView({ titulo, descripcion, icono, tabla, onChanged }) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [disponible, setDisponible] = useState(true);
  const [nuevo, setNuevo] = useState("");
  const [guardando, setGuardando] = useState(false);
  const [editandoId, setEditandoId] = useState(null);
  const [editandoTexto, setEditandoTexto] = useState("");

  const cargar = async () => {
    setLoading(true);
    try {
      const { data, error } = await supabase.from(tabla).select("*").order("nombre");
      if (error) throw error;
      setItems(data || []);
      setDisponible(true);
    } catch (e) {
      console.warn(tabla + " no disponible:", e.message || e);
      setDisponible(false);
    } finally {
      setLoading(false);
    }
  };
  useEffect(() => { cargar(); }, [tabla]);

  const agregar = async () => {
    const nombre = nuevo.trim();
    if (!nombre) return;
    setGuardando(true);
    try {
      const { data, error } = await supabase.from(tabla).insert({ nombre }).select();
      if (error) throw error;
      setItems(list => [...list, ...(data || [])].sort((a, b) => (a.nombre || "").localeCompare(b.nombre || "")));
      setNuevo("");
      onChanged && onChanged();
    } catch (e) {
      alert("No se pudo agregar: " + (e.message || e));
    } finally {
      setGuardando(false);
    }
  };

  const guardarEdicion = async (item) => {
    const nombre = editandoTexto.trim();
    if (!nombre) return;
    try {
      const { error } = await supabase.from(tabla).update({ nombre }).eq("id", item.id);
      if (error) throw error;
      setItems(list => list.map(i => i.id === item.id ? { ...i, nombre } : i));
      setEditandoId(null);
      onChanged && onChanged();
    } catch (e) {
      alert("No se pudo guardar: " + (e.message || e));
    }
  };

  const eliminar = async (item) => {
    if (!window.confirm('¿Eliminar "' + item.nombre + '"? Los proyectos que ya lo tengan asignado conservan el valor actual.')) return;
    setItems(list => list.filter(i => i.id !== item.id));
    try {
      const { error } = await supabase.from(tabla).delete().eq("id", item.id);
      if (error) throw error;
      onChanged && onChanged();
    } catch (e) {
      alert("No se pudo eliminar: " + (e.message || e));
      cargar();
    }
  };

  return (
    <Card mb={0}>
      <CardHeader icon={icono} left={titulo + " (" + items.length + ")"} right={<span style={{fontSize:11,color:y.text3}}>{descripcion}</span>} />
      <div style={{padding:"1rem 1.1rem"}}>
        {!disponible ? (
          <div style={{fontSize:12,color:y.text3}}>Esta función todavía no está activada en la base de datos (falta crear la tabla "{tabla}"). Mientras tanto, el formulario de proyectos sigue funcionando con la lista anterior.</div>
        ) : loading ? (
          <div style={{fontSize:12,color:y.text3}}>Cargando...</div>
        ) : (
          <React.Fragment>
            <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:14}}>
              {items.length === 0 && <div style={{fontSize:12,color:y.text3}}>Sin registros todavía — agrega el primero abajo.</div>}
              {items.map(item => (
                <div key={item.id} style={{display:"flex",alignItems:"center",gap:8,background:y.grayBg,border:"1px solid "+y.border,borderRadius:8,padding:"6px 10px"}}>
                  {editandoId === item.id ? (
                    <React.Fragment>
                      <input value={editandoTexto} onChange={e => setEditandoTexto(e.target.value)} onKeyDown={e => { if (e.key === "Enter") guardarEdicion(item); if (e.key === "Escape") setEditandoId(null); }} style={{...inputStyle,fontSize:12,flex:1}} autoFocus />
                      <Btn sm primary onClick={() => guardarEdicion(item)}><i className="ti ti-check"/></Btn>
                      <Btn sm onClick={() => setEditandoId(null)}><i className="ti ti-x"/></Btn>
                    </React.Fragment>
                  ) : (
                    <React.Fragment>
                      <span style={{flex:1,fontSize:13,color:y.text}}>{item.nombre}</span>
                      <button onClick={() => { setEditandoId(item.id); setEditandoTexto(item.nombre); }} style={{background:"none",border:"none",color:y.text3,cursor:"pointer",fontSize:14,padding:4}}><i className="ti ti-pencil"/></button>
                      <button onClick={() => eliminar(item)} style={{background:"none",border:"none",color:y.text3,cursor:"pointer",fontSize:15,lineHeight:1,padding:4}}>×</button>
                    </React.Fragment>
                  )}
                </div>
              ))}
            </div>
            <div style={{display:"flex",gap:6}}>
              <input value={nuevo} onChange={e => setNuevo(e.target.value)} onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); agregar(); } }} placeholder="Nuevo..." style={{...inputStyle,fontSize:13}} />
              <Btn primary sm disabled={guardando || !nuevo.trim()} onClick={agregar}><i className="ti ti-plus"/> Agregar</Btn>
            </div>
          </React.Fragment>
        )}
      </div>
    </Card>
  );
}

/* ---------- Carga de trabajo por persona ---------- */
// No necesita tabla nueva: junta las tareas del Cronograma de TODOS los proyectos
// (que ya se cargan para las alertas y el avance) y las agrupa por responsable.
function CargaTrabajoView({ tareas, proyectos }) {
  const proyectoPorId = useMemo(() => {
    const map = {};
    proyectos.forEach(p => { map[p.id] = p; });
    return map;
  }, [proyectos]);

  const carga = useMemo(() => {
    const map = {};
    tareas.forEach(t => {
      const est = estatusEfectivoTarea(t);
      if (est === "Completada") return; // la carga solo cuenta tareas activas
      const nombre = t.responsable && t.responsable.trim() ? t.responsable.trim() : "Sin asignar";
      if (!map[nombre]) map[nombre] = { nombre, activas:0, vencidas:0, proyectoIds: new Set() };
      map[nombre].activas++;
      if (est === "Vencida") map[nombre].vencidas++;
      if (t.proyectoId) map[nombre].proyectoIds.add(t.proyectoId);
    });
    return Object.values(map).sort((a, b) => b.activas - a.activas);
  }, [tareas]);

  const totalActivas = carga.reduce((s, c) => s + c.activas, 0);

  return (
    <Card mb={0}>
      <CardHeader icon="ti-users-group" left={"Carga de trabajo (" + carga.length + " personas)"} right={<span style={{fontSize:11,color:y.text3}}>{totalActivas} tareas activas en total, de todos los proyectos</span>} />
      <div style={{padding:"1rem 1.1rem"}}>
        {tareas.length === 0 ? (
          <div style={{fontSize:12,color:y.text3}}>Todavía no hay tareas del Cronograma en ningún proyecto — esta vista se llena sola en cuanto empieces a usar la pestaña Cronograma.</div>
        ) : carga.length === 0 ? (
          <div style={{fontSize:12,color:y.text3}}>Nadie tiene tareas activas en este momento — todo está completado.</div>
        ) : (
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5}}>
              <thead>
                <tr style={{background:y.grayBg}}>
                  {["Responsable","Tareas activas","Vencidas","Proyectos","Carga"].map(h => (
                    <th key={h} style={{textAlign:"left",fontSize:10,fontWeight:800,color:y.text3,textTransform:"uppercase",letterSpacing:.3,padding:"0.55rem 0.6rem",borderBottom:"1px solid "+y.border,whiteSpace:"nowrap"}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {carga.map(c => {
                  const nivel = nivelCarga(c.activas);
                  const [nivelBg, nivelColor] = CARGA_COLOR[nivel];
                  const nombresProyectos = Array.from(c.proyectoIds).map(id => (proyectoPorId[id] || {}).nombre).filter(Boolean);
                  return (
                    <tr key={c.nombre} style={{borderBottom:"1px solid "+y.grayBg}}>
                      <td style={{padding:"0.55rem 0.6rem",fontWeight:700,color: c.nombre === "Sin asignar" ? y.text3 : y.text}}>{c.nombre}</td>
                      <td style={{padding:"0.55rem 0.6rem"}}>
                        <span style={{display:"inline-block",width:60,height:6,borderRadius:20,background:y.border,position:"relative",marginRight:8,verticalAlign:"middle"}}>
                          <span style={{position:"absolute",left:0,top:0,bottom:0,borderRadius:20,background:nivelColor,width:Math.min(c.activas*15,100)+"%"}}/>
                        </span>
                        {c.activas}
                      </td>
                      <td style={{padding:"0.55rem 0.6rem",color: c.vencidas > 0 ? y.danger : y.text3,fontWeight: c.vencidas > 0 ? 700 : 400}}>{c.vencidas || "—"}</td>
                      <td style={{padding:"0.55rem 0.6rem",color:y.text3,maxWidth:280,fontSize:11.5}} title={nombresProyectos.join(", ")}>{nombresProyectos.length > 0 ? nombresProyectos.join(", ") : "—"}</td>
                      <td style={{padding:"0.55rem 0.6rem"}}>
                        <span style={{display:"inline-flex",padding:"3px 9px",borderRadius:20,fontSize:10.5,fontWeight:700,background:nivelBg,color:nivelColor,whiteSpace:"nowrap"}}>{nivel}</span>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </Card>
  );
}

/* ---------- Evaluación Financiera de un proyecto (formulario + proyección calculada) ---------- */
function EvaluacionFinancieraPanel({ proyecto, evaluacion, paisTexto, puedeEditar, onChanged, onClose }) {
  // El padre monta este panel con key={proyecto.id}, así que este estado inicial solo se
  // calcula una vez por proyecto seleccionado (no hace falta sincronizarlo con un useEffect).
  const [campos, setCampos] = useState(() => {
    const base = evaluacionFinancieraVacia();
    if (evaluacion) {
      Object.keys(base).forEach(k => {
        if (evaluacion[k] === null || evaluacion[k] === undefined) return;
        base[k] = EVAL_FIN_PCT_FIELDS.includes(k) ? String(Number(evaluacion[k]) * 100) : String(evaluacion[k]);
      });
    }
    return base;
  });
  const [guardando, setGuardando] = useState(false);

  const set = (k, v) => setCampos(c => ({ ...c, [k]: v }));

  const evParaCalculo = useMemo(() => {
    const o = {};
    EVAL_FIN_PCT_FIELDS.forEach(k => o[k] = numEval(campos[k]) / 100);
    EVAL_FIN_NUM_FIELDS.forEach(k => o[k] = numEval(campos[k]));
    return o;
  }, [campos]);

  const calc = useMemo(() => calcularEvaluacionFinanciera(evParaCalculo), [evParaCalculo]);
  const tieneDatos = numEval(campos.ventas_ano1) > 0 || numEval(campos.inversion_inicial) > 0;
  const veredicto = veredictoFinanciero(calc.roi, calc.vpn);

  const guardar = async () => {
    setGuardando(true);
    try {
      const payload = { proyectoId: proyecto.id, problema: campos.problema.trim() || null, objetivo: campos.objetivo.trim() || null };
      EVAL_FIN_PCT_FIELDS.forEach(k => payload[k] = campos[k] === "" ? null : numEval(campos[k]) / 100);
      EVAL_FIN_NUM_FIELDS.forEach(k => payload[k] = campos[k] === "" ? null : numEval(campos[k]));
      if (evaluacion && evaluacion.id) {
        const { error } = await supabase.from("proyecto_evaluaciones_financieras").update(payload).eq("id", evaluacion.id);
        if (error) throw error;
      } else {
        const { error } = await supabase.from("proyecto_evaluaciones_financieras").insert(payload);
        if (error) throw error;
      }
      await onChanged();
    } catch (e) {
      alert("No se pudo guardar la Evaluación Financiera: " + (e.message || e) + (/relation|column/i.test(e.message || "") ? "\n\n(Puede que falte correr el SQL de Evaluación Financiera en Supabase — ver README.)" : ""));
    } finally {
      setGuardando(false);
    }
  };

  const nombreArchivoBase = (proyecto.codigo || proyecto.nombre || "proyecto").toString().replace(/[^\w\-]+/g, "_").substring(0, 40);

  const filasProyeccion = [
    ["Ingresos totales", calc.ingresos, calc.ingresosTotal3, formatearMonedaEval, false],
    ["(-) Costo de Ventas", calc.cogs, calc.cogsTotal3, formatearMonedaEval, false],
    ["Margen bruto", calc.margenBruto, calc.margenBrutoTotal3, formatearMonedaEval, true],
    ["Margen bruto %", calc.margenBrutoPct, null, n => formatearPctEval(n), false],
    ["(-) Gastos operativos", calc.opex, null, formatearMonedaEval, false],
    ["(+) Ahorros operativos", calc.ahorros, null, formatearMonedaEval, false],
    ["(-) Licencias / software / cloud", calc.lic, null, formatearMonedaEval, false],
    ["(-) Gastos de desarrollo (TI)", calc.dev, null, formatearMonedaEval, false],
    ["(-) Otros gastos / contingencia", calc.otros, null, formatearMonedaEval, false],
    ["Beneficio operativo (EBITDA)", calc.ebitda, calc.ebitdaTotal3, formatearMonedaEval, true],
    ["Margen EBITDA %", calc.margenEbitdaPct, null, n => formatearPctEval(n), false],
    ["Flujo de caja neto", calc.flujo, calc.flujoTotal3, formatearMonedaEval, true],
    ["Flujo de caja acumulado", calc.acumulado, null, formatearMonedaEval, false]
  ];
  // Sin datos (evaluación todavía vacía): los valores numéricos "en bruto" darían 0 o cerca de
  // 0 y sus semáforos mostrarían veredictos engañosos (p.ej. "🔴 Destruye valor" para un VPN de
  // 0 L, o "✅ Rápido" para un payback de 0 años). Con !tieneDatos se muestra "Sin datos" en gris.
  const sinDatos = { texto: "Sin datos", color: y.gray, bg: y.grayBg };
  const metricas = [
    ["ROI (Retorno sobre inversión)", formatearPctEval(calc.roi), semaforoROI(calc.roi), "Por cada L invertida, ¿cuánto ganas? ROI > 0% significa que el proyecto genera valor neto.", "Meta: > 50%"],
    ["VPN (Valor Presente Neto)", tieneDatos ? formatearMonedaEval(calc.vpn) : "—", tieneDatos ? semaforoVPN(calc.vpn) : sinDatos, "Valor de hoy de todos los flujos futuros del proyecto. VPN > 0 = crea riqueza.", "Meta: VPN > 0"],
    ["TIR (Tasa Interna de Retorno)", calc.tir != null ? formatearPctEval(calc.tir) : "N/D", tieneDatos ? semaforoTIR(calc.tir, calc.wacc) : sinDatos, "La tasa de rendimiento real del proyecto. TIR > WACC = supera el costo de capital.", "Meta: TIR > WACC (15%-20%)"],
    ["Payback (recuperación de inversión)", tieneDatos ? formatearAniosEval(calc.payback) : "—", tieneDatos ? semaforoPayback(calc.payback, calc.inversion) : sinDatos, "¿En cuántos años se recupera la inversión? Si supera 3 años, se proyecta con el flujo promedio.", "Meta: recuperar antes de la vida útil del proyecto"],
    ["Margen bruto promedio (3 años)", tieneDatos ? formatearPctEval(calc.margenBrutoProm) : "—", tieneDatos ? semaforoMargenProm(calc.margenBrutoProm) : sinDatos, "Porcentaje de ingresos que queda después de quitar el costo directo del producto/servicio.", "Referencia: 20% – 40%"],
    ["Relación Beneficio / Costo (B/C)", calc.bc != null ? calc.bc.toFixed(2) + "x" : "—", tieneDatos ? semaforoBC(calc.bc) : sinDatos, "Por cada L invertida, ¿cuántos recibe en beneficios? Más de 1.0x = rentable.", "Meta: > 1.5x"]
  ];
  // Totales a 3 años de cada línea de Supuestos base (el Excel los muestra en su propia columna
  // "Total 3 años" dentro de esa misma sección, línea por línea, no solo al final en el P&L).
  const ahorrosTotal3 = calc.ahorros[0] + calc.ahorros[1] + calc.ahorros[2];
  const opexTotal3 = calc.opex[0] + calc.opex[1] + calc.opex[2];
  const licTotal3 = calc.lic[0] + calc.lic[1] + calc.lic[2];
  const devTotal3 = calc.dev[0] + calc.dev[1] + calc.dev[2];
  const otrosTotal3 = calc.otros[0] + calc.otros[1] + calc.otros[2];
  const margenBrutoPctTotal = calc.ingresosTotal3 ? calc.margenBrutoTotal3 / calc.ingresosTotal3 : 0;
  const margenEbitdaPctTotal = calc.ingresosTotal3 ? calc.ebitdaTotal3 / calc.ingresosTotal3 : 0;
  const maxGrafico = Math.max(1, ...calc.ingresos, ...calc.gastosTotal, ...calc.ebitda.map(v => Math.abs(v)));
  const maxAcumulado = Math.max(1, ...calc.acumulado.map(v => Math.abs(v)));

  const exportarExcel = () => {
    const filas = [
      ["EVALUACIÓN FINANCIERA DE PROYECTOS"],
      ["Proyecto", proyecto.nombre || ""],
      ["Código", proyecto.codigo || ""],
      ["Responsable / Líder", proyecto.responsable || ""],
      ["Unidad / País", paisTexto || ""],
      ["Problema que resuelve", campos.problema || ""],
      ["Objetivo principal", campos.objetivo || ""],
      [],
      ["Concepto", "Año 1", "Año 2", "Año 3", "Total 3 años"]
    ];
    filasProyeccion.forEach(([label, valores, total]) => filas.push([label, valores[0], valores[1], valores[2], total != null ? total : ""]));
    filas.push([]);
    filas.push(["Métrica", "Resultado"]);
    metricas.forEach(([label, valor]) => filas.push([label, valor]));
    filas.push(["Veredicto", veredicto.texto]);
    const ws = XLSX.utils.aoa_to_sheet(filas);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Evaluación Financiera");
    XLSX.writeFile(wb, "Evaluacion_Financiera_" + nombreArchivoBase + ".xlsx");
  };

  const exportarPDF = () => {
    const doc = new window.jspdf.jsPDF({ orientation: "landscape" });
    doc.setFontSize(14);
    doc.text("Evaluación Financiera — " + (proyecto.nombre || ""), 14, 15);
    doc.setFontSize(9);
    doc.setTextColor(120);
    doc.text("Generado el " + new Date().toLocaleDateString("es-HN") + " · Veredicto: " + veredicto.texto.replace(/[✅🔴⚠️]/g, "").trim(), 14, 21);
    doc.autoTable({
      head: [["Concepto", "Año 1", "Año 2", "Año 3", "Total 3 años"]],
      body: filasProyeccion.map(([label, valores, total, fmt]) => [label, fmt(valores[0]), fmt(valores[1]), fmt(valores[2]), total != null ? fmt(total) : ""]),
      startY: 26,
      styles: { fontSize: 8, cellPadding: 2 },
      headStyles: { fillColor: [30, 77, 183] },
      margin: { left: 14, right: 14 }
    });
    const y2 = (doc.lastAutoTable ? doc.lastAutoTable.finalY : 26) + 8;
    doc.autoTable({
      head: [["Métrica financiera", "Resultado"]],
      body: metricas.map(([label, valor]) => [label, valor]),
      startY: y2,
      styles: { fontSize: 8.5, cellPadding: 2 },
      headStyles: { fillColor: [30, 77, 183] },
      margin: { left: 14, right: 14 },
      tableWidth: 130
    });
    doc.save("Evaluacion_Financiera_" + nombreArchivoBase + ".pdf");
  };

  // Fila de "Tasas de crecimiento anual": 2 celdas amarillas (% Año1→2 y % Año2→3) + Referencia +
  // ¿Para qué sirve? — las columnas E y F comparten el mismo color de fondo que la etiqueta,
  // igual que en el Excel original.
  const FilaTasa = (label, catBg, catColor, k2, k3, referencia, sirve) => (
    <tr key={k2}>
      <ExcCelda bg={catBg} color={catColor} bold>{label}</ExcCelda>
      <ExcInput value={campos[k2]} onChange={e => set(k2, e.target.value)} disabled={!puedeEditar} suffix="%" align="right" />
      <ExcInput value={campos[k3]} onChange={e => set(k3, e.target.value)} disabled={!puedeEditar} suffix="%" align="right" />
      <ExcCelda bg={catBg} color={EXC.tip} size={9}>{referencia}</ExcCelda>
      <ExcCelda bg={catBg} color={EXC.grayText3} size={9}>{sirve}</ExcCelda>
    </tr>
  );
  // Fila de "Supuestos base": Concepto | Año 1 (editable) | Año 2 (calculado) | Año 3 (calculado)
  // | Total 3 años — igual que el Excel, que ya muestra la proyección línea por línea aquí, no
  // solo agrupada más abajo en el Estado de Resultados.
  const FilaSupuesto = ({ label, labelColor, k, tipo, val2, val3, total, fmt, sinCrecimiento }) => (
    <tr key={k}>
      <ExcCelda color={labelColor}>{label}</ExcCelda>
      {tipo === "pct"
        ? <ExcInput value={campos[k]} onChange={e => set(k, e.target.value)} disabled={!puedeEditar} suffix="%" align="right" />
        : <ExcInput value={campos[k]} onChange={e => set(k, e.target.value)} disabled={!puedeEditar} prefix="L" align="right" />}
      <ExcCelda align="right" bg={sinCrecimiento ? EXC.grayBg : EXC.greenLight}>{fmt(val2)}</ExcCelda>
      <ExcCelda align="right" bg={sinCrecimiento ? EXC.grayBg : EXC.greenLight}>{fmt(val3)}</ExcCelda>
      <ExcCelda align="right" bold bg={EXC.totalBg}>{fmt(total)}</ExcCelda>
    </tr>
  );
  // Fila de gasto en Supuestos base (mismo layout que FilaSupuesto, pero con las columnas
  // calculadas en rojo — como el bloque "Gastos y costos" del Excel). Si `editable` es falso
  // (el caso del Costo de Ventas, que sale 100% del % de COGS), el Año 1 también se muestra
  // ya calculado en vez de como celda amarilla.
  const FilaGasto = ({ label, labelColor, k, val1, val2, val3, total, editable = true }) => (
    <tr key={k || label}>
      <ExcCelda color={labelColor}>{label}</ExcCelda>
      {editable
        ? <ExcInput value={campos[k]} onChange={e => set(k, e.target.value)} disabled={!puedeEditar} prefix="L" align="right" />
        : <ExcCelda align="right" bg={EXC.redLight}>{formatearMonedaEval(val1)}</ExcCelda>}
      <ExcCelda align="right" bg={EXC.redLight}>{formatearMonedaEval(val2)}</ExcCelda>
      <ExcCelda align="right" bg={EXC.redLight}>{formatearMonedaEval(val3)}</ExcCelda>
      <ExcCelda align="right" bold bg={EXC.totalBg}>{formatearMonedaEval(total)}</ExcCelda>
    </tr>
  );
  // Fila del Estado de Resultados / Flujo de Caja: etiqueta + Año1/Año2/Año3 + Total, con los
  // colores propios de cada línea (igual que el Excel — el bloque de "restas" en rojo, el
  // Margen Bruto en verde azulado, el EBITDA en azul, etc.)
  const FilaEstado = ({ label, vals, total, fmt, labelBg, labelColor, cellBg, cellColor, bold, totalBg, totalColor, labelBold }) => (
    <tr>
      <ExcCelda bg={labelBg != null ? labelBg : cellBg} color={labelColor != null ? labelColor : cellColor} bold={labelBold != null ? labelBold : bold}>{label}</ExcCelda>
      {vals.map((v, i) => <ExcCelda key={i} align="right" bg={cellBg} color={cellColor} bold={bold}>{fmt(v)}</ExcCelda>)}
      <ExcCelda align="right" bg={totalBg != null ? totalBg : cellBg} color={totalColor != null ? totalColor : cellColor} bold>{total != null ? fmt(total) : ""}</ExcCelda>
    </tr>
  );
  // Fila de la tabla de Métricas financieras clave: Métrica | Resultado | ¿Qué significa? |
  // Referencia/Meta | Semáforo — 5 columnas, igual que el Excel (el semáforo queda en texto
  // plano con su emoji, sin colorear la celda, tal como en el archivo original).
  const FilaMetrica = ([label, valor, sem, explica, referencia]) => (
    <tr key={label}>
      <ExcCelda bg={EXC.grayBg} color={EXC.navy} bold>{label}</ExcCelda>
      <ExcCelda bg={EXC.totalBg} color={EXC.navy} bold size={13} align="right">{valor}</ExcCelda>
      <ExcCelda color={EXC.grayText2} size={9.5}>{explica}</ExcCelda>
      <ExcCelda bg={EXC.grayBg} color={EXC.tip} size={9.5}>{referencia}</ExcCelda>
      <ExcCelda bg={EXC.grayBg} color={EXC.grayText} bold>{sem.texto}</ExcCelda>
    </tr>
  );
  // Barrita de una mini-gráfica de barras (Ingresos / Gastos / EBITDA por año, o Flujo acumulado).
  const Barrita = (valor, max, color) => (
    <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
      <div style={{width:"100%",height:90,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
        <div style={{width:"70%",height:Math.max(2, Math.round(Math.abs(valor) / max * 90)) + "px",background:color,borderRadius:"3px 3px 0 0"}} />
      </div>
      <div style={{fontSize:9.5,color:EXC.grayText3,fontWeight:700,textAlign:"center"}}>{formatearMonedaEval(valor)}</div>
    </div>
  );

  return (
    <Card>
      <CardHeader
        icon="ti-report-money"
        left={"Evaluación Financiera — " + (proyecto.nombre || "")}
        right={
          <React.Fragment>
            {puedeEditar && <Btn sm primary disabled={guardando} onClick={guardar}><i className="ti ti-device-floppy"/> {guardando ? "Guardando..." : "Guardar"}</Btn>}
            <Btn sm onClick={exportarExcel}><i className="ti ti-file-spreadsheet"/> Excel</Btn>
            <Btn sm onClick={exportarPDF}><i className="ti ti-file-type-pdf"/> PDF</Btn>
            {onClose && <Btn sm onClick={onClose}><i className="ti ti-x"/> Cerrar</Btn>}
          </React.Fragment>
        }
      />
      <div style={{padding:"1rem 1.1rem"}}>
        <div style={{overflowX:"auto",border:"1px solid "+EXC.border,borderRadius:8}}>
          <table style={{width:"100%",borderCollapse:"collapse",minWidth:960,tableLayout:"fixed"}}>
            <ExcColgroup />
            <tbody>
              <ExcBarra bg={EXC.navy} size={16}>EVALUACIÓN FINANCIERA DE PROYECTOS</ExcBarra>
              <ExcBarra bg={EXC.blue}>{(proyecto.codigo ? proyecto.codigo + " — " : "") + (proyecto.nombre || "")}  ·  Proyección a 3 Años</ExcBarra>

              {/* Leyenda de colores, igual convención que el archivo Excel original */}
              <tr>
                <ExcCelda colSpan={3} bg={EXC.yellowBg} color={EXC.yellowText} size={9}>  ✏️  Celdas con fondo amarillo = ingresa tu dato</ExcCelda>
                <ExcCelda colSpan={2} bg={EXC.grayBg} color={EXC.grayText} size={9}>  🔒  Fondo blanco/gris = fórmula automática</ExcCelda>
              </tr>

              {/* 📌 Identificación del proyecto */}
              <ExcBarra bg={EXC.navy}>  📌  IDENTIFICACIÓN DEL PROYECTO</ExcBarra>
              <tr>
                <ExcCelda bg={EXC.grayBg} color={EXC.navy} bold>Nombre del Proyecto</ExcCelda>
                <ExcInput colSpan={4} value={proyecto.nombre || ""} onChange={() => {}} disabled />
              </tr>
              <tr>
                <ExcCelda bg={EXC.grayBg} color={EXC.navy} bold>Responsable / Líder</ExcCelda>
                <ExcInput colSpan={4} value={proyecto.responsable || ""} onChange={() => {}} disabled />
              </tr>
              <tr>
                <ExcCelda bg={EXC.grayBg} color={EXC.navy} bold>Unidad / País</ExcCelda>
                <ExcInput colSpan={4} value={paisTexto || ""} onChange={() => {}} disabled />
              </tr>
              <tr>
                <ExcCelda bg={EXC.grayBg} color={EXC.navy} bold>Problema que resuelve (una línea)</ExcCelda>

                  <tr>

/* ---------- Vista: lista de proyectos + Evaluación Financiera de cada uno ---------- */
function EvaluacionFinancieraView({ proyectos, paises, evaluaciones, puedeEditar, onChanged }) {
  const [selectedId, setSelectedId] = useState(null);
  const [busqueda, setBusqueda] = useState("");
  const [creando, setCreando] = useState(false);

  const evalPorProyecto = useMemo(() => {
    const m = {};
    evaluaciones.forEach(e => { m[e.proyectoId] = e; });
    return m;
  }, [evaluaciones]);

  const nombrePais = id => { const p = paises.find(x => x.id === id); return p ? p.nombre : ""; };

  // La lista solo muestra los proyectos que YA tienen una Evaluación Financiera creada
  // (a pedido tuyo: la lista empieza en blanco, y para asociar un proyecto nuevo se usa
  // el botón "Nueva evaluación" de abajo, que primero pregunta a qué proyecto amarrarla).
  const conEvaluacion = useMemo(() => proyectos.filter(p => evalPorProyecto[p.id]), [proyectos, evalPorProyecto]);
  const sinEvaluacion = useMemo(() =>
    proyectos.filter(p => !evalPorProyecto[p.id]).sort((a, b) => (a.nombre || "").localeCompare(b.nombre || "")),
    [proyectos, evalPorProyecto]
  );

  const filtrados = useMemo(() => {
    const q = busqueda.trim().toLowerCase();
    if (!q) return conEvaluacion;
    return conEvaluacion.filter(p => (p.nombre || "").toLowerCase().includes(q) || (p.codigo || "").toLowerCase().includes(q));
  }, [conEvaluacion, busqueda]);

  // El proyecto abierto puede o no estar en "filtrados": si se acaba de elegir en
  // "Nueva evaluación" todavía no tiene evaluación, así que no aparece en la tabla.
  const proyectoSeleccionado = useMemo(() => proyectos.find(p => p.id === selectedId) || null, [proyectos, selectedId]);
  const seleccionadoEstaEnTabla = proyectoSeleccionado ? filtrados.some(p => p.id === proyectoSeleccionado.id) : false;

  const elegirProyectoNuevo = (valor) => {
    setCreando(false);
    if (!valor) return;
    setSelectedId(parseInt(valor));
  };

  return (
    <Card mb={0}>
      <CardHeader
        icon="ti-report-money"
        left={"Evaluación Financiera Proyectos (" + conEvaluacion.length + " de " + proyectos.length + " proyectos)"}
        right={
          <React.Fragment>
            <input value={busqueda} onChange={e => setBusqueda(e.target.value)} placeholder="Buscar proyecto..." style={{...inputStyle,width:200,padding:"0.3rem 0.6rem",fontSize:12}} />
            {puedeEditar && <Btn sm primary onClick={() => { setCreando(c => !c); setSelectedId(null); }}><i className="ti ti-plus"/> Nueva evaluación</Btn>}
          </React.Fragment>
        }
      />

      {creando && (
        <div style={{padding:"0.75rem 1.1rem",borderBottom:"1px solid "+y.border,background:y.primaryLight,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
          <label style={{fontSize:12,fontWeight:700,color:y.text2,whiteSpace:"nowrap"}}>¿Para qué proyecto es esta evaluación?</label>
          <select defaultValue="" onChange={e => elegirProyectoNuevo(e.target.value)} style={{...inputStyle,width:360}}>
            <option value="" disabled>Selecciona un proyecto...</option>
            {sinEvaluacion.map(p => <option key={p.id} value={p.id}>{p.codigo ? p.codigo + " — " : ""}{p.nombre}</option>)}
          </select>
          {sinEvaluacion.length === 0 && <span style={{fontSize:12,color:y.text3}}>Todos los proyectos ya tienen una Evaluación Financiera creada.</span>}
          <Btn sm onClick={() => setCreando(false)}>Cancelar</Btn>
        </div>
      )}

      <div style={{padding: conEvaluacion.length === 0 ? "1rem 1.1rem" : 0}}>
        {conEvaluacion.length === 0 ? (
          <div style={{fontSize:12,color:y.text3}}>Todavía no has creado ninguna Evaluación Financiera. Usa el botón "Nueva evaluación" de arriba para elegir el proyecto y empezar.</div>
        ) : (
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5}}>
              <thead>
                <tr style={{background:y.grayBg}}>
                  {["Cód.","Nombre del proyecto","País","Estado de la evaluación",""].map(h => (
                    <th key={h} style={{textAlign:"left",fontSize:10,fontWeight:800,color:y.text3,textTransform:"uppercase",letterSpacing:.3,padding:"0.55rem 0.6rem",borderBottom:"1px solid "+y.border,whiteSpace:"nowrap"}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filtrados.length === 0 && (
                  <tr><td colSpan={5} style={{padding:"1.5rem",textAlign:"center",color:y.text3}}>Sin proyectos que coincidan con la búsqueda</td></tr>
                )}
                {filtrados.map(p => {
                  const ev = evalPorProyecto[p.id];
                  const seleccionado = selectedId === p.id;
                  const c = calcularEvaluacionFinanciera(ev);
                  const v = veredictoFinanciero(c.roi, c.vpn);
                  return (
                    <React.Fragment key={p.id}>
                      <tr onClick={() => { setCreando(false); setSelectedId(sel => sel === p.id ? null : p.id); }} style={{borderBottom: seleccionado ? "none" : "1px solid "+y.border,cursor:"pointer",background: seleccionado ? y.primaryLight : "transparent"}}>
                        <td style={{padding:"6px 8px",fontSize:12}}>{p.codigo}</td>
                        <td style={{padding:"6px 8px",fontSize:12,fontWeight:600,maxWidth:280}}>
                          {seleccionado && <i className="ti ti-chevron-down" style={{color:y.primary,marginRight:4}}/>}
                          {p.nombre}
                        </td>
                        <td style={{padding:"6px 8px",fontSize:12}}>{p.pais_id ? bandera(nombrePais(p.pais_id)) + " " + nombrePais(p.pais_id) : ""}</td>
                        <td style={{padding:"6px 8px"}}><span style={{display:"inline-flex",padding:"3px 9px",borderRadius:20,fontSize:10.5,fontWeight:700,background:v.bg,color:v.color}}>{v.texto}</span></td>
                        <td style={{padding:"6px 8px",textAlign:"right",whiteSpace:"nowrap"}}><Btn sm>Ver / editar</Btn></td>
                      </tr>
                      {seleccionado && (
                        <tr>
                          <td colSpan={5} style={{padding:"0.75rem 0.6rem",background:y.grayBg,borderBottom:"1px solid "+y.border}}>
                            <EvaluacionFinancieraPanel
                              key={p.id}
                              proyecto={p}
                              evaluacion={ev}
                              paisTexto={p.pais_id ? nombrePais(p.pais_id) : ""}
                              puedeEditar={puedeEditar}
                              onChanged={onChanged}
                              onClose={() => setSelectedId(null)}
                            />
                          </td>
                        </tr>
                      )}
                    </React.Fragment>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {proyectoSeleccionado && !seleccionadoEstaEnTabla && (
        <div style={{padding:"0.75rem 1.1rem",borderTop:"1px solid "+y.border,background:y.grayBg}}>
          <EvaluacionFinancieraPanel
            key={proyectoSeleccionado.id}
            proyecto={proyectoSeleccionado}
            evaluacion={evalPorProyecto[proyectoSeleccionado.id] || null}
            paisTexto={proyectoSeleccionado.pais_id ? nombrePais(proyectoSeleccionado.pais_id) : ""}
            puedeEditar={puedeEditar}
            onChanged={onChanged}
            onClose={() => setSelectedId(null)}
          />
        </div>
      )}
    </Card>
  );
}

/* ---------- Integración de Proyectos (módulo independiente, misma estructura y funciones que
   Proyectos, pero con sus propios datos: tablas "proyectos_integracion" / "integracion_tareas" /
   "integracion_comentarios" en vez de "proyectos" / "proyecto_tareas" / "proyecto_comentarios").
   Reutiliza los mismos componentes (ProjectModal, PlanAccionPanel, ConfirmDelete) generalizados
   con props de nombre de tabla, en vez de duplicar ese código. ---------- */
function IntegracionProyectosView({ paises, areasCatalogo, areasDisponibles, categoriasCatalogo, categoriasDisponibles, responsables, responsablesDisponibles, session, miRol }) {
  const categoriasEfectivas = (categoriasDisponibles && categoriasCatalogo && categoriasCatalogo.length > 0) ? categoriasCatalogo.map(c => c.nombre) : CATEGORIAS;
  const TABLA_PROYECTOS = "proyectos_integracion";
  const TABLA_TAREAS = "integracion_tareas";
  const TABLA_COMENTARIOS = "integracion_comentarios";

  const [proyectos, setProyectos] = useState([]);
  const [tareas, setTareas] = useState([]);
  const [loading, setLoading] = useState(true);
  const [tablaDisponible, setTablaDisponible] = useState(true);
  const [filtroCategoria, setFiltroCategoria] = useState("");
  const [filtroEstado, setFiltroEstado] = useState("");
  const [filtroPais, setFiltroPais] = useState("");
  const [modal, setModal] = useState(null);
  const [toDelete, setToDelete] = useState(null);
  const [deleting, setDeleting] = useState(false);
  const [selectedId, setSelectedId] = useState(null);
  const [renumerando, setRenumerando] = useState(false);

  const cargarTareas = async () => {
    try {
      const { data, error } = await supabase.from(TABLA_TAREAS).select("*").order("id");
      if (error) throw error;
      setTareas(data || []);
    } catch (e) {
      console.warn(TABLA_TAREAS + " no disponible:", e.message || e);
      setTareas([]);
    }
  };

  const cargarDatos = async () => {
    setLoading(true);
    try {
      const { data, error } = await supabase.from(TABLA_PROYECTOS).select("*").order("id");
      if (error) throw error;
      setProyectos(data || []);
      setTablaDisponible(true);
      await cargarTareas();
    } catch (e) {
      // Tabla todavía no creada en Supabase: se muestra un aviso con instrucciones (ver README)
      // en vez de tronar, igual que el resto de tablas opcionales de esta app.
      console.warn(TABLA_PROYECTOS + " no disponible:", e.message || e);
      setProyectos([]);
      setTareas([]);
      setTablaDisponible(false);
    }
    setLoading(false);
  };

  useEffect(() => { cargarDatos(); }, []);

  const puedeEditar = miRol === "admin" || miRol === "editor";
  const puedeEliminar = miRol === "admin";

  const tareasPorProyecto = useMemo(() => {
    const map = {};
    tareas.forEach(t => {
      if (!map[t.proyectoId]) map[t.proyectoId] = [];
      map[t.proyectoId].push(t);
    });
    return map;
  }, [tareas]);

  const nombrePais = id => { const p = paises.find(x => x.id === id); return p ? p.nombre : ""; };

  const filtrados = useMemo(() => proyectos.filter(p =>
    (!filtroCategoria || p.categoria === filtroCategoria) &&
    (!filtroEstado || p.estado === filtroEstado) &&
    (!filtroPais || p.pais_id === parseInt(filtroPais))
  ), [proyectos, filtroCategoria, filtroEstado, filtroPais]);

  const eliminar = async () => {
    setDeleting(true);
    try {
      const { error } = await supabase.from(TABLA_PROYECTOS).delete().eq("id", toDelete.id);
      if (error) throw error;
      setToDelete(null);
      cargarDatos();
    } catch (e) {
      console.error(e);
      alert("No se pudo eliminar: " + (e.message || e));
    } finally {
      setDeleting(false);
    }
  };

  // Reasigna el "Código" de TODOS los proyectos de integración como 1, 2, 3... según el orden
  // actual de la tabla (por id de creación), para quitar los huecos que dejan los eliminados.
  const renumerarCodigos = async () => {
    if (!proyectos.length) return;
    if (!window.confirm('Esto va a reemplazar el "Código" de los ' + proyectos.length + ' proyectos con un número correlativo (1, 2, 3...) según el orden actual de la tabla. Los códigos que tengas escritos a mano se van a perder. ¿Continuar?')) return;
    setRenumerando(true);
    try {
      const ordenados = [...proyectos].sort((a, b) => a.id - b.id);
      for (let i = 0; i < ordenados.length; i++) {
        const nuevoCodigo = String(i + 1);
        if (ordenados[i].codigo !== nuevoCodigo) {
          const { error } = await supabase.from(TABLA_PROYECTOS).update({ codigo: nuevoCodigo }).eq("id", ordenados[i].id);
          if (error) throw error;
        }
      }
      await cargarDatos();
    } catch (e) {
      alert("No se pudo renumerar: " + (e.message || e));
    } finally {
      setRenumerando(false);
    }
  };

  const exportarExcel = () => {
    const filas = filtrados.map(p => ({
      "Código": p.codigo || "",
      "Categoría": p.categoria || "",
      "Prioridad": p.prioridad === 1 ? "Alta" : p.prioridad === 2 ? "Media" : "Normal",
      "Nombre": p.nombre || "",
      "Área": p.area || "",
      "País": nombrePais(p.pais_id),
      "Responsable": p.responsable || "",
      "Ticket": p.ticket || "",
      "Fecha de solicitud": p.fecha_solicitud || "",
      "Fecha inicio": p.fecha_inicio || "",
      "Fecha fin": p.fecha_fin || "",
      "Avance (%)": Math.round(avanceEfectivo(p, tareasPorProyecto[p.id]) * 100),
      "Estado": p.estado || "",
      "Archivo": p.archivo_nombre || "",
      "Observación": p.observacion || ""
    }));
    const ws = XLSX.utils.json_to_sheet(filas);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Integración");
    XLSX.writeFile(wb, "Integracion_Proyectos_KielsaCI_" + new Date().toISOString().split("T")[0] + ".xlsx");
  };

  const exportarPDF = () => {
    const doc = new window.jspdf.jsPDF({ orientation: "landscape" });
    const filas = filtrados.map(p => [
      p.codigo || "",
      p.categoria || "",
      p.nombre || "",
      p.area || "",
      nombrePais(p.pais_id),
      p.responsable || "",
      (p.fecha_inicio || "") + (p.fecha_fin ? " → " + p.fecha_fin : ""),
      Math.round(avanceEfectivo(p, tareasPorProyecto[p.id]) * 100) + "%",
      p.estado || ""
    ]);
    doc.setFontSize(14);
    doc.text("Integración de Proyectos — Kielsa CI", 14, 15);
    doc.setFontSize(9);
    doc.setTextColor(120);
    doc.text("Generado el " + new Date().toLocaleDateString("es-HN") + " · " + filtrados.length + " proyecto(s)", 14, 21);
    doc.autoTable({
      head: [["Cód.", "Categoría", "Nombre", "Área", "País", "Responsable", "Fechas", "Avance", "Estado"]],
      body: filas,
      startY: 26,
      styles: { fontSize: 8, cellPadding: 2 },
      headStyles: { fillColor: [30, 77, 183] },
      margin: { left: 14, right: 14 }
    });
    doc.save("Integracion_Proyectos_KielsaCI_" + new Date().toISOString().split("T")[0] + ".pdf");
  };

  if (loading) {
    return (
      <div style={{textAlign:"center",padding:"4rem",color:y.text3}}>
        <i className="ti ti-loader-2" style={{fontSize:32}}/>
        <div style={{marginTop:8,fontSize:13}}>Cargando Integración de Proyectos...</div>
      </div>
    );
  }

  return (
    <React.Fragment>
      {!tablaDisponible && (
        <div style={{background:y.warningBg,border:"1px solid "+y.warning,borderRadius:10,padding:"0.85rem 1.1rem",marginBottom:16,fontSize:12.5,color:y.text2,display:"flex",alignItems:"center",gap:8}}>
          <i className="ti ti-alert-triangle" style={{color:y.warning,fontSize:16,flexShrink:0}}/>
          <span>Esta sección todavía no está activada en la base de datos — falta crear las tablas <code>{TABLA_PROYECTOS}</code>, <code>{TABLA_TAREAS}</code> y <code>{TABLA_COMENTARIOS}</code> en Supabase. Ver el README, sección "Activar Integración de Proyectos".</span>
        </div>
      )}
      <Card>
        <CardHeader
          icon="ti-git-merge"
          left={filtrados.length + " proyectos de integración"}
          right={
            <React.Fragment>
              <select value={filtroCategoria} onChange={e => setFiltroCategoria(e.target.value)} style={{fontSize:11,padding:"0.28rem 0.55rem",borderRadius:6,border:"1px solid "+y.border2,color:y.text2}}>
                <option value="">Todas las categorías</option>
                {categoriasEfectivas.map(c => <option key={c}>{c}</option>)}
              </select>
              <select value={filtroEstado} onChange={e => setFiltroEstado(e.target.value)} style={{fontSize:11,padding:"0.28rem 0.55rem",borderRadius:6,border:"1px solid "+y.border2,color:y.text2}}>
                <option value="">Todos los estados</option>
                {ESTADOS.map(s => <option key={s}>{s}</option>)}
              </select>
              <select value={filtroPais} onChange={e => setFiltroPais(e.target.value)} style={{fontSize:11,padding:"0.28rem 0.55rem",borderRadius:6,border:"1px solid "+y.border2,color:y.text2}}>
                <option value="">Todos los países</option>
                {paises.map(p => <option key={p.id} value={p.id}>{bandera(p.nombre)} {p.nombre}</option>)}
              </select>
              <Btn sm onClick={exportarExcel}><i className="ti ti-file-spreadsheet"/> Excel</Btn>
              <Btn sm onClick={exportarPDF}><i className="ti ti-file-type-pdf"/> PDF</Btn>
              {puedeEditar && (
                <Btn sm disabled={renumerando} onClick={renumerarCodigos} title="Vuelve a numerar el Código de todos los proyectos como 1, 2, 3... según el orden actual, sin huecos">
                  <i className="ti ti-sort-ascending-numbers"/> {renumerando ? "Renumerando..." : "Renumerar"}
                </Btn>
              )}
              {puedeEditar && <Btn primary sm onClick={() => setModal({mode:"add"})}><i className="ti ti-plus"/> Agregar proyecto</Btn>}
            </React.Fragment>
          }
        />

        <div style={{overflowX:"auto"}}>
          <table style={{borderCollapse:"collapse",width:"100%",minWidth:1100}}>
            <thead>
              <tr style={{background:y.grayBg}}>
                {["Cód.","Categoría","Nombre","Área","País","Responsable","Fechas","Avance","Estado","Acciones"].map(h => (
                  <th key={h} style={{padding:"0.5rem 0.6rem",textAlign:"left",fontSize:10,fontWeight:700,color:y.text3,borderBottom:"2px solid "+y.border2,textTransform:"uppercase",whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtrados.length === 0 && (
                <tr><td colSpan={10} style={{padding:"2rem",textAlign:"center",color:y.text3}}>Sin proyectos de integración</td></tr>
              )}
              {filtrados.map(p => {
                const tareasP = tareasPorProyecto[p.id] || [];
                const avancePct = Math.round(avanceEfectivo(p, tareasP)*100);
                const v = estadoVencimiento(p);
                const seleccionado = selectedId === p.id;
                return (
                  <React.Fragment key={p.id}>
                  <tr onClick={() => setSelectedId(sel => sel === p.id ? null : p.id)} style={{borderBottom: seleccionado ? "none" : "1px solid "+y.border,cursor:"pointer",background: seleccionado ? y.primaryLight : "transparent"}}>
                    <td style={{padding:"6px 8px",fontSize:12}}>{p.codigo}</td>
                    <td style={{padding:"6px 8px",fontSize:12}}>{p.categoria}</td>
                    <td style={{padding:"6px 8px",fontSize:12,fontWeight:600,maxWidth:260}}>
                      {seleccionado && <i className="ti ti-chevron-down" style={{color:y.primary,marginRight:4}}/>}
                      {p.nombre}
                    </td>
                    <td style={{padding:"6px 8px",fontSize:12}}>{p.area}</td>
                    <td style={{padding:"6px 8px",fontSize:12}}>{p.pais_id ? bandera(nombrePais(p.pais_id))+" "+nombrePais(p.pais_id) : ""}</td>
                    <td style={{padding:"6px 8px",fontSize:12}}>{p.responsable}</td>
                    <td style={{padding:"6px 8px",fontSize:11,color:y.text3}}>
                      {p.fecha_inicio}{p.fecha_fin ? " → "+p.fecha_fin : ""}
                      {v && (
                        <div style={{marginTop:2,fontSize:10,fontWeight:700,color: v.tipo==="vencido"?y.danger:y.warning}}>
                          <i className={"ti "+(v.tipo==="vencido"?"ti-alert-triangle":"ti-bell")}/> {v.tipo==="vencido" ? "Vencido hace "+v.dias+"d" : "Vence en "+v.dias+"d"}
                        </div>
                      )}
                    </td>
                    <td style={{padding:"6px 8px",fontSize:12}}>{avancePct}%{tareasP.length > 0 && <div style={{fontSize:10,color:y.text3}}>{tareasP.filter(t=>t.completada).length}/{tareasP.length} tareas</div>}</td>
                    <td style={{padding:"6px 8px"}}><Badge label={p.estado || "Pendiente"} /></td>
                    <td style={{padding:"6px 8px",whiteSpace:"nowrap"}} onClick={e => e.stopPropagation()}>
                      {puedeEditar && <Btn sm onClick={() => setModal({mode:"edit", project:p})}><i className="ti ti-pencil"/></Btn>}{" "}
                      {puedeEliminar && <Btn sm danger onClick={() => setToDelete(p)}><i className="ti ti-trash"/></Btn>}
                      {!puedeEditar && !puedeEliminar && <span style={{fontSize:11,color:y.text3}}>—</span>}
                    </td>
                  </tr>
                  {seleccionado && (
                    <tr>
                      <td colSpan={10} style={{padding:"0.75rem 0.6rem",background:y.grayBg,borderBottom:"1px solid "+y.border}}>
                        <PlanAccionPanel
                          proyecto={p}
                          tareasProyecto={tareasP}
                          responsables={responsables}
                          responsablesDisponibles={responsablesDisponibles}
                          puedeEditar={puedeEditar}
                          onTareasChanged={cargarTareas}
                          onClose={() => setSelectedId(null)}
                          tablaTareas={TABLA_TAREAS}
                        />
                      </td>
                    </tr>
                  )}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
        </div>
      </Card>

      {modal && (
        <ProjectModal
          paises={paises}
          session={session}
          areasCatalogo={areasCatalogo}
          areasDisponibles={areasDisponibles}
          categoriasCatalogo={categoriasCatalogo}
          categoriasDisponibles={categoriasDisponibles}
          responsables={responsables}
          responsablesDisponibles={responsablesDisponibles}
          editProject={modal.mode === "edit" ? modal.project : null}
          tareasProyecto={modal.mode === "edit" ? (tareasPorProyecto[modal.project.id] || []) : []}
          onTareasChanged={cargarTareas}
          puedeEditar={puedeEditar}
          onClose={() => setModal(null)}
          onSaved={() => { setModal(null); cargarDatos(); }}
          tablaProyectos={TABLA_PROYECTOS}
          tablaTareas={TABLA_TAREAS}
          tablaComentarios={TABLA_COMENTARIOS}
        />
      )}
      {toDelete && (
        <ConfirmDelete
          nombre={toDelete.nombre}
          deleting={deleting}
          onConfirm={eliminar}
          onClose={() => setToDelete(null)}
        />
      )}
    </React.Fragment>
  );
}

/* ---------- Menú lateral ---------- */
function Sidebar({ vista, setVista, miRol }) {
  const items = [
    { key:"usuarios", label:"Usuarios", icon:"ti-users", adminOnly:true },
    { key:"accesos", label:"Accesos", icon:"ti-shield-lock", adminOnly:true },
    { key:"areas", label:"Áreas", icon:"ti-building", adminOnly:true },
    { key:"categorias", label:"Categorías", icon:"ti-tag", adminOnly:true },
    { key:"paises", label:"Países", icon:"ti-world", adminOnly:true },
    { key:"responsables", label:"Responsables", icon:"ti-user-check", adminOnly:true },
    { key:"carga", label:"Carga de trabajo", icon:"ti-users-group", adminOnly:false },
    { key:"reportes", label:"Reportes", icon:"ti-chart-bar", adminOnly:false },
    { key:"proyectos", label:"Proyectos", icon:"ti-briefcase", adminOnly:false },

        <div key={it.key} onClick={() => setVista(it.key)} style={{

        }}>

          {it.label}
