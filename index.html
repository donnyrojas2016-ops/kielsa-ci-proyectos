/* ---------- Carga de trabajo ---------- */
// Nivel de carga según cuántas tareas activas (no completadas) tiene una persona
// en TODOS los proyectos a la vez. 1-2: Baja. 3-5: Media. 6+: Alta.
const CARGA_COLOR = {
  "Baja": [y.successBg, y.success],
  "Media": [y.warningBg, y.warning],
  "Alta": [y.dangerBg, y.danger]
};
function nivelCarga(activas) {
  if (activas <= 2) return "Baja";
  if (activas <= 5) return "Media";
  return "Alta";
}

// % de avance de una tarea individual: usa la columna nueva "porcentaje_avance" si existe;
// si la tarea es de antes de tener Cronograma, se deriva del check "completada" (100 o 0).
function avanceTarea(t) {
  if (t.porcentaje_avance !== null && t.porcentaje_avance !== undefined) return parseFloat(t.porcentaje_avance) || 0;
  return t.completada ? 100 : 0;
}

// Estatus que se muestra para una tarea: si ya se marcó "Completada" se respeta,
// si no, se revisa si ya se pasó de la fecha de entrega para marcarla "Vencida" sola,
// igual que ya hacemos con la fecha de vencimiento del proyecto.
function estatusEfectivoTarea(t) {
  const base = t.estatus || (t.completada ? "Completada" : "Pendiente");
  if (base === "Completada") return "Completada";
  if (!t.fecha_entrega) return base;
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const fin = new Date(t.fecha_entrega + "T00:00:00");
  if (!isNaN(fin.getTime()) && fin < hoy) return "Vencida";
  return base;
}

function duracionDias(inicio, entrega) {
  if (!inicio || !entrega) return null;
  const a = new Date(inicio + "T00:00:00");
  const b = new Date(entrega + "T00:00:00");
  if (isNaN(a.getTime()) || isNaN(b.getTime())) return null;
  return Math.round((b - a) / 86400000);
}

/* ---------- Días hábiles del Plan de acción ---------- */
// No se excluyen días festivos porque los proyectos son de varios países, cada uno con su propio calendario.
function esFinDeSemana(fecha) {
  const dow = fecha.getDay();
  return dow === 0 || dow === 6;
}

// Suma "dias" días hábiles a partir de fechaInicioISO (el día de inicio cuenta como día 1 si es hábil;
// si cae en fin de semana, el conteo arranca en el primer día hábil siguiente). Devuelve "YYYY-MM-DD".
function sumarDiasHabiles(fechaInicioISO, dias) {
  if (!fechaInicioISO) return null;
  const n = parseInt(dias) || 1;
  const fecha = new Date(fechaInicioISO + "T00:00:00");
  if (isNaN(fecha.getTime())) return null;
  let contados = 0;
  while (true) {
    if (!esFinDeSemana(fecha)) {
      contados++;
      if (contados >= n) break;
    }
    fecha.setDate(fecha.getDate() + 1);
  }
  const yy = fecha.getFullYear(), mm = String(fecha.getMonth() + 1).padStart(2, "0"), dd = String(fecha.getDate()).padStart(2, "0");
  return yy + "-" + mm + "-" + dd;
}

// Cuenta los días hábiles entre dos fechas ISO, ambas incluidas — para calcular "Días" de tareas
// que ya tenían fecha de inicio y de entrega guardadas, de antes de existir este campo.
function diasHabilesEntreFechas(inicioISO, finISO) {
  if (!inicioISO || !finISO) return null;
  const inicio = new Date(inicioISO + "T00:00:00");
  const fin = new Date(finISO + "T00:00:00");
  if (isNaN(inicio.getTime()) || isNaN(fin.getTime()) || fin < inicio) return null;
  let contados = 0;
  const fecha = new Date(inicio);
  while (fecha <= fin) {
    if (!esFinDeSemana(fecha)) contados++;
    fecha.setDate(fecha.getDate() + 1);
  }
  return contados;
}

// "Días" de una tarea: usa el valor guardado si existe; si es una tarea de antes de tener este
// campo (solo con fecha de inicio y de entrega), lo calcula a partir de esas fechas.
function diasHabilesTarea(t) {
  if (t.dias !== null && t.dias !== undefined && t.dias !== "") {
    const n = parseInt(t.dias);
    if (!isNaN(n)) return n;
  }
  return diasHabilesEntreFechas(t.fecha_inicio, t.fecha_entrega);
}

// % de avance que "debería" tener la tarea a la fecha de corte, según su Inicio y sus Días hábiles —
// para comparar avance real vs. avance planificado, igual que en el Cronograma en Excel.
function avancePlanTarea(t, fechaCorteISO) {
  if (!t.fecha_inicio) return null;
  const dias = diasHabilesTarea(t);
  if (!dias) return null;
  const inicio = new Date(t.fecha_inicio + "T00:00:00");
  const corte = new Date(fechaCorteISO + "T00:00:00");
  if (isNaN(inicio.getTime()) || isNaN(corte.getTime())) return null;
  if (corte < inicio) return 0;
  const transcurridos = diasHabilesEntreFechas(t.fecha_inicio, fechaCorteISO) || 0;
  return Math.max(0, Math.min(100, Math.round((transcurridos / dias) * 100)));
}

// Fecha de hoy en formato "YYYY-MM-DD", usada como fecha de corte del resumen del Plan de acción.
function fechaHoyISO() {
  const hoy = new Date();
  const yy = hoy.getFullYear(), mm = String(hoy.getMonth() + 1).padStart(2, "0"), dd = String(hoy.getDate()).padStart(2, "0");
  return yy + "-" + mm + "-" + dd;
}

const MESES_ABREV = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function formatearFechaCorta(iso) {
  if (!iso) return "—";
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d.getTime())) return iso;
  return String(d.getDate()).padStart(2,"0") + "-" + MESES_ABREV[d.getMonth()] + "-" + d.getFullYear();
}

// Traduce el estatus efectivo de una tarea a las etiquetas del resumen "Actividades por estado"
// (mismo significado, solo cambia cómo se llama ahí: Pendiente -> No iniciada, En proceso -> En progreso, Vencida -> Atrasada).
function estatusResumen(t) {
  const est = estatusEfectivoTarea(t);
  if (est === "Pendiente") return "No iniciada";
  if (est === "En proceso") return "En progreso";
  if (est === "Vencida") return "Atrasada";
  return est; // "Completada"
}

/* ---------- Evaluación Financiera de Proyectos ---------- */
// Convierte una entrada de formulario (texto) a número; vacío o inválido -> 0.
function numEval(v) {
  const n = parseFloat(v);
  return isFinite(n) ? n : 0;
}

// Calcula la proyección a 3 años de un proyecto (Ingresos, Gastos, Estado de resultados,
// Flujo de caja y las métricas clave ROI/VPN/TIR/Payback) a partir de los supuestos base del
// Año 1 y las tasas de crecimiento anual, siguiendo la lógica de "Formato BC Evaluación
// Financiera Proyectos.xlsx". Nota: el % de Costo de Ventas se aplica directo sobre las ventas
// (COGS = Ventas x %), tal como describe su propia nota de ayuda ("Retail/Farma típico: 55%-75%
// de COGS"); en el archivo original ese % venía jalado con una fórmula de otra hoja (el caso de
// negocio de un proyecto específico) que lo dejaba invertido y no aplica de forma general.
function calcularEvaluacionFinanciera(ev) {
  ev = ev || {};
  const ventas1 = numEval(ev.ventas_ano1);
  const ventas2 = ventas1 * (1 + numEval(ev.tasa_ingresos_a2));
  const ventas3 = ventas2 * (1 + numEval(ev.tasa_ingresos_a3));

  const ahorros1 = numEval(ev.ahorros_ano1);
  const ahorros2 = ahorros1 * (1 + numEval(ev.tasa_ahorros_a2));
  const ahorros3 = ahorros2 * (1 + numEval(ev.tasa_ahorros_a3));
  const ahorros = [ahorros1, ahorros2, ahorros3];

  // "Ingresos totales" toma solo Ventas (igual que la plantilla original): los Ahorros no
  // tienen costo de ventas asociado y se suman directo al Beneficio Operativo más abajo.
  const ingresos = [ventas1, ventas2, ventas3];
  const ingresosTotal3 = ventas1 + ventas2 + ventas3;

  const pctCogs = numEval(ev.pct_cogs);
  const cogs = ingresos.map(v => v * pctCogs);
  const cogsTotal3 = cogs[0] + cogs[1] + cogs[2];

  const crecer3 = (base, r2, r3) => {
    const a1 = numEval(base), a2 = a1 * (1 + r2), a3 = a2 * (1 + r3);
    return [a1, a2, a3];
  };
  const rG2 = numEval(ev.tasa_gastos_a2), rG3 = numEval(ev.tasa_gastos_a3);
  const opex = crecer3(ev.gastos_operativos_ano1, rG2, rG3);
  const lic = crecer3(ev.licencias_ano1, rG2, rG3);
  const dev = crecer3(ev.gastos_desarrollo_ano1, rG2, rG3);
  const otros = crecer3(ev.otros_gastos_ano1, rG2, rG3);

  const gastosTotal = [0, 1, 2].map(i => cogs[i] + opex[i] + lic[i] + dev[i] + otros[i]);
  const gastosTotal3 = gastosTotal[0] + gastosTotal[1] + gastosTotal[2];

  const margenBruto = [0, 1, 2].map(i => ingresos[i] - cogs[i]);
  const margenBrutoPct = [0, 1, 2].map(i => ingresos[i] ? margenBruto[i] / ingresos[i] : 0);
  const margenBrutoTotal3 = margenBruto[0] + margenBruto[1] + margenBruto[2];

  const ebitda = [0, 1, 2].map(i => margenBruto[i] - opex[i] - lic[i] - dev[i] - otros[i] + ahorros[i]);
  const margenEbitdaPct = [0, 1, 2].map(i => ingresos[i] ? ebitda[i] / ingresos[i] : 0);
  const ebitdaTotal3 = ebitda[0] + ebitda[1] + ebitda[2];

  const inversion = numEval(ev.inversion_inicial);
  const flujo = [ebitda[0] - inversion, ebitda[1], ebitda[2]];
  const flujoTotal3 = flujo[0] + flujo[1] + flujo[2];
  const acumulado = [flujo[0], flujo[0] + flujo[1], flujo[0] + flujo[1] + flujo[2]];

  const wacc = numEval(ev.wacc);
  const roi = inversion !== 0 ? (ebitdaTotal3 - inversion) / inversion : null;
  const vpn = flujo[0] / Math.pow(1 + wacc, 1) + flujo[1] / Math.pow(1 + wacc, 2) + flujo[2] / Math.pow(1 + wacc, 3);
  const tir = irrFinanciero([-inversion, ebitda[0], ebitda[1], ebitda[2]]);

  let payback = null;
  if (acumulado[0] >= 0) {
    payback = ebitda[0] !== 0 ? inversion / ebitda[0] : (inversion === 0 ? 0 : null);
  } else if (acumulado[1] >= 0) {
    payback = flujo[1] !== 0 ? 1 + Math.abs(acumulado[0]) / flujo[1] : null;
  } else if (acumulado[2] >= 0) {
    payback = flujo[2] !== 0 ? 2 + Math.abs(acumulado[1]) / flujo[2] : null;
  } else {
    const prom = (ebitda[0] + ebitda[1] + ebitda[2]) / 3;
    payback = prom !== 0 ? 3 + Math.abs(acumulado[2]) / prom : null;
  }
  if (payback != null && (!isFinite(payback) || payback < 0)) payback = null;

  const margenBrutoProm = (margenBrutoPct[0] + margenBrutoPct[1] + margenBrutoPct[2]) / 3;
  const bc = inversion !== 0 ? ebitdaTotal3 / Math.abs(inversion) : null;

  return {
    ahorros, ingresos, ingresosTotal3, cogs, cogsTotal3,
    opex, lic, dev, otros, gastosTotal, gastosTotal3,
    margenBruto, margenBrutoPct, margenBrutoTotal3,
    ebitda, margenEbitdaPct, ebitdaTotal3,
    inversion, flujo, flujoTotal3, acumulado,
    wacc, roi, vpn, tir, payback, margenBrutoProm, bc
  };
}

// TIR (tasa interna de retorno) por bisección: busca la tasa que hace VPN = 0.
// cashflows[0] es el año 0 (normalmente negativo, la inversión inicial).
function irrFinanciero(cashflows) {
  // Si todos los flujos son cero (todavía no se ha escrito ningún dato), no hay una TIR real que
  // calcular — sin este control, la bisección "encuentra" una tasa cualquiera en su primer
  // intento porque VPN(cualquier tasa) ya da 0, y eso mostraría un % inventado.
  if (cashflows.every(cf => !cf)) return null;
  const vpnA = rate => cashflows.reduce((s, cf, i) => s + cf / Math.pow(1 + rate, i), 0);
  let lo = -0.9999, hi = 50;
  let fLo = vpnA(lo), fHi = vpnA(hi);
  if (!isFinite(fLo) || !isFinite(fHi) || fLo * fHi > 0) return null;
  let mid = 0;
  for (let i = 0; i < 100; i++) {
    mid = (lo + hi) / 2;
    const fMid = vpnA(mid);
    if (Math.abs(fMid) < 1e-7) break;
    if (fLo * fMid < 0) { hi = mid; fHi = fMid; } else { lo = mid; fLo = fMid; }
  }
  return mid;
}

function formatearMonedaEval(n) {
  if (n == null || !isFinite(n)) return "—";
  // Mismo formato de número que la plantilla: #,##0 "L" (el sufijo "L" va después del número).
  const abs = Math.round(Math.abs(n)).toLocaleString("es-HN");
  return (n < 0 ? "-" : "") + abs + " L";
}
function formatearPctEval(n, dec) {
  if (n == null || !isFinite(n)) return "—";
  return (n * 100).toFixed(dec != null ? dec : 1) + "%";
}
function formatearAniosEval(n) {
  if (n == null || !isFinite(n)) return "—";
  return n.toFixed(1) + " años";
}

function semaforoROI(roi) {
  if (roi == null) return { texto: "Sin datos", color: y.gray, bg: y.grayBg };
  if (roi > 0.5) return { texto: "✅ Excelente (>50%)", color: y.success, bg: y.successBg };
  if (roi > 0) return { texto: "🟡 Positivo", color: y.warning, bg: y.warningBg };
  return { texto: "🔴 Negativo", color: y.danger, bg: y.dangerBg };
}
function semaforoVPN(vpn) {
  return vpn > 0 ? { texto: "✅ Crea valor", color: y.success, bg: y.successBg } : { texto: "🔴 Destruye valor", color: y.danger, bg: y.dangerBg };
}
function semaforoTIR(tir, wacc) {
  if (tir == null || !isFinite(tir)) return { texto: "⚠️ Revisar flujos", color: y.warning, bg: y.warningBg };
  return tir > wacc ? { texto: "✅ Supera el mínimo", color: y.success, bg: y.successBg } : { texto: "🔴 Por debajo del WACC", color: y.danger, bg: y.dangerBg };
}
function semaforoPayback(p, inversion) {
  if (p == null) {
    if (!inversion) return { texto: "Sin inversión", color: y.gray, bg: y.grayBg };
    return { texto: "🔴 No se recupera en 3 años", color: y.danger, bg: y.dangerBg };
  }
  if (p <= 2.5) return { texto: "✅ Rápido (≤2.5 años)", color: y.success, bg: y.successBg };
  if (p <= 5) return { texto: "🟡 Moderado (≤5 años)", color: y.warning, bg: y.warningBg };
  if (p <= 10) return { texto: "🟠 Largo (≤10 años)", color: "#c2610c", bg: "#fff1e6" };
  return { texto: "🔴 Muy largo (>10 años)", color: y.danger, bg: y.dangerBg };
}
function semaforoMargenProm(m) {
  if (m > 0.3) return { texto: "✅ Saludable (>30%)", color: y.success, bg: y.successBg };
  if (m > 0.15) return { texto: "🟡 Aceptable", color: y.warning, bg: y.warningBg };
  return { texto: "🔴 Revisar", color: y.danger, bg: y.dangerBg };
}
function semaforoBC(bc) {
  if (bc == null) return { texto: "Sin datos", color: y.gray, bg: y.grayBg };
  if (bc > 1.5) return { texto: "✅ Muy bueno (>1.5x)", color: y.success, bg: y.successBg };
  if (bc > 1) return { texto: "🟡 Aceptable (>1x)", color: y.warning, bg: y.warningBg };
  return { texto: "🔴 No rentable", color: y.danger, bg: y.dangerBg };
}
function veredictoFinanciero(roi, vpn) {
  if (roi == null || vpn == null) return { texto: "⚠️  Completar todos los datos", color: y.warning, bg: y.warningBg };
  if (roi > 0 && vpn > 0) return { texto: "✅  GO — Proyecto viable y rentable", color: y.success, bg: y.successBg };
  return { texto: "🔴  REVISAR — Ajustar supuestos financieros", color: y.danger, bg: y.dangerBg };
}

// Campos de entrada (los "amarillos" del Excel) y valores por defecto de una evaluación nueva.
const EVAL_FIN_PCT_FIELDS = ["tasa_ingresos_a2", "tasa_ingresos_a3", "tasa_gastos_a2", "tasa_gastos_a3", "tasa_ahorros_a2", "tasa_ahorros_a3", "pct_cogs", "wacc"];
const EVAL_FIN_NUM_FIELDS = ["ventas_ano1", "ahorros_ano1", "gastos_operativos_ano1", "licencias_ano1", "gastos_desarrollo_ano1", "otros_gastos_ano1", "inversion_inicial"];
function evaluacionFinancieraVacia() {
  const o = { problema: "", objetivo: "" };
  EVAL_FIN_PCT_FIELDS.forEach(k => o[k] = "");
  EVAL_FIN_NUM_FIELDS.forEach(k => o[k] = "");
  return o;
}

// Paleta EXACTA de "Formato BC Evaluación Financiera Proyectos.xlsx" (colores de relleno y de
// letra tomados directo del archivo), para que la sección se vea igual que el Excel original.
const EXC = {
  navy: "#1B3A6B", blue: "#2E5FA3", teal: "#00695C", tealLight: "#E0F2F1",
  purple: "#4527A0", gold: "#C8962A", red: "#C0392B", redLight: "#FDECEA",
  green: "#1A7A4A", greenLight: "#E8F5E9", orange: "#FF8F00",
  yellowBg: "#FFF8E1", yellowText: "#1565C0", tip: "#E65100",
  grayBg: "#F5F6FA", grayText: "#212121", grayText2: "#333333", grayText3: "#444444",
  totalBg: "#D6E4F7", border: "#D7DCE5", white: "#FFFFFF"
};
// Las 5 columnas reales de "Formato BC Evaluación Financiera Proyectos.xlsx" (columnas B a F de
// la hoja). Se fijan una sola vez aquí y TODAS las filas de la tabla las respetan (con colSpan
// cuando el Excel las combina) — así el encabezado de cada sección queda siempre alineado con
// sus propios datos, en vez de que cada bloque calcule su ancho por su cuenta.
function ExcColgroup() {
  return (
    <colgroup>
      <col style={{width:"30%"}} /><col style={{width:"16%"}} /><col style={{width:"16%"}} /><col style={{width:"17%"}} /><col style={{width:"21%"}} />

}
// Celda de solo lectura (texto o número ya calculado / traído de otra parte de la app).
function ExcCelda({ bg, color, bold, size, align, children, italic, colSpan }) {

  );
}
// Celda "amarilla" editable (el dato que tú escribes), o su versión deshabilitada (para los
// campos que en esta app se traen solos del proyecto, como Nombre/Responsable/País).
function ExcInput({ value, onChange, disabled, size, suffix, prefix, placeholder, type, align, colSpan, bg }) {

    <td colSpan={colSpan} style={{padding:0,background:disabled?"#EEE9D5":(bg||EXC.yellowBg),border:"1px solid "+EXC.border}}>

          style={{width:"100%",padding:"7px 10px",paddingLeft:prefix?4:10,paddingRight:suffix?26:10,border:"none",outline:"none",background:"transparent",color:disabled?EXC.grayText3:EXC.yellowText,fontWeight:700,fontSize:size||12.5,fontFamily:"inherit",textAlign:align||"left",fontStyle:disabled?"italic":"normal",cursor:disabled?"default":"text"}}
        />
        {suffix && <span style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",fontSize:11,color:disabled?EXC.grayText3:EXC.yellowText,fontWeight:700}}>{suffix}</span>}
      </div>
    </td>
  );
}
// Barra de sección a todo lo ancho, de B a F — igual que las únicas barras que en el Excel
// original SÍ están combinadas de verdad (título, subtítulo, Identificación, Tasas de crecimiento).
function ExcBarra({ bg, colSpan, size, children }) {
  return <tr><td colSpan={colSpan||5} style={{background:bg,color:"#fff",fontWeight:800,fontSize:size||12.5,padding:"9px 10px",border:"1px solid "+EXC.border}}>{children}</td></tr>;
}
// Barra "bandera": el color solo llena la primera columna (ancha), el resto de la fila queda en
// blanco sin borde — así se ven en el Excel original el resto de los encabezados de sección
// (Supuestos base, sus 3 bandas internas, Estado de Resultados, Flujo de Caja, Métricas, Gráficos).
function ExcBarraLabel({ bg, color, size, children }) {
  return (
    <tr>
      <td style={{background:bg,color:color||"#fff",fontWeight:800,fontSize:size||12,padding:"9px 10px",border:"1px solid "+EXC.border}}>{children}</td>
      <td colSpan={4} style={{border:"none",background:"transparent"}}></td>
    </tr>

}
// Fila de encabezados de columna. `spans` (opcional, debe sumar 5) permite combinar columnas
// igual que en el Excel; por defecto cada texto ocupa una sola columna. `goldLast` resalta en
// dorado la última columna — así es en la mayoría de las tablas del Excel, pero no en todas
// (p. ej. la de Tasas de crecimiento no la resalta), así que se puede desactivar. `sticky`
// (activado por defecto) hace que, mientras se baja dentro del recuadro con scroll propio, este
// encabezado se quede pegado arriba — así siempre se ve a qué columna corresponde cada dato.
function ExcFilaEncabezado({ cols, bg, spans, goldLast = true, sticky = true }) {
  return (
    <tr>
      {cols.map((c, i) => (
        <td key={i} colSpan={spans ? spans[i] : 1} style={{background: (goldLast && i === cols.length - 1) ? EXC.gold : (bg || EXC.navy),color:"#fff",fontWeight:800,fontSize:10.5,padding:"7px 10px",textTransform:"uppercase",letterSpacing:.3,border:"1px solid "+EXC.border,whiteSpace:"nowrap",position:sticky?"sticky":"static",top:sticky?0:"auto",zIndex:sticky?3:"auto"}}>{c}</td>
      ))}
    </tr>
  );
}

/* ---------- Carga masiva de planes de trabajo desde Excel ---------- */
// Convierte un valor de celda de Excel (número de serie, objeto Date o texto) a "YYYY-MM-DD".
function normalizarFechaExcel(v) {
  if (v === null || v === undefined || v === "") return null;
  if (v instanceof Date) {
    if (isNaN(v.getTime())) return null;
    const yy = v.getFullYear(), mm = String(v.getMonth() + 1).padStart(2, "0"), dd = String(v.getDate()).padStart(2, "0");
    return yy + "-" + mm + "-" + dd;
  }
  if (typeof v === "number") {
    // Fecha serial de Excel: días desde 1899-12-30.
    const ms = Date.UTC(1899, 11, 30) + v * 86400000;
    const d = new Date(ms);
    if (isNaN(d.getTime())) return null;
    const yy = d.getUTCFullYear(), mm = String(d.getUTCMonth() + 1).padStart(2, "0"), dd = String(d.getUTCDate()).padStart(2, "0");
    return yy + "-" + mm + "-" + dd;
  }
  const s = String(v).trim();
  if (!s) return null;
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.substring(0, 10);
  const m1 = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if (m1) return m1[3] + "-" + m1[2].padStart(2, "0") + "-" + m1[1].padStart(2, "0");
  const parsed = new Date(s);
  if (!isNaN(parsed.getTime())) {
    const yy = parsed.getFullYear(), mm = String(parsed.getMonth() + 1).padStart(2, "0"), dd = String(parsed.getDate()).padStart(2, "0");
    return yy + "-" + mm + "-" + dd;
  }
  return null;
}

// Lee un archivo .xlsx/.xls subido por el usuario y devuelve su primera hoja
// como una matriz de filas crudas (arreglo de arreglos), sin asumir dónde está el encabezado.
function leerArchivoExcel(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: "array", cellDates: true });
        const ws = wb.Sheets[wb.SheetNames[0]];
        resolve(XLSX.utils.sheet_to_json(ws, { header: 1, defval: "", raw: true, blankrows: true }));
      } catch (err) { reject(err); }
    };
    reader.onerror = () => reject(reader.error || new Error("No se pudo leer el archivo"));
    reader.readAsArrayBuffer(file);
  });
}

// Normaliza el nombre de una columna para reconocerla sin importar mayúsculas, acentos o espacios.
function normalizarClaveColumna(k) {
  return String(k || "").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "");
}

// Convierte las filas crudas del Excel (matriz de filas, tal como se leen del archivo) en tareas listas para guardar.
// No asume que el encabezado está en la primera fila: lo busca (la primera fila que tenga una
// columna reconocible como "Tarea"), para que también funcione con archivos que traen filas de
// título arriba de la tabla real — como el que exporta el propio botón "Excel" del Plan de acción
// ("Proyecto", "Código" y una fila en blanco antes del encabezado real).
// Cada tarea conserva su EDT (de la columna EDT, o su posición si no hay) y, si aplica,
// el EDT del que depende, para poder resolver esa dependencia una vez que las tareas ya tengan un id real o local.
function parsearFilasExcelTareas(filasCrudas) {
  let columnas = null;
  let indiceEncabezado = -1;
  for (let i = 0; i < filasCrudas.length; i++) {
    const fila = filasCrudas[i] || [];
    const mapaFila = {};
    fila.forEach((celda, col) => { mapaFila[normalizarClaveColumna(celda)] = col; });
    if (mapaFila["tarea"] !== undefined || mapaFila["titulo"] !== undefined || mapaFila["nombretarea"] !== undefined || mapaFila["nombre"] !== undefined) {
      columnas = mapaFila;
      indiceEncabezado = i;
      break;
    }
  }
  if (!columnas) return [];

  const valor = (fila, clave) => { const c = columnas[clave]; return c !== undefined ? fila[c] : undefined; };

  const tareas = [];
  for (let i = indiceEncabezado + 1; i < filasCrudas.length; i++) {
    const fila = filasCrudas[i];
    if (!fila || !fila.length) continue;

    const titulo = String(valor(fila,"tarea") || valor(fila,"titulo") || valor(fila,"nombretarea") || valor(fila,"nombre") || "").trim();
    if (!titulo) continue; // fila vacía o sin nombre de tarea: se ignora

    const responsable = String(valor(fila,"responsable") || "").trim();
    const fechaInicio = normalizarFechaExcel(valor(fila,"inicio") || valor(fila,"fechainicio") || valor(fila,"fechadeinicio"));
    let fechaEntrega = normalizarFechaExcel(valor(fila,"entrega") || valor(fila,"fechaentrega") || valor(fila,"fechadeentrega") || valor(fila,"vencimiento") || valor(fila,"terminado") || valor(fila,"fechaterminado"));

    const diasRaw = valor(fila,"dias") !== undefined && valor(fila,"dias") !== "" ? valor(fila,"dias") : valor(fila,"diashabiles");
    let dias = diasRaw !== undefined ? parseInt(diasRaw) : null;
    if (dias != null && isNaN(dias)) dias = null;
    // Si el archivo trae "Entrega" directo, se respeta esa fecha (y se calculan los Días a partir de ella si no vinieron).
    // Si en cambio trae "Días" pero no "Entrega", la fecha de entrega se calcula sola en días hábiles.
    if (!fechaEntrega && fechaInicio && dias) {
      fechaEntrega = sumarDiasHabiles(fechaInicio, dias);
    } else if (fechaEntrega && dias == null && fechaInicio) {
      dias = diasHabilesEntreFechas(fechaInicio, fechaEntrega);
    }

    const observaciones = String(valor(fila,"observaciones") || valor(fila,"observacion") || valor(fila,"notas") || "").trim();

    const avanceRaw = valor(fila,"avance") !== undefined && valor(fila,"avance") !== "" ? valor(fila,"avance") : valor(fila,"porcentajeavance");
    let avance = parseInt(avanceRaw);
    if (isNaN(avance)) avance = 0;
    avance = Math.max(0, Math.min(100, avance));

    let estatus = String(valor(fila,"estatus") || valor(fila,"estado") || "").trim();
    const estatusValido = TAREA_ESTADOS.find(e => e.toLowerCase() === estatus.toLowerCase());
    estatus = estatusValido || (avance >= 100 ? "Completada" : (avance > 0 ? "En proceso" : "Pendiente"));

    const dependeRaw = valor(fila,"dependede") || valor(fila,"dependedeedt") || valor(fila,"dependeidedt") || valor(fila,"edtdelaquedepende");
    let dependeEdt = null;
    if (dependeRaw !== undefined && dependeRaw !== null && String(dependeRaw).trim() !== "") {
      const n = parseInt(String(dependeRaw).replace(/[^\d]/g, ""));
      if (!isNaN(n)) dependeEdt = n;
    }

    const edtRaw = valor(fila,"edt");
    const edt = edtRaw !== undefined && edtRaw !== "" && !isNaN(parseInt(edtRaw)) ? parseInt(edtRaw) : (i - indiceEncabezado);

    tareas.push({
      _edt: edt,
      _dependeEdt: dependeEdt,
      titulo,
      responsable: responsable || null,
      fecha_inicio: fechaInicio,
      dias,
      fecha_entrega: fechaEntrega,
      porcentaje_avance: avance,
      estatus,
      completada: estatus === "Completada",
      observaciones: observaciones || null
    });
  }
  return tareas;
}

// Si el proyecto tiene tareas (Cronograma), el avance se calcula solo: promedio del % de avance de cada tarea.
// Si no tiene tareas todavía, se usa el % que la persona escribió a mano (compatibilidad con proyectos existentes).
function avanceEfectivo(proyecto, tareasDelProyecto) {
  if (tareasDelProyecto && tareasDelProyecto.length > 0) {
    const suma = tareasDelProyecto.reduce((s, t) => s + avanceTarea(t), 0);
    return (suma / tareasDelProyecto.length) / 100;
  }
  return parseFloat(proyecto.avance) || 0;
}

// Calcula si un proyecto está vencido o a punto de vencer según su fecha_fin real,
// sin depender de que alguien haya cambiado manualmente el campo "estado".
// Los proyectos ya Cumplidos o Cancelados no generan alerta.
function estadoVencimiento(p) {
  if (!p.fecha_fin) return null;
  if (p.estado === "Cumplido" || p.estado === "Cancelado") return null;
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const fin = new Date(p.fecha_fin + "T00:00:00");
  if (isNaN(fin.getTime())) return null;
  const dias = Math.round((fin - hoy) / 86400000);
  if (dias < 0) return { tipo: "vencido", dias: Math.abs(dias) };
  if (dias <= 7) return { tipo: "pronto", dias };
  return null;
}
function textoVencimiento(v) {
  if (v.tipo === "vencido") return "Vencido hace " + v.dias + (v.dias === 1 ? " día" : " días");
  if (v.dias === 0) return "Vence hoy";
  return "Vence en " + v.dias + (v.dias === 1 ? " día" : " días");
}

  const [fechaInicio, setFechaInicio] = useState(tarea ? tarea.fecha_inicio || "" : "");
  const [dias, setDias] = useState(() => {
    if (!tarea) return 1;
    const d = diasHabilesTarea(tarea);
    return d != null ? d : 1;
  });
  const [avance, setAvance] = useState(tarea ? avanceTarea(tarea) : 0);
  const [estatus, setEstatus] = useState(tarea ? (tarea.estatus || (tarea.completada ? "Completada" : "Pendiente")) : "Pendiente");

  const fechaEntregaCalculada = fechaInicio ? sumarDiasHabiles(fechaInicio, dias) : null;

  const guardar = () => {
    if (!titulo.trim()) { alert("El nombre de la tarea es obligatorio."); return; }

      responsable: responsable || null,
      depende_id: dependeId ? parseInt(dependeId) : null,

      dias: fechaInicio ? (parseInt(dias) || 1) : null,

      completada: estatus === "Completada",

          ) : (
            <input value={responsable} onChange={e => setResponsable(e.target.value)} style={{...inputStyle,fontSize:12.5}} />
          )}
        </div>
        <div>
          <label style={{...labelStyle,color:y.primary}}>Depende de</label>

        </div>
        <div>

        <Btn sm primary onClick={guardar}>{tarea ? "Guardar cambios" : "Agregar tarea"}</Btn>
      </div>
    </div>
  );
}

/* ---------- Plan de acción (Cronograma) del proyecto seleccionado ---------- */
function PlanAccionPanel({ proyecto, tareasProyecto, responsables, responsablesDisponibles, puedeEditar, onTareasChanged, onClose, tablaTareas = "proyecto_tareas" }) {
  const [cargando, setCargando] = useState(false);
  const [tareaForm, setTareaForm] = useState(null); // null | {mode:"add"} | {mode:"edit", tarea}

  const avancePctTareas = tareasProyecto.length ? Math.round(tareasProyecto.reduce((s,t) => s + avanceTarea(t), 0) / tareasProyecto.length) : 0;

  // Fecha de corte del resumen: siempre hoy. Días, % Plan y Desvío de cada tarea, calculados una
  // sola vez aquí para usarlos tanto en la tabla como en el resumen y las exportaciones.
  const hoy = fechaHoyISO();
  const filas = tareasProyecto.map(t => {
    const dias = diasHabilesTarea(t);
    const planPct = avancePlanTarea(t, hoy);
    const realPct = avanceTarea(t);
    const desvio = planPct != null ? realPct - planPct : null;
    return { t, dias, planPct, realPct, desvio };
  });
  const sumaDias = filas.reduce((s, f) => s + (f.dias || 0), 0);
  const avanceRealPonderado = sumaDias > 0 ? Math.round(filas.reduce((s, f) => s + f.realPct * (f.dias || 0), 0) / sumaDias) : avancePctTareas;
  const filasConPlan = filas.filter(f => f.planPct != null && f.dias);
  const sumaDiasConPlan = filasConPlan.reduce((s, f) => s + f.dias, 0);
  const avancePlanPonderado = sumaDiasConPlan > 0 ? Math.round(filasConPlan.reduce((s, f) => s + f.planPct * f.dias, 0) / sumaDiasConPlan) : null;
  const desviacionGeneral = avancePlanPonderado != null ? avanceRealPonderado - avancePlanPonderado : null;

  const ESTADOS_RESUMEN = ["Completada","En progreso","Atrasada","No iniciada"];
  const ESTADO_RESUMEN_COLOR = { "Completada": TAREA_ESTADO_COLOR["Completada"], "En progreso": TAREA_ESTADO_COLOR["En proceso"], "Atrasada": TAREA_ESTADO_COLOR["Vencida"], "No iniciada": TAREA_ESTADO_COLOR["Pendiente"] };
  const conteoEstados = { "Completada": 0, "En progreso": 0, "Atrasada": 0, "No iniciada": 0 };
  filas.forEach(f => { const r = estatusResumen(f.t); if (conteoEstados[r] !== undefined) conteoEstados[r]++; });
  const totalTareas = tareasProyecto.length;

  const guardarTarea = async (payload) => {
    setCargando(true);
    try {
      if (tareaForm && tareaForm.mode === "edit") {
        const { error } = await supabase.from(tablaTareas).update(payload).eq("id", tareaForm.tarea.id);
        if (error) throw error;
      } else {
        const { error } = await supabase.from(tablaTareas).insert({ proyectoId: proyecto.id, ...payload });
        if (error) throw error;
      }
      setTareaForm(null);
      await onTareasChanged();
    } catch (e) {
      alert("No se pudo guardar la tarea: " + (e.message || e) + (/column/i.test(e.message||"") ? "\n\n(Puede que falte correr el SQL del Cronograma en Supabase — ver README.)" : ""));
    } finally {
      setCargando(false);
    }
  };

  const eliminarTarea = async (tarea) => {
    if (!window.confirm('¿Eliminar la tarea "' + tarea.titulo + '"?')) return;
    setCargando(true);
    try {
      const { error } = await supabase.from(tablaTareas).delete().eq("id", tarea.id);
      if (error) throw error;
      await onTareasChanged();
    } catch (e) {
      alert("No se pudo eliminar la tarea: " + (e.message || e));
    } finally {
      setCargando(false);
    }
  };

  const importarTareasExcel = async (tareasParsed) => {
    setCargando(true);
    try {
      const filas = tareasParsed.map(t => {
        const { _edt, _dependeEdt, ...resto } = t;
        return { proyectoId: proyecto.id, ...resto };
      });
      const { data: insertadas, error } = await supabase.from(tablaTareas).insert(filas).select();
      if (error) throw error;
      // Resolver las dependencias EDT -> id real, entre tareas del mismo archivo importado.
      const edtAIndice = {};
      tareasParsed.forEach((t, i) => { edtAIndice[t._edt] = i; });
      for (let i = 0; i < tareasParsed.length; i++) {
        const dEdt = tareasParsed[i]._dependeEdt;
        const j = dEdt != null ? edtAIndice[dEdt] : undefined;
        if (j !== undefined && insertadas[j] && insertadas[i]) {
          await supabase.from(tablaTareas).update({ depende_id: insertadas[j].id }).eq("id", insertadas[i].id);
        }
      }
      await onTareasChanged();
    } catch (e) {
      alert("No se pudo importar el plan de trabajo: " + (e.message || e) + (/column/i.test(e.message||"") ? "\n\n(Puede que falte correr el SQL del Cronograma en Supabase — ver README.)" : ""));
    } finally {
      setCargando(false);
    }
  };

  const nombreArchivoBase = (proyecto.codigo || proyecto.nombre || "proyecto").toString().replace(/[^\w\-]+/g,"_").substring(0,40);

  const exportarPlanExcel = () => {
    const filasExcel = [
      ["Proyecto", proyecto.nombre || ""],
      ["Código", proyecto.codigo || ""],
      ["Fecha de corte", formatearFechaCorta(hoy)],
      ["Avance real (ponderado por días)", avanceRealPonderado + "%"],
      ["Avance planificado a la fecha", avancePlanPonderado != null ? avancePlanPonderado + "%" : ""],
      []
    ];
    filasExcel.push(["Actividad","Días","Responsable","Inicio","Terminado","% Avance","Estado","Observaciones","% Plan","Desvío"]);
    filas.forEach(({ t, dias, planPct, realPct, desvio }) => filasExcel.push([
      t.titulo, dias != null ? dias : "", t.responsable || "", t.fecha_inicio || "", t.fecha_entrega || "",
      realPct, estatusEfectivoTarea(t), t.observaciones || "", planPct != null ? planPct : "", desvio != null ? desvio : ""
    ]));
    const ws = XLSX.utils.aoa_to_sheet(filasExcel);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Cronograma");
    XLSX.writeFile(wb, "Cronograma_" + nombreArchivoBase + ".xlsx");
  };

  const exportarPlanPDF = () => {
    const doc = new window.jspdf.jsPDF({ orientation: "landscape" });
    doc.setFontSize(14);
    doc.text(proyecto.nombre || "Plan de acción", 14, 15);
    doc.setFontSize(9);
    doc.setTextColor(120);
    doc.text(
      "Generado el " + new Date().toLocaleDateString("es-HN") + " · Fecha de corte " + formatearFechaCorta(hoy) +
      " · Avance real (ponderado) " + avanceRealPonderado + "%" +
      (avancePlanPonderado != null ? " · Avance planificado " + avancePlanPonderado + "%" : ""),
      14, 21
    );
    const filasPdf = filas.map(({ t, dias, planPct, realPct, desvio }) => [
      t.titulo, dias != null ? dias : "—", t.responsable || "", t.fecha_inicio || "", t.fecha_entrega || "",
      realPct + "%", estatusEfectivoTarea(t), t.observaciones || "", planPct != null ? planPct + "%" : "—",
      desvio != null ? (desvio > 0 ? "+" : "") + desvio + "%" : "—"
    ]);
    doc.autoTable({
      head: [["Actividad","Días","Responsable","Inicio","Terminado","Avance","Estado","Observaciones","% Plan","Desvío"]],
      body: filasPdf,
      startY: 26,
      styles: { fontSize: 7.5, cellPadding: 2 },
      headStyles: { fillColor: [30, 77, 183] },
      margin: { left: 14, right: 14 },
      columnStyles: { 7: { cellWidth: 55 } }
    });
    doc.save("Plan_" + nombreArchivoBase + ".pdf");
  };

  return (
    <Card>
      <CardHeader
        icon="ti-list-check"
        left={"Plan de acción — " + (proyecto.nombre || "")}
        right={
          <React.Fragment>
            <Btn sm onClick={exportarPlanExcel}><i className="ti ti-file-spreadsheet"/> Excel</Btn>
            <Btn sm onClick={exportarPlanPDF}><i className="ti ti-file-type-pdf"/> PDF</Btn>
            {onClose && <Btn sm onClick={onClose}><i className="ti ti-x"/> Cerrar</Btn>}
          </React.Fragment>
        }
      />
      <div style={{padding:"1rem 1.1rem"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,gap:8,flexWrap:"wrap"}}>
          <span style={{fontSize:12.5,fontWeight:700,color:y.text}}>{tareasProyecto.length} {tareasProyecto.length===1?"tarea":"tareas"}</span>
          {puedeEditar && !tareaForm && (
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <Btn sm onClick={descargarPlantillaExcel}><i className="ti ti-download"/> Plantilla</Btn>
              <ImportarExcelButton label="Carga masiva" onImportar={importarTareasExcel} />
              <Btn sm primary onClick={() => setTareaForm({mode:"add"})}><i className="ti ti-plus"/> Agregar tarea</Btn>
            </div>
          )}
        </div>

        {tareaForm && (
          <TareaForm
            tarea={tareaForm.mode === "edit" ? tareaForm.tarea : null}
            tareasProyecto={tareasProyecto}
            responsables={responsables}
            responsablesDisponibles={responsablesDisponibles}
            onGuardar={guardarTarea}
            onCancelar={() => setTareaForm(null)}
          />
        )}

        {tareasProyecto.length === 0 ? (
          <div style={{fontSize:12,color:y.text3,padding:"1rem 0"}}>Sin tareas todavía{puedeEditar ? " — agrega la primera con el botón de arriba." : "."}</div>
        ) : (
          <div style={{display:"flex",gap:16,flexWrap:"wrap",alignItems:"flex-start"}}>
            <div style={{flex:"3 1 560px",minWidth:0,overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                <thead>
                  <tr style={{background:y.grayBg}}>
                    {["Actividad","Días","Responsable","Inicio","Terminado","% Avance","Estado","Observaciones","% Plan","Desvío",""].map(h => (
                      <th key={h} style={{textAlign:"left",fontSize:10,fontWeight:800,color:y.text3,textTransform:"uppercase",letterSpacing:.3,padding:"0.5rem 0.5rem",borderBottom:"1px solid "+y.border,whiteSpace:"nowrap"}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {filas.map(({ t, dias, planPct, realPct, desvio }) => {
                    const est = estatusEfectivoTarea(t);
                    const [estBg, estColor] = TAREA_ESTADO_COLOR[est] || [y.grayBg, y.gray];
                    return (
                      <tr key={t.id} style={{borderBottom:"1px solid "+y.grayBg}}>
                        <td style={{padding:"0.5rem",color:y.text,fontWeight:600,maxWidth:220}}>{t.titulo}</td>
                        <td style={{padding:"0.5rem",color:y.text2}}>{dias != null ? dias : "—"}</td>
                        <td style={{padding:"0.5rem",color:y.text2,whiteSpace:"nowrap"}}>{t.responsable || "—"}</td>
                        <td style={{padding:"0.5rem",color:y.text2,whiteSpace:"nowrap"}}>{t.fecha_inicio || "—"}</td>
                        <td style={{padding:"0.5rem",color:y.text2,whiteSpace:"nowrap"}}>{t.fecha_entrega || "—"}</td>
                        <td style={{padding:"0.5rem",whiteSpace:"nowrap"}}>
                          <span style={{display:"inline-block",width:44,height:6,borderRadius:20,background:y.border,position:"relative",marginRight:6,verticalAlign:"middle"}}>
                            <span style={{position:"absolute",left:0,top:0,bottom:0,borderRadius:20,background:y.success,width:realPct+"%"}}/>
                          </span>
                          {realPct}%
                        </td>
                        <td style={{padding:"0.5rem"}}>
                          <span style={{display:"inline-flex",padding:"3px 9px",borderRadius:20,fontSize:10.5,fontWeight:700,background:estBg,color:estColor,whiteSpace:"nowrap"}}>{est}</span>
                        </td>
                        <td style={{padding:"0.5rem",color:y.text3,maxWidth:200}}>{t.observaciones || "—"}</td>
                        <td style={{padding:"0.5rem",color:y.text2}}>{planPct != null ? planPct + "%" : "—"}</td>
                        <td style={{padding:"0.5rem",fontWeight:700,color: desvio == null ? y.text3 : desvio < 0 ? y.danger : desvio > 0 ? y.success : y.text2,whiteSpace:"nowrap"}}>
                          {desvio != null ? (desvio > 0 ? "+" : "") + desvio + "%" : "—"}
                        </td>
                        <td style={{padding:"0.5rem",textAlign:"right",whiteSpace:"nowrap"}}>
                          {puedeEditar && (
                            <React.Fragment>
                              <button onClick={() => setTareaForm({mode:"edit", tarea:t})} style={{background:"none",border:"none",color:y.text3,cursor:"pointer",padding:3}} title="Editar"><i className="ti ti-pencil" style={{fontSize:13}}/></button>
                              <button onClick={() => eliminarTarea(t)} style={{background:"none",border:"none",color:y.text3,cursor:"pointer",padding:3}} title="Eliminar"><i className="ti ti-trash" style={{fontSize:13}}/></button>
                            </React.Fragment>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

            <div style={{flex:"1 1 260px",maxWidth:320,display:"flex",flexDirection:"column",gap:12}}>
              <div style={{border:"1px solid "+y.border,borderRadius:10,overflow:"hidden"}}>
                <div style={{background:y.primary,color:"#fff",padding:"0.55rem 0.9rem",fontSize:11,fontWeight:800,textTransform:"uppercase",letterSpacing:.3}}>Resumen de avance</div>
                <div style={{padding:"0.75rem 0.9rem",display:"flex",flexDirection:"column",gap:8}}>
                  {[
                    ["Fecha de corte", formatearFechaCorta(hoy)],
                    ["Avance real (ponderado por días)", avanceRealPonderado + "%"],
                    ["Avance planificado a la fecha", avancePlanPonderado != null ? avancePlanPonderado + "%" : "—"],
                    ["Desviación (real - plan)", desviacionGeneral != null ? (desviacionGeneral > 0 ? "+" : "") + desviacionGeneral + "%" : "—"],
                    ["Avance simple (promedio)", avancePctTareas + "%"]
                  ].map(([label, valor]) => (
                    <div key={label} style={{display:"flex",justifyContent:"space-between",gap:10,fontSize:11.5}}>
                      <span style={{color:y.text3}}>{label}</span>
                      <strong style={{color:y.text,whiteSpace:"nowrap"}}>{valor}</strong>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{border:"1px solid "+y.border,borderRadius:10,overflow:"hidden"}}>
                <div style={{background:y.grayBg,color:y.text2,padding:"0.55rem 0.9rem",fontSize:11,fontWeight:800,textTransform:"uppercase",letterSpacing:.3}}>Actividades por estado</div>
                <div style={{padding:"0.75rem 0.9rem",display:"flex",flexDirection:"column",gap:7}}>
                  {ESTADOS_RESUMEN.map(estado => {
                    const [, color] = ESTADO_RESUMEN_COLOR[estado] || [y.grayBg, y.gray];
                    const cant = conteoEstados[estado];
                    const pct = totalTareas ? Math.round((cant / totalTareas) * 100) : 0;
                    return (
                      <div key={estado} style={{display:"flex",alignItems:"center",justifyContent:"space-between",fontSize:11.5}}>
                        <span style={{display:"flex",alignItems:"center",gap:6,color:y.text2}}>
                          <span style={{width:8,height:8,borderRadius:20,background:color,flexShrink:0}}/>
                          {estado}
                        </span>
                        <span style={{color:y.text3,whiteSpace:"nowrap"}}>{cant} ({pct}%)</span>
                      </div>
                    );
                  })}
                  <div style={{borderTop:"1px solid "+y.border,marginTop:2,paddingTop:7,display:"flex",justifyContent:"space-between",fontSize:11.5,fontWeight:800,color:y.text}}>
                    <span>Total</span><span>{totalTareas}</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        )}
      </div>
    </Card>
  );
}

function ProjectModal({ paises, session, areasCatalogo, areasDisponibles, categoriasCatalogo, categoriasDisponibles, responsables, responsablesDisponibles, editProject, tareasProyecto = [], onTareasChanged, puedeEditar = true, onClose, onSaved, tablaProyectos = "proyectos", tablaTareas = "proyecto_tareas", tablaComentarios = "proyecto_comentarios" }) {
  // Igual que Área: si el catálogo de Categorías está activado y tiene datos, se usa ese;
  // si no, se usa la lista fija de siempre — así el formulario nunca se queda sin opciones.
  const categoriasEfectivas = (categoriasDisponibles && categoriasCatalogo && categoriasCatalogo.length > 0) ? categoriasCatalogo.map(c => c.nombre) : CATEGORIAS;
  const [drafts, setDrafts] = useState(() => editProject ? [{ ...editProject }] : [nuevoProyecto()]);
  const [saving, setSaving] = useState(false);
  const [tab, setTab] = useState("datos"); // datos | comentarios (solo aplica en modo edición)

  // ---- Plan de trabajo capturado al crear proyecto(s) nuevo(s) (solo aplica en modo "agregar") ----
  // Se guarda en memoria por cada borrador (clave d._key) hasta que se guarde el proyecto;
  // en ese momento se crea de verdad en proyecto_tareas con el id real del proyecto recién creado.
  const [draftTareas, setDraftTareas] = useState({}); // { [d._key]: [{id: localId, titulo, ...}] }
  const [tareaFormDraft, setTareaFormDraft] = useState(null); // null | {mode:"add", key} | {mode:"edit", key, tarea}
  // Fila del formulario de tabla cuyo Plan de trabajo está desplegado (solo modo "agregar" con varios proyectos).
  const [planAbiertoKey, setPlanAbiertoKey] = useState(() => !editProject && drafts[0] ? drafts[0]._key : null);

  const guardarTareaDraft = (payload) => {
    const key = tareaFormDraft && tareaFormDraft.key;
    if (!key) return;
    setDraftTareas(map => {
      const lista = map[key] || [];
      let nueva;
      if (tareaFormDraft.mode === "edit") {
        nueva = lista.map(t => t.id === tareaFormDraft.tarea.id ? { ...t, ...payload } : t);
      } else {
        nueva = [...lista, { id: "local_" + Date.now() + "_" + Math.random(), ...payload }];
      }
      return { ...map, [key]: nueva };
    });
    setTareaFormDraft(null);
  };
  const eliminarTareaDraft = (key, tarea) => {
    setDraftTareas(map => ({ ...map, [key]: (map[key] || []).filter(t => t.id !== tarea.id) }));
  };
  const importarTareasDraft = (key, tareasParsed) => {
    const nuevas = tareasParsed.map((t, i) => ({
      id: "local_" + Date.now() + "_" + Math.random() + "_" + i,
      titulo: t.titulo,
      responsable: t.responsable,
      fecha_inicio: t.fecha_inicio,
      dias: t.dias,
      fecha_entrega: t.fecha_entrega,
      porcentaje_avance: t.porcentaje_avance,
      estatus: t.estatus,
      completada: t.completada,
      observaciones: t.observaciones,
      depende_id: null
    }));
    // Resolver dependencias EDT -> id local, entre tareas del mismo archivo importado.
    const edtAIndice = {};
    tareasParsed.forEach((t, i) => { edtAIndice[t._edt] = i; });
    tareasParsed.forEach((t, i) => {
      const j = t._dependeEdt != null ? edtAIndice[t._dependeEdt] : undefined;
      if (j !== undefined && nuevas[j]) nuevas[i].depende_id = nuevas[j].id;
    });
    setDraftTareas(map => ({ ...map, [key]: [...(map[key] || []), ...nuevas] }));
  };

  // ---- Comentarios / bitácora del proyecto (solo aplica en modo edición) ----
  const [comentarios, setComentarios] = useState([]);
  const [cargandoComentarios, setCargandoComentarios] = useState(false);
  const [comentariosDisponibles, setComentariosDisponibles] = useState(true);
  const [nuevoComentario, setNuevoComentario] = useState("");
  const [enviandoComentario, setEnviandoComentario] = useState(false);

  useEffect(() => {
    if (!editProject) return;
    (async () => {
      setCargandoComentarios(true);
      try {
        const { data, error } = await supabase.from(tablaComentarios).select("*").eq("proyectoId", editProject.id).order("id");
        if (error) throw error;
        setComentarios(data || []);
        setComentariosDisponibles(true);
      } catch (e) {
        console.warn("Tabla " + tablaComentarios + " no disponible:", e.message || e);
        setComentariosDisponibles(false);
      } finally {
        setCargandoComentarios(false);
      }
    })();
  }, [editProject]);

  const agregarComentario = async () => {
    const texto = nuevoComentario.trim();
    if (!texto || !editProject) return;
    setEnviandoComentario(true);
    try {
      const autor = (session && session.nombre) || "Usuario";
      const { data, error } = await supabase.from(tablaComentarios).insert({ proyectoId: editProject.id, autor, texto }).select();
      if (error) throw error;
      setComentarios(list => [...list, ...(data || [])]);
      setNuevoComentario("");
    } catch (e) {
      alert("No se pudo agregar el comentario: " + (e.message || e));
    } finally {
      setEnviandoComentario(false);
    }
  };

  const eliminarComentario = async (comentario) => {
    setComentarios(list => list.filter(c => c.id !== comentario.id));
    try {
      const { error } = await supabase.from(tablaComentarios).delete().eq("id", comentario.id);
      if (error) throw error;
    } catch (e) {
      alert("No se pudo eliminar el comentario: " + (e.message || e));
      setComentarios(list => [...list, comentario]);
    }
  };

  const formatearFecha = iso => {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      return d.toLocaleString("es-HN", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
    } catch (e) { return iso; }
  };

  const updateField = (idx, key, value) => setDrafts(list => list.map((d, i) => i === idx ? { ...d, [key]: value } : d));
  const addDraft = () => {
    const nuevo = nuevoProyecto();
    setDrafts(list => [...list, nuevo]);
    setPlanAbiertoKey(nuevo._key);
  };
  const removeDraft = idx => {
    const removido = drafts[idx];
    if (removido && planAbiertoKey === removido._key) setPlanAbiertoKey(null);
    setDrafts(list => list.filter((_, i) => i !== idx));
  };

  const normalize = d => {
    const { _key, id, ...rest } = d;
    return {
      ...rest,
      pais_id: rest.pais_id ? parseInt(rest.pais_id) : null,
      prioridad: parseInt(rest.prioridad) || 3,
      avance: parseFloat(rest.avance) || 0,
      actualizado_en: new Date().toISOString(),
      actualizado_por: (session && session.nombre) || "Usuario"
    };
  };

  const save = async () => {
    try {
      if (editProject) {
        const d = drafts[0];
        if (!d.nombre.trim()) { alert("El nombre del proyecto es obligatorio"); return; }
        setSaving(true);
        const payload = normalize(d);
        const { error } = await supabase.from(tablaProyectos).update(payload).eq("id", editProject.id);
        if (error) throw error;
      } else {
        const listos = drafts.filter(d => d.nombre.trim());
        if (!listos.length) { alert("Agrega al menos un proyecto con nombre"); return; }
        setSaving(true);
        for (const d of listos) {
          const payload = normalize(d);
          const { data, error } = await supabase.from(tablaProyectos).insert(payload).select();
          if (error) throw error;
          const nuevoId = data && data[0] && data[0].id;
          const tareasDelDraft = draftTareas[d._key] || [];
          if (nuevoId && tareasDelDraft.length) {
            try {
              const filas = tareasDelDraft.map(t => {
                const { id, depende_id, ...resto } = t;
                return { proyectoId: nuevoId, ...resto };
              });
              const { data: insertadas, error: errT } = await supabase.from(tablaTareas).insert(filas).select();
              if (errT) throw errT;
              // Segunda pasada: ahora que ya existen ids reales, resolver las dependencias
              // entre tareas del mismo plan (que antes apuntaban al id temporal en memoria).
              const mapaIds = {};
              tareasDelDraft.forEach((t, i) => { if (insertadas[i]) mapaIds[t.id] = insertadas[i].id; });
              for (let i = 0; i < tareasDelDraft.length; i++) {
                const original = tareasDelDraft[i];
                if (original.depende_id && mapaIds[original.depende_id] && insertadas[i]) {
                  await supabase.from(tablaTareas).update({ depende_id: mapaIds[original.depende_id] }).eq("id", insertadas[i].id);
                }
              }
            } catch (eT) {
              console.warn("El proyecto se creó, pero no se pudo guardar su plan de trabajo:", eT.message || eT);
              alert("El proyecto se creó, pero no se pudo guardar el plan de trabajo: " + (eT.message || eT));
            }
          }
        }
      }
      onSaved();
    } catch (e) {
      console.error(e);
      alert("No se pudo guardar: " + (e.message || e) + (/column/i.test(e.message||"") ? "\n\n(Puede que falte correr el SQL nuevo en Supabase — ver README.)" : ""));
    } finally {
      setSaving(false);
    }
  };

  const conNombre = drafts.filter(d => d.nombre.trim()).length;

  // Estilos de la lista "Campo / Valor": una fila por dato, etiqueta a la izquierda y su campo editable a la derecha.
  const fvCampoStyle = { padding:"0.75rem 1rem", fontSize:11, fontWeight:800, color:y.text3, textTransform:"uppercase", letterSpacing:.3, whiteSpace:"nowrap", width:190, verticalAlign:"middle" };
  const fvValorStyle = { padding:"0.55rem 1rem", verticalAlign:"middle" };
  const inputTabla = { width:"100%", padding:"0.5rem 0.7rem", fontSize:13, border:"1px solid "+y.border2, borderRadius:8, background:y.surface, color:y.text, outline:"none", fontFamily:"inherit", boxSizing:"border-box", lineHeight:1.4 };

  return (

        </div>
        <div style={{fontSize:13,color:y.text2,marginBottom:20}}>

        </div>
