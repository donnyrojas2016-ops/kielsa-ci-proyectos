/* ---------- Registro de riesgos ---------- */
const RIESGO_PROBABILIDADES = ["Baja","Media","Alta"];
const RIESGO_IMPACTOS = ["Bajo","Medio","Alto"];
const RIESGO_ESTADOS = ["Abierto","Mitigado","Cerrado","Ocurrió"];
const RIESGO_ESTADO_COLOR = {
  "Abierto": [y.dangerBg, y.danger],
  "Mitigado": [y.warningBg, y.warning],

  "Ocurrió": [y.grayBg, y.gray]
};
const RIESGO_PROB_VAL = { "Baja":1, "Media":2, "Alta":3 };
const RIESGO_IMPACTO_VAL = { "Bajo":1, "Medio":2, "Alto":3 };

// Nivel de un riesgo (matriz clásica probabilidad × impacto, 1 a 9):
// 1-2 Bajo, 3-4 Medio, 6-9 Alto. Es la forma estándar de priorizar riesgos
// sin tener que discutir cada caso a mano.
function nivelRiesgo(probabilidad, impacto) {
  const p = RIESGO_PROB_VAL[probabilidad] || 1;
  const im = RIESGO_IMPACTO_VAL[impacto] || 1;
  const score = p * im;
  const nivel = score <= 2 ? "Bajo" : score <= 4 ? "Medio" : "Alto";
  return { score, nivel };
}

};

/* ---------- Carga de trabajo ---------- */
// Nivel de carga según cuántas tareas activas (no completadas) tiene una persona
// en TODOS los proyectos a la vez. 1-2: Baja. 3-5: Media. 6+: Alta.
const CARGA_COLOR = {

function nivelCarga(activas) {

}

/* ---------- Registro de cambios ---------- */
// Campos del proyecto que se vigilan para el historial de cambios. Cuando alguno
// de estos cambia al guardar, se registra automáticamente quién lo cambió, cuándo,
// y cuál era el valor antes y después — sin que la persona tenga que hacer nada extra.
function nombrePaisPorId(paises, id) {
  if (!id) return "";
  const p = (paises || []).find(x => x.id === parseInt(id));
  return p ? p.nombre : "";
}
const CAMBIOS_CAMPOS = [
  { key:"nombre", label:"Nombre" },
  { key:"categoria", label:"Categoría" },
  { key:"prioridad", label:"Prioridad", formato: v => v==1 ? "Alta" : v==2 ? "Media" : "Normal" },

  { key:"pais_id", label:"País", formatoConPaises: (v, paises) => nombrePaisPorId(paises, v) },
  { key:"responsable", label:"Responsable" },
  { key:"estado", label:"Estado" },
  { key:"fecha_solicitud", label:"Fecha de solicitud" },
  { key:"fecha_inicio", label:"Fecha de inicio" },

  { key:"gasto_real", label:"Gasto real", formato: v => "$"+(parseFloat(v)||0).toLocaleString("es-HN") },
  { key:"ticket", label:"Ticket" }
];
function formatValorCambio(campo, valor, paises) {
  if (valor === null || valor === undefined || valor === "") return "—";
  if (campo.formatoConPaises) return campo.formatoConPaises(valor, paises) || "—";
  if (campo.formato) return campo.formato(valor);
  return String(valor);
}

// % de avance de una tarea individual: usa la columna nueva "porcentaje_avance" si existe;
// si la tarea es de antes de tener Cronograma, se deriva del check "completada" (100 o 0).
function avanceTarea(t) {
  if (t.porcentaje_avance !== null && t.porcentaje_avance !== undefined) return parseFloat(t.porcentaje_avance) || 0;
  return t.completada ? 100 : 0;
}

// Estatus que se muestra para una tarea: si ya se marcó "Completada" se respeta,
// si no, se revisa si ya se pasó de la fecha de entrega para marcarla "Vencida" sola,
// igual que ya hacemos con la fecha de vencimiento del proyecto.
function estatusEfectivoTarea(t) {
  const base = t.estatus || (t.completada ? "Completada" : "Pendiente");
  if (base === "Completada") return "Completada";
  if (!t.fecha_entrega) return base;
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const fin = new Date(t.fecha_entrega + "T00:00:00");
  if (!isNaN(fin.getTime()) && fin < hoy) return "Vencida";
  return base;
}

function duracionDias(inicio, entrega) {
  if (!inicio || !entrega) return null;
  const a = new Date(inicio + "T00:00:00");
  const b = new Date(entrega + "T00:00:00");
  if (isNaN(a.getTime()) || isNaN(b.getTime())) return null;
  return Math.round((b - a) / 86400000);
}

// Rango de fechas (mín. inicio, máx. entrega) entre las tareas que sí tienen ambas fechas.
// Sirve para dibujar la línea de tiempo del Cronograma.
function rangoFechasTareas(tareas) {
  let min = null, max = null;
  tareas.forEach(t => {
    if (!t.fecha_inicio || !t.fecha_entrega) return;
    const a = new Date(t.fecha_inicio + "T00:00:00");
    const b = new Date(t.fecha_entrega + "T00:00:00");
    if (isNaN(a.getTime()) || isNaN(b.getTime())) return;
    if (!min || a < min) min = a;
    if (!max || b > max) max = b;
  });
  return { min, max };
}

// Ruta crítica: como cada tarea solo puede depender de UNA tarea anterior, la estructura de
// dependencias es un "bosque" (cada tarea tiene 0 o 1 padre, pero puede tener varias tareas
// que dependan de ella). La ruta crítica es la cadena de tareas dependientes entre sí que
// termina en la fecha de entrega más tardía del proyecto — es decir, la cadena que marca
// la fecha de fin real del proyecto: si cualquier tarea de esa cadena se atrasa, se
// atrasa el proyecto completo. Devuelve un Set con los id de las tareas en esa ruta.
function calcularRutaCritica(tareas) {
  const critico = new Set();
  const conFecha = tareas.filter(t => t.fecha_entrega);
  if (conFecha.length === 0) return critico;
  let maxFin = null;
  conFecha.forEach(t => {
    const f = new Date(t.fecha_entrega + "T00:00:00");
    if (!isNaN(f.getTime()) && (!maxFin || f > maxFin)) maxFin = f;
  });
  if (!maxFin) return critico;
  const porId = {};
  tareas.forEach(t => { porId[t.id] = t; });
  // Desde cada tarea "hoja" cuya entrega coincide con la fecha máxima, camina hacia atrás
  // (tarea → su predecesora → la predecesora de esa...) marcando toda la cadena.
  conFecha.forEach(t => {
    const f = new Date(t.fecha_entrega + "T00:00:00");
    if (isNaN(f.getTime()) || f.getTime() !== maxFin.getTime()) return;
    let actual = t;
    let vueltas = 0;
    while (actual && !critico.has(actual.id) && vueltas < tareas.length + 1) {
      critico.add(actual.id);
      actual = actual.depende_id ? porId[actual.depende_id] : null;
      vueltas++;
    }
  });
  return critico;
}

// Si el proyecto tiene tareas (Cronograma), el avance se calcula solo: promedio del % de avance de cada tarea.
// Si no tiene tareas todavía, se usa el % que la persona escribió a mano (compatibilidad con proyectos existentes).
function avanceEfectivo(proyecto, tareasDelProyecto) {
  if (tareasDelProyecto && tareasDelProyecto.length > 0) {
    const suma = tareasDelProyecto.reduce((s, t) => s + avanceTarea(t), 0);
    return (suma / tareasDelProyecto.length) / 100;
  }
  return parseFloat(proyecto.avance) || 0;
}

// Salud del presupuesto: compara lo gastado contra lo planeado. Devuelve null si el
// proyecto todavía no tiene presupuesto o gasto real capturado (no hay nada que comparar).
// <=90% del presupuesto: En rango. 91-110%: Al límite. >110%: Sobre presupuesto.
const SALUD_PRESUPUESTO_COLOR = {
  "En rango": [y.successBg, y.success],
  "Al límite": [y.warningBg, y.warning],
  "Sobre presupuesto": [y.dangerBg, y.danger]
};
function saludPresupuesto(p) {
  const presupuesto = parseFloat(p.presupuesto);
  const gasto = parseFloat(p.gasto_real);
  if (!presupuesto || isNaN(presupuesto) || presupuesto <= 0 || isNaN(gasto)) return null;
  const pct = Math.round((gasto / presupuesto) * 100);
  const nivel = pct <= 90 ? "En rango" : pct <= 110 ? "Al límite" : "Sobre presupuesto";
  return { pct, nivel, presupuesto, gasto };
}

// Calcula si un proyecto está vencido o a punto de vencer según su fecha_fin real,
// sin depender de que alguien haya cambiado manualmente el campo "estado".
// Los proyectos ya Cumplidos o Cancelados no generan alerta.
function estadoVencimiento(p) {
  if (!p.fecha_fin) return null;
  if (p.estado === "Cumplido" || p.estado === "Cancelado") return null;
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const fin = new Date(p.fecha_fin + "T00:00:00");
  if (isNaN(fin.getTime())) return null;
  const dias = Math.round((fin - hoy) / 86400000);
  if (dias < 0) return { tipo: "vencido", dias: Math.abs(dias) };
  if (dias <= 7) return { tipo: "pronto", dias };
  return null;
}
function textoVencimiento(v) {
  if (v.tipo === "vencido") return "Vencido hace " + v.dias + (v.dias === 1 ? " día" : " días");
  if (v.dias === 0) return "Vence hoy";
  return "Vence en " + v.dias + (v.dias === 1 ? " día" : " días");
}

/* ---------- Login ---------- */
function Login({ onLogin }) {
  const [usuario, setUsuario] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState(false);
  const [loading, setLoading] = useState(false);

  const submit = async () => {
    setLoading(true); setError(false);
    try {
      const { data, error: err } = await supabase.from("usuarios").select("*");
      if (err) throw err;
      const found = (data || []).find(u => u.usuario === usuario && u.password === password && u.estado === "Activo");
      if (found) {
        onLogin({ id: found.id, usuario: found.usuario, nombre: found.nombre || found.usuario });
      } else {
        setError(true);
        setPassword("");
      }
    } catch (e) {
      console.error(e);
      alert("No se pudo validar el usuario. Intenta de nuevo.");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#0f172a,#1e4db7)"}}>
      <div style={{background:y.surface,borderRadius:16,padding:"2.25rem 2rem",width:360,boxShadow:"0 20px 50px rgba(0,0,0,.25)"}}>
        <div style={{textAlign:"center",marginBottom:22}}>

          <div style={{fontSize:17,fontWeight:800,color:y.text}}>Kielsa CI — Proyectos</div>
          <div style={{fontSize:12,color:y.text3,marginTop:4}}>Ingresa con tu usuario de Kielsa CI</div>
        </div>
        <form onSubmit={e => { e.preventDefault(); if(!loading) submit(); }}>
          <div style={{marginBottom:12}}>
            <label style={{display:"block",fontSize:11,fontWeight:700,color:y.text3,textTransform:"uppercase",marginBottom:4}}>Usuario</label>
            <input name="username" autoComplete="username" value={usuario} onChange={e => setUsuario(e.target.value)} style={inputStyle} />
          </div>
          <div style={{marginBottom:16}}>
            <label style={{display:"block",fontSize:11,fontWeight:700,color:y.text3,textTransform:"uppercase",marginBottom:4}}>Contraseña</label>
            <input name="password" type="password" autoComplete="current-password" value={password} onChange={e => setPassword(e.target.value)} style={inputStyle} />
          </div>
          {error && <div style={{fontSize:12,color:y.danger,marginBottom:12,display:"flex",alignItems:"center",gap:6}}><i className="ti ti-alert-circle"/>Usuario y clave incorrectas</div>}

            {loading ? "Ingresando..." : "Ingresar"}
          </button>
        </form>
      </div>
    </div>
  );
}

/* ---------- Línea de tiempo (Gantt) del Cronograma, con ruta crítica resaltada ---------- */
const MESES_CORTOS = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function GanttChart({ tareas, criticalSet }) {
  const { min, max } = rangoFechasTareas(tareas);
  if (!min || !max) {
    return <div style={{fontSize:12,color:y.text3,padding:"0.75rem 0 1rem"}}>Agrega fecha de inicio y de entrega a las tareas para ver la línea de tiempo.</div>;
  }
  const spanMs = Math.max(max - min, 86400000);
  const formatoCorto = d => d.getDate() + " " + MESES_CORTOS[d.getMonth()];
  const marcas = [0, 1/3, 2/3, 1].map(f => new Date(min.getTime() + spanMs * f));
  const ANCHO_LABEL = 190;

  return (
    <div style={{border:"1px solid "+y.border,borderRadius:10,padding:"0.9rem 1rem 0.7rem",marginBottom:14,background:y.surface}}>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:10.5,fontWeight:700,color:y.text3,marginBottom:8,paddingLeft:ANCHO_LABEL}}>
        {marcas.map((d,i) => <span key={i}>{formatoCorto(d)}</span>)}
      </div>
      {tareas.map((t,i) => {
        const est = estatusEfectivoTarea(t);
        const [,estColor] = TAREA_ESTADO_COLOR[est] || [y.grayBg, y.gray];
        const critica = criticalSet && criticalSet.has(t.id);
        const tieneFechas = !!(t.fecha_inicio && t.fecha_entrega);
        let left = 0, width = 0;
        if (tieneFechas) {
          const a = new Date(t.fecha_inicio + "T00:00:00");
          const b = new Date(t.fecha_entrega + "T00:00:00");
          if (!isNaN(a.getTime()) && !isNaN(b.getTime())) {
            left = ((a - min) / spanMs) * 100;
            width = Math.max(((b - a) / spanMs) * 100, 1.2);
          }
        }
        const pct = avanceTarea(t);
        return (
          <div key={t.id} style={{display:"flex",alignItems:"center",gap:10,marginBottom:7}}>
            <div style={{width:ANCHO_LABEL,flexShrink:0,fontSize:11.5,color:y.text2,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",display:"flex",alignItems:"center",gap:4}} title={t.titulo}>
              {critica && <i className="ti ti-alert-triangle" style={{color:y.danger,fontSize:12,flexShrink:0}} title="Ruta crítica"/>}
              <span style={{fontWeight:700,color:y.text3}}>{i+1}.</span> {t.titulo}
            </div>
            <div style={{flex:1,position:"relative",height:20,background:y.grayBg,borderRadius:5}}>
              {tieneFechas ? (
                <div style={{position:"absolute",top:0,bottom:0,left:left+"%",width:width+"%",borderRadius:5,background: critica ? y.danger : estColor,opacity: critica ? 1 : 0.85,overflow:"hidden"}}>
                  <div style={{position:"absolute",left:0,top:0,bottom:0,width:pct+"%",background:"rgba(255,255,255,.35)"}}/>
                </div>
              ) : (
                <div style={{fontSize:10,color:y.text3,lineHeight:"20px",paddingLeft:6}}>Sin fechas</div>
              )}
            </div>
          </div>
        );
      })}
      {criticalSet && criticalSet.size > 0 && (
        <div style={{display:"flex",alignItems:"center",gap:5,fontSize:10.5,color:y.text3,marginTop:8,paddingLeft:ANCHO_LABEL}}>
          <i className="ti ti-alert-triangle" style={{color:y.danger,fontSize:12}}/> Ruta crítica — si se atrasa cualquiera de estas tareas, se atrasa el proyecto
        </div>
      )}
    </div>
  );
}

/* ---------- Formulario de una tarea del Cronograma (agregar o editar) ---------- */
function TareaForm({ tarea, tareasProyecto, responsables, responsablesDisponibles, onGuardar, onCancelar }) {
  const [titulo, setTitulo] = useState(tarea ? tarea.titulo || "" : "");
  const [responsable, setResponsable] = useState(tarea ? tarea.responsable || "" : "");
  const [dependeId, setDependeId] = useState(tarea && tarea.depende_id ? String(tarea.depende_id) : "");
  const [fechaInicio, setFechaInicio] = useState(tarea ? tarea.fecha_inicio || "" : "");
  const [fechaEntrega, setFechaEntrega] = useState(tarea ? tarea.fecha_entrega || "" : "");
  const [avance, setAvance] = useState(tarea ? avanceTarea(tarea) : 0);
  const [estatus, setEstatus] = useState(tarea ? (tarea.estatus || (tarea.completada ? "Completada" : "Pendiente")) : "Pendiente");
  const [aprobador, setAprobador] = useState(tarea ? tarea.aprobador || "" : "");
  const [consultados, setConsultados] = useState(tarea ? tarea.consultados || "" : "");
  const [informados, setInformados] = useState(tarea ? tarea.informados || "" : "");

  const opcionesDependencia = tareasProyecto.filter(t => !tarea || t.id !== tarea.id);

  const guardar = () => {
    if (!titulo.trim()) { alert("El nombre de la tarea es obligatorio."); return; }
    onGuardar({
      titulo: titulo.trim(),
      responsable: responsable || null,
      depende_id: dependeId ? parseInt(dependeId) : null,
      fecha_inicio: fechaInicio || null,
      fecha_entrega: fechaEntrega || null,
      porcentaje_avance: parseInt(avance) || 0,
      estatus,
      completada: estatus === "Completada",
      aprobador: aprobador || null,
      consultados: consultados.trim() || null,
      informados: informados.trim() || null
    });
  };

  return (
    <div style={{background:y.primaryLight,border:"1px solid #c7d2fe",borderRadius:10,padding:"0.9rem 1rem",marginBottom:12}}>
      <div style={{marginBottom:10}}>

      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        <div>
          <label style={{...labelStyle,color:y.primary}}>Responsable de la tarea</label>
          {responsablesDisponibles && responsables && responsables.length > 0 ? (
            <select value={responsable} onChange={e => setResponsable(e.target.value)} style={{...inputStyle,fontSize:12.5}}>
              <option value="">—</option>
              {responsable && !responsables.some(r => r.nombre === responsable) && <option value={responsable}>{responsable}</option>}
              {responsables.map(r => <option key={r.id} value={r.nombre}>{r.nombre}</option>)}
            </select>
          ) : (
            <input value={responsable} onChange={e => setResponsable(e.target.value)} style={{...inputStyle,fontSize:12.5}} />
          )}
        </div>
        <div>
          <label style={{...labelStyle,color:y.primary}}>Depende de</label>
          <select value={dependeId} onChange={e => setDependeId(e.target.value)} style={{...inputStyle,fontSize:12.5}}>
            <option value="">— Ninguna —</option>
            {opcionesDependencia.map((t, i) => (
              <option key={t.id} value={t.id}>EDT {tareasProyecto.indexOf(t) + 1} — {t.titulo.substring(0,30)}</option>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        <div>

        </div>
        <div>
          <label style={{...labelStyle,color:y.primary}}>Fecha de entrega</label>
          <input type="date" value={fechaEntrega} onChange={e => setFechaEntrega(e.target.value)} style={{...inputStyle,fontSize:12.5}} />

      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>

        </div>
        <div>
          <label style={{...labelStyle,color:y.primary}}>Estatus</label>

            {TAREA_ESTADOS.map(s => <option key={s}>{s}</option>)}
          </select>
        </div>
      </div>

      <div style={{fontSize:10.5,fontWeight:800,color:y.primary,textTransform:"uppercase",letterSpacing:.4,marginBottom:6,marginTop:2}}>Matriz RACI de la tarea</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        <div>
          <label style={{...labelStyle,color:y.primary}}>Aprobador (A — rinde cuentas)</label>
          {responsablesDisponibles && responsables && responsables.length > 0 ? (
            <select value={aprobador} onChange={e => setAprobador(e.target.value)} style={{...inputStyle,fontSize:12.5}}>
              <option value="">—</option>
              {aprobador && !responsables.some(r => r.nombre === aprobador) && <option value={aprobador}>{aprobador}</option>}
              {responsables.map(r => <option key={r.id} value={r.nombre}>{r.nombre}</option>)}

        <div>
          <label style={{...labelStyle,color:y.primary}}>Consultados (C)</label>
          <input value={consultados} onChange={e => setConsultados(e.target.value)} placeholder="Nombres separados por coma" style={{...inputStyle,fontSize:12.5}} />

      <div style={{marginBottom:12}}>
        <label style={{...labelStyle,color:y.primary}}>Informados (I)</label>
        <input value={informados} onChange={e => setInformados(e.target.value)} placeholder="Nombres separados por coma" style={{...inputStyle,fontSize:12.5}} />
      </div>

      <div style={{display:"flex",justifyContent:"flex-end",gap:8}}>
        <Btn sm onClick={onCancelar}>Cancelar</Btn>
        <Btn sm primary onClick={guardar}>{tarea ? "Guardar cambios" : "Agregar tarea"}</Btn>
      </div>
    </div>
  );
}

function ProjectModal({ paises, session, areasCatalogo, areasDisponibles, responsables, responsablesDisponibles, editProject, onClose, onSaved, onTareasChanged }) {
  const [drafts, setDrafts] = useState(() => editProject ? [{ ...editProject }] : [nuevoProyecto()]);
  const [active, setActive] = useState(0);
  const [saving, setSaving] = useState(false);
  const [tab, setTab] = useState("datos"); // datos | cronograma | riesgos | comentarios (solo aplica en modo edición)

  // ---- Tareas / Cronograma del proyecto (solo aplica en modo edición, sobre un proyecto ya guardado) ----
  const [tareasProyecto, setTareasProyecto] = useState([]);
  const [cargandoTareas, setCargandoTareas] = useState(false);
  const [tareasDisponibles, setTareasDisponibles] = useState(true);
  const [tareaForm, setTareaForm] = useState(null); // null | {mode:"add"} | {mode:"edit", tarea}
  const [mostrarRaci, setMostrarRaci] = useState(false);

  // ---- Riesgos del proyecto (solo aplica en modo edición) ----
  const [riesgosProyecto, setRiesgosProyecto] = useState([]);
  const [cargandoRiesgos, setCargandoRiesgos] = useState(false);
  const [riesgosDisponibles, setRiesgosDisponibles] = useState(true);
  const [riesgoForm, setRiesgoForm] = useState(null); // null | {mode:"add"} | {mode:"edit", riesgo}

  // ---- Registro de cambios del proyecto (solo lectura, se llena solo al guardar) ----
  const [cambiosProyecto, setCambiosProyecto] = useState([]);
  const [cargandoCambios, setCargandoCambios] = useState(false);
  const [cambiosDisponibles, setCambiosDisponibles] = useState(true);

  // ---- Comentarios / bitácora del proyecto (solo aplica en modo edición) ----
  const [comentarios, setComentarios] = useState([]);
  const [cargandoComentarios, setCargandoComentarios] = useState(false);
  const [comentariosDisponibles, setComentariosDisponibles] = useState(true);
  const [nuevoComentario, setNuevoComentario] = useState("");
  const [enviandoComentario, setEnviandoComentario] = useState(false);

  useEffect(() => {
    if (!editProject) return;
    (async () => {
      setCargandoTareas(true);
      try {
        const { data, error } = await supabase.from("proyecto_tareas").select("*").eq("proyectoId", editProject.id).order("id");
        if (error) throw error;
        setTareasProyecto(data || []);
        setTareasDisponibles(true);
      } catch (e) {
        console.warn("Tabla proyecto_tareas no disponible:", e.message || e);
        setTareasDisponibles(false);
      } finally {
        setCargandoTareas(false);
      }
    })();
  }, [editProject]);

  const guardarTarea = async (payload) => {
    try {
      if (tareaForm && tareaForm.mode === "edit") {
        const { error } = await supabase.from("proyecto_tareas").update(payload).eq("id", tareaForm.tarea.id);
        if (error) throw error;
        setTareasProyecto(list => list.map(t => t.id === tareaForm.tarea.id ? { ...t, ...payload } : t));
      } else {
        const { data, error } = await supabase.from("proyecto_tareas").insert({ proyectoId: editProject.id, ...payload }).select();
        if (error) throw error;
        setTareasProyecto(list => [...list, ...(data || [])]);
      }
      setTareaForm(null);
      onTareasChanged && onTareasChanged();
    } catch (e) {
      alert("No se pudo guardar la tarea: " + (e.message || e) + (/column/i.test(e.message||"") ? "\n\n(Puede que falte correr el SQL del Cronograma en Supabase — ver README.)" : ""));
    }
  };

  const eliminarTarea = async (tarea) => {
    if (!window.confirm('¿Eliminar la tarea "' + tarea.titulo + '"?')) return;
    setTareasProyecto(list => list.filter(t => t.id !== tarea.id));
    try {
      const { error } = await supabase.from("proyecto_tareas").delete().eq("id", tarea.id);
      if (error) throw error;
      onTareasChanged && onTareasChanged();
    } catch (e) {
      alert("No se pudo eliminar la tarea: " + (e.message || e));
      setTareasProyecto(list => [...list, tarea]);
    }
  };

  const avancePctTareas = tareasProyecto.length ? Math.round(tareasProyecto.reduce((s,t) => s + avanceTarea(t), 0) / tareasProyecto.length) : 0;
  const rutaCritica = useMemo(() => calcularRutaCritica(tareasProyecto), [tareasProyecto]);

  useEffect(() => {
    if (!editProject) return;
    (async () => {
      setCargandoRiesgos(true);
      try {
        const { data, error } = await supabase.from("proyecto_riesgos").select("*").eq("proyectoId", editProject.id).order("id");
        if (error) throw error;
        setRiesgosProyecto(data || []);
        setRiesgosDisponibles(true);
      } catch (e) {
        console.warn("Tabla proyecto_riesgos no disponible:", e.message || e);
        setRiesgosDisponibles(false);
      } finally {
        setCargandoRiesgos(false);
      }
    })();
  }, [editProject]);

  const guardarRiesgo = async (payload) => {
    try {
      if (riesgoForm && riesgoForm.mode === "edit") {
        const { error } = await supabase.from("proyecto_riesgos").update(payload).eq("id", riesgoForm.riesgo.id);
        if (error) throw error;
        setRiesgosProyecto(list => list.map(r => r.id === riesgoForm.riesgo.id ? { ...r, ...payload } : r));
      } else {
        const { data, error } = await supabase.from("proyecto_riesgos").insert({ proyectoId: editProject.id, ...payload }).select();
        if (error) throw error;
        setRiesgosProyecto(list => [...list, ...(data || [])]);
      }
      setRiesgoForm(null);
    } catch (e) {
      alert("No se pudo guardar el riesgo: " + (e.message || e) + (/column|relation/i.test(e.message||"") ? "\n\n(Puede que falte crear la tabla \"proyecto_riesgos\" en Supabase — ver README.)" : ""));
    }
  };

  const eliminarRiesgo = async (riesgo) => {
    if (!window.confirm('¿Eliminar el riesgo "' + riesgo.nombre + '"?')) return;
    setRiesgosProyecto(list => list.filter(r => r.id !== riesgo.id));
    try {
      const { error } = await supabase.from("proyecto_riesgos").delete().eq("id", riesgo.id);
      if (error) throw error;
    } catch (e) {
      alert("No se pudo eliminar el riesgo: " + (e.message || e));
      setRiesgosProyecto(list => [...list, riesgo]);
    }
  };

  useEffect(() => {
    if (!editProject) return;
    (async () => {
      setCargandoCambios(true);
      try {
        const { data, error } = await supabase.from("proyecto_cambios").select("*").eq("proyectoId", editProject.id).order("id", { ascending: false });
        if (error) throw error;
        setCambiosProyecto(data || []);
        setCambiosDisponibles(true);
      } catch (e) {
        console.warn("Tabla proyecto_cambios no disponible:", e.message || e);
        setCambiosDisponibles(false);
      } finally {
        setCargandoCambios(false);
      }
    })();
  }, [editProject]);

  // Compara el proyecto antes y después de guardar, y registra en proyecto_cambios
  // cada campo vigilado que haya cambiado. Se llama después de un guardado exitoso;
  // si la tabla todavía no existe, falla en silencio y no bloquea el guardado del proyecto.
  const registrarCambios = async (anterior, nuevo) => {
    if (!anterior) return;
    try {
      const filas = [];
      CAMBIOS_CAMPOS.forEach(campo => {
        const antes = anterior[campo.key];
        const despues = nuevo[campo.key];
        const antesStr = (antes === null || antes === undefined) ? "" : String(antes);
        const despuesStr = (despues === null || despues === undefined) ? "" : String(despues);
        if (antesStr === despuesStr) return;
        filas.push({
          proyectoId: editProject.id,
          campo: campo.label,
          valor_anterior: formatValorCambio(campo, antes, paises),
          valor_nuevo: formatValorCambio(campo, despues, paises),
          usuario: (session && session.nombre) || "Usuario"
        });
      });
      if (filas.length === 0) return;
      const { data, error } = await supabase.from("proyecto_cambios").insert(filas).select();
      if (error) throw error;
      setCambiosProyecto(list => [...(data || []), ...list]);
    } catch (e) {
      console.warn("No se pudo registrar el cambio (falta la tabla proyecto_cambios):", e.message || e);
    }
  };

  useEffect(() => {
    if (!editProject) return;
    (async () => {
      setCargandoComentarios(true);
      try {
        const { data, error } = await supabase.from("proyecto_comentarios").select("*").eq("proyectoId", editProject.id).order("id");
        if (error) throw error;
        setComentarios(data || []);
        setComentariosDisponibles(true);
      } catch (e) {
        console.warn("Tabla proyecto_comentarios no disponible:", e.message || e);
        setComentariosDisponibles(false);
      } finally {
        setCargandoComentarios(false);
      }
    })();
  }, [editProject]);

  const agregarComentario = async () => {
    const texto = nuevoComentario.trim();
    if (!texto || !editProject) return;
    setEnviandoComentario(true);
    try {
      const autor = (session && session.nombre) || "Usuario";
      const { data, error } = await supabase.from("proyecto_comentarios").insert({ proyectoId: editProject.id, autor, texto }).select();
      if (error) throw error;
      setComentarios(list => [...list, ...(data || [])]);
      setNuevoComentario("");
    } catch (e) {
      alert("No se pudo agregar el comentario: " + (e.message || e));
    } finally {
      setEnviandoComentario(false);
    }
  };

  const eliminarComentario = async (comentario) => {
    setComentarios(list => list.filter(c => c.id !== comentario.id));
    try {
      const { error } = await supabase.from("proyecto_comentarios").delete().eq("id", comentario.id);
      if (error) throw error;
    } catch (e) {
      alert("No se pudo eliminar el comentario: " + (e.message || e));
      setComentarios(list => [...list, comentario]);
    }
  };

  const formatearFecha = iso => {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      return d.toLocaleString("es-HN", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
    } catch (e) { return iso; }
  };

  const removeDraft = idx => { setDrafts(list => list.filter((_, i) => i !== idx)); setActive(a => Math.min(a, drafts.length - 2)); };

  const normalize = d => {
    const { _key, id, ...rest } = d;
    return {
      ...rest,
      pais_id: rest.pais_id ? parseInt(rest.pais_id) : null,
      prioridad: parseInt(rest.prioridad) || 3,
      avance: parseFloat(rest.avance) || 0,
      presupuesto: rest.presupuesto === "" || rest.presupuesto === null || rest.presupuesto === undefined ? null : parseFloat(String(rest.presupuesto).replace(/,/g,"")) || 0,
      gasto_real: rest.gasto_real === "" || rest.gasto_real === null || rest.gasto_real === undefined ? null : parseFloat(String(rest.gasto_real).replace(/,/g,"")) || 0,
      actualizado_en: new Date().toISOString(),
      actualizado_por: (session && session.nombre) || "Usuario"
    };

    try {
      if (editProject) {
        const d = drafts[0];
        if (!d.nombre.trim()) { alert("El nombre del proyecto es obligatorio"); return; }
        setSaving(true);
        const payload = normalize(d);
        const { error } = await supabase.from("proyectos").update(payload).eq("id", editProject.id);
        if (error) throw error;
        await registrarCambios(editProject, payload);
      } else {
        const rows = drafts.filter(d => d.nombre.trim()).map(normalize);
        if (!rows.length) { alert("Agrega al menos un proyecto con nombre"); return; }
        setSaving(true);
        const { error } = await supabase.from("proyectos").insert(rows);
        if (error) throw error;
      }
      onSaved();

      console.error(e);
      alert("No se pudo guardar: " + (e.message || e) + (/column/i.test(e.message||"") ? "\n\n(Puede que falte correr el SQL nuevo en Supabase — ver README.)" : ""));

              <div>País: <strong style={{color:y.text}}>{current.pais_id ? bandera((paises.find(p=>p.id===parseInt(current.pais_id))||{}).nombre) + " " + ((paises.find(p=>p.id===parseInt(current.pais_id))||{}).nombre || "") : "—"}</strong></div>
              <div>Inicio: <strong style={{color:y.text}}>{current.fecha_inicio || "—"}</strong></div>
            </div>

/* ---------- Usuarios (administrar: crear, editar, inactivar, país) ---------- */
function UsuarioFormModal({ paises, editUser, editPaisIds, onClose, onSaved }) {
  const [usuario, setUsuario] = useState(editUser ? editUser.usuario || "" : "");
  const [password, setPassword] = useState("");
  const [nombre, setNombre] = useState(editUser ? editUser.nombre || "" : "");
  const [estado, setEstado] = useState(editUser ? editUser.estado || "Activo" : "Activo");
  const [paisIds, setPaisIds] = useState(editPaisIds || []);
  const [saving, setSaving] = useState(false);

  const togglePais = id => {
    setPaisIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  };
  const seleccionarTodos = () => setPaisIds(paises.map(p => p.id));
  const seleccionarNinguno = () => setPaisIds([]);

  const guardar = async () => {
    if (!usuario.trim() || !nombre.trim()) { alert("Usuario y nombre son requeridos."); return; }
    if (!editUser && !password.trim()) { alert("La contraseña es requerida para un usuario nuevo."); return; }
    setSaving(true);
    try {
      // evitar usuario duplicado
      const { data: existentes, error: eDup } = await supabase.from("usuarios").select("id").eq("usuario", usuario.trim());
      if (eDup) throw eDup;
      if ((existentes || []).some(x => x.id !== (editUser && editUser.id))) {
        alert("Ya existe un usuario con ese nombre de usuario.");
        setSaving(false);
        return;
      }

      let usuarioId = editUser ? editUser.id : null;
      if (editUser) {
        const payload = { usuario: usuario.trim(), nombre: nombre.trim(), estado };
        if (password.trim()) payload.password = password.trim();
        const { error } = await supabase.from("usuarios").update(payload).eq("id", editUser.id);
        if (error) throw error;
      } else {
        const { data, error } = await supabase.from("usuarios").insert([{ usuario: usuario.trim(), password: password.trim(), nombre: nombre.trim(), estado }]).select();
        if (error) throw error;
        usuarioId = data && data[0] && data[0].id;
      }

      if (usuarioId) {
        try {
          // Reemplaza por completo la lista de países asignados: borra lo anterior y vuelve a insertar lo seleccionado.
          await supabase.from("proyecto_usuario_paises").delete().eq("usuarioId", usuarioId);
          if (paisIds.length > 0) {
            await supabase.from("proyecto_usuario_paises").insert(paisIds.map(pid => ({ usuarioId, pais_id: pid })));
          }
        } catch (e) {
          console.warn("proyecto_usuario_paises no disponible:", e.message || e);
        }
      }

      onSaved();
      onClose();
    } catch (e) {
      alert("No se pudo guardar: " + (e.message || e));
    } finally {
      setSaving(false);
    }
  };

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,.6)",zIndex:600,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={e => e.target === e.currentTarget && onClose()}>
      <div style={{background:y.surface,borderRadius:12,padding:"1.5rem",width:460,maxWidth:"92vw",maxHeight:"88vh",overflowY:"auto",boxShadow:"0 20px 50px rgba(0,0,0,.3)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
          <strong style={{fontSize:15,color:y.text}}>{editUser ? "Editar usuario" : "Agregar usuario"}</strong>
          <button onClick={onClose} style={{background:"none",border:"none",color:y.text3,cursor:"pointer",fontSize:18,lineHeight:1}}>✕</button>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div>
            <label style={{fontSize:11,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>Usuario *</label>
            <input value={usuario} onChange={e => setUsuario(e.target.value)} style={{...inputStyle, marginTop:4}} placeholder="nombre.apellido" />
          </div>
          <div>
            <label style={{fontSize:11,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>{editUser ? "Contraseña (vacío = sin cambiar)" : "Contraseña *"}</label>
            <input type="password" value={password} onChange={e => setPassword(e.target.value)} style={{...inputStyle, marginTop:4}} placeholder="••••••••" />
          </div>
          <div>
            <label style={{fontSize:11,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>Nombre completo *</label>
            <input value={nombre} onChange={e => setNombre(e.target.value)} style={{...inputStyle, marginTop:4}} placeholder="Nombre Apellido" />
          </div>
          <div>
            <label style={{fontSize:11,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>Estado</label>
            <select value={estado} onChange={e => setEstado(e.target.value)} style={{...inputStyle, marginTop:4}}>
              <option>Activo</option>
              <option>Inactivo</option>
            </select>
          </div>
          <div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
              <label style={{fontSize:11,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>Países ({paisIds.length === paises.length && paises.length > 0 ? "todos" : paisIds.length})</label>
              <div style={{display:"flex",gap:10}}>
                <button type="button" onClick={seleccionarTodos} style={{background:"none",border:"none",color:y.primary,fontSize:11,fontWeight:600,cursor:"pointer",padding:0}}>Todos</button>
                <button type="button" onClick={seleccionarNinguno} style={{background:"none",border:"none",color:y.text3,fontSize:11,fontWeight:600,cursor:"pointer",padding:0}}>Ninguno</button>
              </div>
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:8,padding:"0.6rem",background:y.grayBg,borderRadius:8,border:"1px solid "+y.border}}>
              {paises.length === 0 && <span style={{fontSize:12,color:y.text3}}>No hay países en el catálogo.</span>}
              {paises.map(p => (
                <label key={p.id} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,cursor:"pointer",padding:"4px 9px",borderRadius:7,background: paisIds.includes(p.id) ? y.primaryLight : y.surface, border:"1px solid "+(paisIds.includes(p.id) ? y.primary : y.border), fontWeight: paisIds.includes(p.id) ? 600 : 400, color: paisIds.includes(p.id) ? y.primary : y.text2}}>
                  <input type="checkbox" checked={paisIds.includes(p.id)} onChange={() => togglePais(p.id)} />
                  {bandera(p.nombre)} {p.nombre}
                </label>
              ))}
            </div>
          </div>
        </div>
        <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:20}}>
          <Btn onClick={onClose} disabled={saving}>Cancelar</Btn>
          <Btn primary onClick={guardar} disabled={saving}>{saving ? "Guardando..." : "Guardar"}</Btn>
        </div>
      </div>
    </div>
  );
}

function UsuariosView({ paises, usuarioPaises, usuarioPaisesDisponibles, onChanged }) {

  const [loading, setLoading] = useState(true);
  const [formAbierto, setFormAbierto] = useState(null); // null | {} (nuevo) | usuario (editar)

  const cargar = async () => {
    setLoading(true);
    try {
      const { data, error } = await supabase.from("usuarios").select("*").order("nombre");
      if (error) throw error;
      setUsuarios(data || []);
    } catch (e) {
      console.error(e);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { cargar(); }, []);

  const paisesDe = usuarioId => {
    const filas = (usuarioPaises || []).filter(x => x.usuarioId === usuarioId);
    return filas.map(f => (paises || []).find(p => p.id === f.pais_id)).filter(Boolean);
  };

  const toggleEstado = async u => {
    const nuevo = u.estado === "Activo" ? "Inactivo" : "Activo";
    setUsuarios(prev => prev.map(x => x.id === u.id ? { ...x, estado: nuevo } : x));
    try {
      const { error } = await supabase.from("usuarios").update({ estado: nuevo }).eq("id", u.id);
      if (error) throw error;
    } catch (e) {
      setUsuarios(prev => prev.map(x => x.id === u.id ? { ...x, estado: u.estado } : x));

        <React.Fragment>
          <span style={{fontSize:11,color:y.text3}}>Cuentas que pueden entrar a esta página (misma base que Kielsa CI)</span>

              <th style={{padding:"0.5rem 0.75rem",textAlign:"left",fontSize:10,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>Usuario</th>

              <th style={{padding:"0.5rem 0.75rem",textAlign:"left",fontSize:10,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>Estado</th>
              <th style={{padding:"0.5rem 0.75rem",textAlign:"right",fontSize:10,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>Acciones</th>
            </tr>
          </thead>
          <tbody>

  );

/* ---------- Accesos (asignar rol por usuario) ---------- */
function AccesosView({ session, onChanged }) {
  const [usuarios, setUsuarios] = useState([]);
  const [permisos, setPermisos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [disponible, setDisponible] = useState(true);
  const [guardandoId, setGuardandoId] = useState(null);

  useEffect(() => {
    (async () => {
      setLoading(true);
      try {
        const [{ data: us, error: e1 }, { data: pe, error: e2 }] = await Promise.all([
          supabase.from("usuarios").select("*").order("nombre"),
          supabase.from("proyecto_permisos").select("*")
        ]);
        if (e1) throw e1;
        setUsuarios(us || []);
        if (e2) throw e2;
        setPermisos(pe || []);
        setDisponible(true);
      } catch (e) {
        console.warn("proyecto_permisos no disponible:", e.message || e);
        setDisponible(false);
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  const rolDe = usuarioId => {
    const row = permisos.find(p => p.usuarioId === usuarioId);
    return row ? row.rol : "admin";
  };

  const cambiarRol = async (usuarioId, nuevoRol) => {
    setGuardandoId(usuarioId);
    const existing = permisos.find(p => p.usuarioId === usuarioId);
    try {
      if (existing) {
        const { error } = await supabase.from("proyecto_permisos").update({ rol: nuevoRol }).eq("id", existing.id);
        if (error) throw error;
        setPermisos(list => list.map(p => p.id === existing.id ? { ...p, rol: nuevoRol } : p));
      } else {
        const { data, error } = await supabase.from("proyecto_permisos").insert({ usuarioId, rol: nuevoRol }).select();
        if (error) throw error;
        setPermisos(list => [...list, ...(data || [])]);
      }
      onChanged && onChanged();
    } catch (e) {
      alert("No se pudo cambiar el rol: " + (e.message || e));
    } finally {
      setGuardandoId(null);
    }
  };

  return (
    <React.Fragment>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:16}}>
        <div style={{background:y.primaryLight,border:"1px solid #c7d2fe",borderRadius:10,padding:"0.8rem 0.9rem"}}>
          <div style={{fontSize:12,fontWeight:800,color:y.primary,marginBottom:4}}>Administrador</div>
          <div style={{fontSize:11,color:y.text2,lineHeight:1.5}}>Acceso total: crear, editar, eliminar proyectos y gestionar usuarios.</div>
        </div>
        <div style={{background:y.warningBg,border:"1px solid #fde68a",borderRadius:10,padding:"0.8rem 0.9rem"}}>
          <div style={{fontSize:12,fontWeight:800,color:y.warning,marginBottom:4}}>Editor</div>
          <div style={{fontSize:11,color:y.text2,lineHeight:1.5}}>Crea y edita proyectos, mueve el Kanban y comenta. No puede eliminar ni gestionar usuarios.</div>
        </div>
        <div style={{background:y.grayBg,border:"1px solid "+y.border,borderRadius:10,padding:"0.8rem 0.9rem"}}>
          <div style={{fontSize:12,fontWeight:800,color:y.gray,marginBottom:4}}>Solo lectura</div>
          <div style={{fontSize:11,color:y.text2,lineHeight:1.5}}>Ve proyectos, filtra y exporta a Excel/PDF. No puede crear, editar ni comentar.</div>
        </div>
      </div>

      <Card mb={0}>
        <CardHeader icon="ti-shield-lock" left={"Accesos (" + usuarios.length + ")"} right={<span style={{fontSize:11,color:y.text3}}>Rol de cada usuario en esta página</span>} />
        {!disponible ? (
          <div style={{fontSize:12,color:y.text3,padding:"1.5rem",textAlign:"center"}}>Esta función todavía no está activada en la base de datos (falta crear la tabla "proyecto_permisos"). Mientras tanto, todos los usuarios activos tienen acceso completo (Administrador).</div>
        ) : loading ? (

          <table style={{width:"100%",borderCollapse:"collapse"}}>

/* ---------- Catálogo genérico (Áreas / Países / Responsables) ---------- */
function CatalogoView({ titulo, descripcion, icono, tabla, onChanged }) {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [disponible, setDisponible] = useState(true);
  const [nuevo, setNuevo] = useState("");
  const [guardando, setGuardando] = useState(false);
  const [editandoId, setEditandoId] = useState(null);
  const [editandoTexto, setEditandoTexto] = useState("");

  const cargar = async () => {
    setLoading(true);
    try {
      const { data, error } = await supabase.from(tabla).select("*").order("nombre");
      if (error) throw error;
      setItems(data || []);
      setDisponible(true);
    } catch (e) {
      console.warn(tabla + " no disponible:", e.message || e);
      setDisponible(false);
    } finally {
      setLoading(false);
    }
  };
  useEffect(() => { cargar(); }, [tabla]);

  const agregar = async () => {
    const nombre = nuevo.trim();
    if (!nombre) return;
    setGuardando(true);
    try {
      const { data, error } = await supabase.from(tabla).insert({ nombre }).select();
      if (error) throw error;
      setItems(list => [...list, ...(data || [])].sort((a, b) => (a.nombre || "").localeCompare(b.nombre || "")));
      setNuevo("");
      onChanged && onChanged();
    } catch (e) {
      alert("No se pudo agregar: " + (e.message || e));
    } finally {
      setGuardando(false);
    }
  };

  const guardarEdicion = async (item) => {
    const nombre = editandoTexto.trim();
    if (!nombre) return;
    try {
      const { error } = await supabase.from(tabla).update({ nombre }).eq("id", item.id);
      if (error) throw error;
      setItems(list => list.map(i => i.id === item.id ? { ...i, nombre } : i));
      setEditandoId(null);
      onChanged && onChanged();
    } catch (e) {
      alert("No se pudo guardar: " + (e.message || e));
    }
  };

  const eliminar = async (item) => {
    if (!window.confirm('¿Eliminar "' + item.nombre + '"? Los proyectos que ya lo tengan asignado conservan el valor actual.')) return;
    setItems(list => list.filter(i => i.id !== item.id));
    try {
      const { error } = await supabase.from(tabla).delete().eq("id", item.id);
      if (error) throw error;
      onChanged && onChanged();
    } catch (e) {
      alert("No se pudo eliminar: " + (e.message || e));
      cargar();
    }
  };

  return (
    <Card mb={0}>
      <CardHeader icon={icono} left={titulo + " (" + items.length + ")"} right={<span style={{fontSize:11,color:y.text3}}>{descripcion}</span>} />
      <div style={{padding:"1rem 1.1rem"}}>
        {!disponible ? (
          <div style={{fontSize:12,color:y.text3}}>Esta función todavía no está activada en la base de datos (falta crear la tabla "{tabla}"). Mientras tanto, el formulario de proyectos sigue funcionando con la lista anterior.</div>
        ) : loading ? (
          <div style={{fontSize:12,color:y.text3}}>Cargando...</div>
        ) : (
          <React.Fragment>
            <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:14}}>
              {items.length === 0 && <div style={{fontSize:12,color:y.text3}}>Sin registros todavía — agrega el primero abajo.</div>}
              {items.map(item => (
                <div key={item.id} style={{display:"flex",alignItems:"center",gap:8,background:y.grayBg,border:"1px solid "+y.border,borderRadius:8,padding:"6px 10px"}}>
                  {editandoId === item.id ? (
                    <React.Fragment>
                      <input value={editandoTexto} onChange={e => setEditandoTexto(e.target.value)} onKeyDown={e => { if (e.key === "Enter") guardarEdicion(item); if (e.key === "Escape") setEditandoId(null); }} style={{...inputStyle,fontSize:12,flex:1}} autoFocus />
                      <Btn sm primary onClick={() => guardarEdicion(item)}><i className="ti ti-check"/></Btn>
                      <Btn sm onClick={() => setEditandoId(null)}><i className="ti ti-x"/></Btn>
                    </React.Fragment>
                  ) : (
                    <React.Fragment>
                      <span style={{flex:1,fontSize:13,color:y.text}}>{item.nombre}</span>
                      <button onClick={() => { setEditandoId(item.id); setEditandoTexto(item.nombre); }} style={{background:"none",border:"none",color:y.text3,cursor:"pointer",fontSize:14,padding:4}}><i className="ti ti-pencil"/></button>
                      <button onClick={() => eliminar(item)} style={{background:"none",border:"none",color:y.text3,cursor:"pointer",fontSize:15,lineHeight:1,padding:4}}>×</button>
                    </React.Fragment>
                  )}
                </div>
              ))}
            </div>
            <div style={{display:"flex",gap:6}}>
              <input value={nuevo} onChange={e => setNuevo(e.target.value)} onKeyDown={e => { if (e.key === "Enter") { e.preventDefault(); agregar(); } }} placeholder="Nuevo..." style={{...inputStyle,fontSize:13}} />
              <Btn primary sm disabled={guardando || !nuevo.trim()} onClick={agregar}><i className="ti ti-plus"/> Agregar</Btn>
            </div>
          </React.Fragment>
        )}
      </div>
    </Card>
  );
}

/* ---------- Carga de trabajo por persona ---------- */
// No necesita tabla nueva: junta las tareas del Cronograma de TODOS los proyectos
// (que ya se cargan para las alertas y el avance) y las agrupa por responsable.
function CargaTrabajoView({ tareas, proyectos }) {
  const proyectoPorId = useMemo(() => {
    const map = {};
    proyectos.forEach(p => { map[p.id] = p; });
    return map;
  }, [proyectos]);

  const carga = useMemo(() => {
    const map = {};
    tareas.forEach(t => {
      const est = estatusEfectivoTarea(t);
      if (est === "Completada") return; // la carga solo cuenta tareas activas
      const nombre = t.responsable && t.responsable.trim() ? t.responsable.trim() : "Sin asignar";
      if (!map[nombre]) map[nombre] = { nombre, activas:0, vencidas:0, proyectoIds: new Set() };
      map[nombre].activas++;
      if (est === "Vencida") map[nombre].vencidas++;
      if (t.proyectoId) map[nombre].proyectoIds.add(t.proyectoId);
    });
    return Object.values(map).sort((a, b) => b.activas - a.activas);
  }, [tareas]);

  const totalActivas = carga.reduce((s, c) => s + c.activas, 0);

  return (
    <Card mb={0}>
      <CardHeader icon="ti-users-group" left={"Carga de trabajo (" + carga.length + " personas)"} right={<span style={{fontSize:11,color:y.text3}}>{totalActivas} tareas activas en total, de todos los proyectos</span>} />
      <div style={{padding:"1rem 1.1rem"}}>
        {tareas.length === 0 ? (
          <div style={{fontSize:12,color:y.text3}}>Todavía no hay tareas del Cronograma en ningún proyecto — esta vista se llena sola en cuanto empieces a usar la pestaña Cronograma.</div>
        ) : carga.length === 0 ? (
          <div style={{fontSize:12,color:y.text3}}>Nadie tiene tareas activas en este momento — todo está completado.</div>
        ) : (
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5}}>
              <thead>
                <tr style={{background:y.grayBg}}>
                  {["Responsable","Tareas activas","Vencidas","Proyectos","Carga"].map(h => (
                    <th key={h} style={{textAlign:"left",fontSize:10,fontWeight:800,color:y.text3,textTransform:"uppercase",letterSpacing:.3,padding:"0.55rem 0.6rem",borderBottom:"1px solid "+y.border,whiteSpace:"nowrap"}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {carga.map(c => {
                  const nivel = nivelCarga(c.activas);
                  const [nivelBg, nivelColor] = CARGA_COLOR[nivel];
                  const nombresProyectos = Array.from(c.proyectoIds).map(id => (proyectoPorId[id] || {}).nombre).filter(Boolean);
                  return (
                    <tr key={c.nombre} style={{borderBottom:"1px solid "+y.grayBg}}>
                      <td style={{padding:"0.55rem 0.6rem",fontWeight:700,color: c.nombre === "Sin asignar" ? y.text3 : y.text}}>{c.nombre}</td>
                      <td style={{padding:"0.55rem 0.6rem"}}>
                        <span style={{display:"inline-block",width:60,height:6,borderRadius:20,background:y.border,position:"relative",marginRight:8,verticalAlign:"middle"}}>
                          <span style={{position:"absolute",left:0,top:0,bottom:0,borderRadius:20,background:nivelColor,width:Math.min(c.activas*15,100)+"%"}}/>
                        </span>
                        {c.activas}
                      </td>
                      <td style={{padding:"0.55rem 0.6rem",color: c.vencidas > 0 ? y.danger : y.text3,fontWeight: c.vencidas > 0 ? 700 : 400}}>{c.vencidas || "—"}</td>
                      <td style={{padding:"0.55rem 0.6rem",color:y.text3,maxWidth:280,fontSize:11.5}} title={nombresProyectos.join(", ")}>{nombresProyectos.length > 0 ? nombresProyectos.join(", ") : "—"}</td>
                      <td style={{padding:"0.55rem 0.6rem"}}>
                        <span style={{display:"inline-flex",padding:"3px 9px",borderRadius:20,fontSize:10.5,fontWeight:700,background:nivelBg,color:nivelColor,whiteSpace:"nowrap"}}>{nivel}</span>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </Card>
  );
}
