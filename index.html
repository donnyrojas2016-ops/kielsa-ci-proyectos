// Si el proyecto tiene tareas, el avance se calcula solo (completas / total).
// Si no tiene tareas todavía, se usa el % que la persona escribió a mano (compatibilidad con proyectos existentes).
function avanceEfectivo(proyecto, tareasDelProyecto) {
  if (tareasDelProyecto && tareasDelProyecto.length > 0) {
    const completas = tareasDelProyecto.filter(t => t.completada).length;
    return completas / tareasDelProyecto.length;
  }
  return parseFloat(proyecto.avance) || 0;
}

// Calcula si un proyecto está vencido o a punto de vencer según su fecha_fin real,
// sin depender de que alguien haya cambiado manualmente el campo "estado".
// Los proyectos ya Cumplidos o Cancelados no generan alerta.
function estadoVencimiento(p) {
  if (!p.fecha_fin) return null;
  if (p.estado === "Cumplido" || p.estado === "Cancelado") return null;
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const fin = new Date(p.fecha_fin + "T00:00:00");
  if (isNaN(fin.getTime())) return null;
  const dias = Math.round((fin - hoy) / 86400000);
  if (dias < 0) return { tipo: "vencido", dias: Math.abs(dias) };
  if (dias <= 7) return { tipo: "pronto", dias };
  return null;
}
function textoVencimiento(v) {
  if (v.tipo === "vencido") return "Vencido hace " + v.dias + (v.dias === 1 ? " día" : " días");
  if (v.dias === 0) return "Vence hoy";
  return "Vence en " + v.dias + (v.dias === 1 ? " día" : " días");
}

/* ---------- Componentes base ---------- */
function Badge({ label }) {
  const [bg, color] = ESTADO_COLOR[label] || [y.grayBg, y.gray];
  return <span style={{display:"inline-flex",alignItems:"center",padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:700,whiteSpace:"nowrap",background:bg,color}}>{label}</span>;
}

function Btn({ children, primary, danger, outline, sm, onClick, disabled, title, type }) {
  return (
    <button type={type||"button"} onClick={onClick} disabled={disabled} title={title} style={{

      cursor: disabled ? "not-allowed" : "pointer",
      opacity: disabled ? 0.5 : 1,
      whiteSpace:"nowrap"
    }}>{children}</button>
  );
}

const inputStyle = { width:"100%", padding:"0.45rem 0.75rem", fontSize:13, border:"1px solid "+y.border2, borderRadius:8, background:y.surface, color:y.text, outline:"none", fontFamily:"inherit", boxSizing:"border-box" };

function Card({ children, mb }) {

}
function CardHeader({ left, right, icon }) {

/* ---------- Login ---------- */
function Login({ onLogin }) {
  const [usuario, setUsuario] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState(false);
  const [loading, setLoading] = useState(false);

  const submit = async () => {
    setLoading(true); setError(false);
    try {
      const { data, error: err } = await supabase.from("usuarios").select("*");
      if (err) throw err;
      const found = (data || []).find(u => u.usuario === usuario && u.password === password && u.estado === "Activo");
      if (found) {
        onLogin({ id: found.id, usuario: found.usuario, nombre: found.nombre || found.usuario });
      } else {
        setError(true);
        setPassword("");
      }
    } catch (e) {
      console.error(e);
      alert("No se pudo validar el usuario. Intenta de nuevo.");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#0f172a,#1e4db7)"}}>
      <div style={{background:y.surface,borderRadius:16,padding:"2.25rem 2rem",width:360,boxShadow:"0 20px 50px rgba(0,0,0,.25)"}}>
        <div style={{textAlign:"center",marginBottom:22}}>
          <div style={{width:52,height:52,borderRadius:12,background:y.primaryLight,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px"}}>
            <i className="ti ti-briefcase" style={{fontSize:26,color:y.primary}}/>
          </div>
          <div style={{fontSize:17,fontWeight:800,color:y.text}}>Kielsa CI — Proyectos</div>
          <div style={{fontSize:12,color:y.text3,marginTop:4}}>Ingresa con tu usuario de Kielsa CI</div>
        </div>
        <form onSubmit={e => { e.preventDefault(); if(!loading) submit(); }}>
          <div style={{marginBottom:12}}>
            <label style={{display:"block",fontSize:11,fontWeight:700,color:y.text3,textTransform:"uppercase",marginBottom:4}}>Usuario</label>
            <input name="username" autoComplete="username" value={usuario} onChange={e => setUsuario(e.target.value)} style={inputStyle} />
          </div>
          <div style={{marginBottom:16}}>
            <label style={{display:"block",fontSize:11,fontWeight:700,color:y.text3,textTransform:"uppercase",marginBottom:4}}>Contraseña</label>
            <input name="password" type="password" autoComplete="current-password" value={password} onChange={e => setPassword(e.target.value)} style={inputStyle} />
          </div>
          {error && <div style={{fontSize:12,color:y.danger,marginBottom:12,display:"flex",alignItems:"center",gap:6}}><i className="ti ti-alert-circle"/>Usuario y clave incorrectas</div>}
          <button type="submit" disabled={loading} style={{width:"100%",padding:"0.6rem",background:y.primary,border:"none",borderRadius:8,color:"#fff",fontWeight:700,fontSize:14,cursor:loading?"not-allowed":"pointer",opacity:loading?0.7:1}}>
            {loading ? "Ingresando..." : "Ingresar"}
          </button>
        </form>
      </div>
    </div>
  );
}

/* ---------- Formulario de proyecto (alta múltiple / edición) ---------- */
const nuevoProyecto = () => ({
  _key: Date.now() + Math.random(),
  codigo:"", categoria:"CI", prioridad:3, nombre:"", area:"", pais_id:"",
  responsable:"", ticket:"", fecha_inicio:"", fecha_fin:"", avance:0, estado:"Pendiente", observacion:""
});

function ProjectModal({ paises, session, editProject, onClose, onSaved, onTareasChanged }) {
  const [drafts, setDrafts] = useState(() => editProject ? [{ ...editProject }] : [nuevoProyecto()]);
  const [active, setActive] = useState(0);
  const [saving, setSaving] = useState(false);

  // ---- Tareas del proyecto (solo aplica en modo edición, sobre un proyecto ya guardado) ----
  const [tareasProyecto, setTareasProyecto] = useState([]);
  const [cargandoTareas, setCargandoTareas] = useState(false);
  const [tareasDisponibles, setTareasDisponibles] = useState(true);
  const [nuevaTarea, setNuevaTarea] = useState("");

  // ---- Comentarios / bitácora del proyecto (solo aplica en modo edición) ----
  const [comentarios, setComentarios] = useState([]);
  const [cargandoComentarios, setCargandoComentarios] = useState(false);
  const [comentariosDisponibles, setComentariosDisponibles] = useState(true);
  const [nuevoComentario, setNuevoComentario] = useState("");
  const [enviandoComentario, setEnviandoComentario] = useState(false);

  useEffect(() => {
    if (!editProject) return;
    (async () => {
      setCargandoTareas(true);
      try {
        const { data, error } = await supabase.from("proyecto_tareas").select("*").eq("proyectoId", editProject.id).order("id");
        if (error) throw error;
        setTareasProyecto(data || []);
        setTareasDisponibles(true);
      } catch (e) {
        console.warn("Tabla proyecto_tareas no disponible:", e.message || e);
        setTareasDisponibles(false);
      } finally {
        setCargandoTareas(false);
      }
    })();
  }, [editProject]);

  const agregarTarea = async () => {
    const titulo = nuevaTarea.trim();
    if (!titulo || !editProject) return;
    try {
      const { data, error } = await supabase.from("proyecto_tareas").insert({ proyectoId: editProject.id, titulo, completada: false }).select();
      if (error) throw error;
      setTareasProyecto(list => [...list, ...(data || [])]);
      setNuevaTarea("");
      onTareasChanged && onTareasChanged();
    } catch (e) {
      alert("No se pudo agregar la tarea: " + (e.message || e));
    }
  };

  const toggleTarea = async (tarea) => {
    setTareasProyecto(list => list.map(t => t.id === tarea.id ? { ...t, completada: !tarea.completada } : t));
    try {
      const { error } = await supabase.from("proyecto_tareas").update({ completada: !tarea.completada }).eq("id", tarea.id);
      if (error) throw error;
      onTareasChanged && onTareasChanged();
    } catch (e) {
      alert("No se pudo actualizar la tarea: " + (e.message || e));
      setTareasProyecto(list => list.map(t => t.id === tarea.id ? { ...t, completada: tarea.completada } : t));
    }
  };

  const eliminarTarea = async (tarea) => {
    setTareasProyecto(list => list.filter(t => t.id !== tarea.id));
    try {
      const { error } = await supabase.from("proyecto_tareas").delete().eq("id", tarea.id);
      if (error) throw error;
      onTareasChanged && onTareasChanged();
    } catch (e) {
      alert("No se pudo eliminar la tarea: " + (e.message || e));
      setTareasProyecto(list => [...list, tarea]);
    }
  };

  const tareasCompletas = tareasProyecto.filter(t => t.completada).length;
  const avancePctTareas = tareasProyecto.length ? Math.round((tareasCompletas / tareasProyecto.length) * 100) : 0;

  useEffect(() => {
    if (!editProject) return;
    (async () => {
      setCargandoComentarios(true);
      try {
        const { data, error } = await supabase.from("proyecto_comentarios").select("*").eq("proyectoId", editProject.id).order("id");
        if (error) throw error;
        setComentarios(data || []);
        setComentariosDisponibles(true);
      } catch (e) {
        console.warn("Tabla proyecto_comentarios no disponible:", e.message || e);
        setComentariosDisponibles(false);
      } finally {
        setCargandoComentarios(false);
      }
    })();
  }, [editProject]);

  const agregarComentario = async () => {
    const texto = nuevoComentario.trim();
    if (!texto || !editProject) return;
    setEnviandoComentario(true);
    try {
      const autor = (session && session.nombre) || "Usuario";
      const { data, error } = await supabase.from("proyecto_comentarios").insert({ proyectoId: editProject.id, autor, texto }).select();
      if (error) throw error;
      setComentarios(list => [...list, ...(data || [])]);
      setNuevoComentario("");
    } catch (e) {
      alert("No se pudo agregar el comentario: " + (e.message || e));
    } finally {
      setEnviandoComentario(false);
    }
  };

  const eliminarComentario = async (comentario) => {
    setComentarios(list => list.filter(c => c.id !== comentario.id));
    try {
      const { error } = await supabase.from("proyecto_comentarios").delete().eq("id", comentario.id);
      if (error) throw error;
    } catch (e) {
      alert("No se pudo eliminar el comentario: " + (e.message || e));
      setComentarios(list => [...list, comentario]);
    }
  };

  const formatearFecha = iso => {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      return d.toLocaleString("es-HN", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
    } catch (e) { return iso; }
  };

  const updateField = (idx, key, value) => setDrafts(list => list.map((d, i) => i === idx ? { ...d, [key]: value } : d));
  const addDraft = () => { const n = drafts.length; setDrafts(list => [...list, nuevoProyecto()]); setActive(n); };
  const removeDraft = idx => { setDrafts(list => list.filter((_, i) => i !== idx)); setActive(a => Math.min(a, drafts.length - 2)); };

  const normalize = d => {
    const { _key, id, ...rest } = d;
    return { ...rest, pais_id: rest.pais_id ? parseInt(rest.pais_id) : null, prioridad: parseInt(rest.prioridad) || 3, avance: parseFloat(rest.avance) || 0 };
  };

  const save = async () => {
    try {
      if (editProject) {
        const d = drafts[0];
        if (!d.nombre.trim()) { alert("El nombre del proyecto es obligatorio"); return; }
        setSaving(true);
        const { error } = await supabase.from("proyectos").update(normalize(d)).eq("id", editProject.id);
        if (error) throw error;
      } else {
        const rows = drafts.filter(d => d.nombre.trim()).map(normalize);
        if (!rows.length) { alert("Agrega al menos un proyecto con nombre"); return; }
        setSaving(true);
        const { error } = await supabase.from("proyectos").insert(rows);
        if (error) throw error;
      }
      onSaved();
    } catch (e) {
      console.error(e);
      alert("No se pudo guardar: " + (e.message || e));
    } finally {
      setSaving(false);
    }
  };

  const current = drafts[active] || drafts[0];
  const conNombre = drafts.filter(d => d.nombre.trim()).length;

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,.6)",zIndex:500,display:"flex",flexDirection:"column"}} onClick={e => e.target === e.currentTarget && onClose()}>
      <div style={{background:y.surface,display:"flex",flexDirection:"column",height:"100vh",maxHeight:"100vh"}}>

        <div style={{background:"linear-gradient(135deg,#1e4db7,#2563eb)",padding:"0.85rem 1.25rem",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <i className="ti ti-briefcase" style={{fontSize:18,color:"#fff"}}/>
            <strong style={{fontSize:15,color:"#fff"}}>{editProject ? "Editar proyecto" : "Agregar proyectos"}</strong>
            {!editProject && <span style={{fontSize:12,color:"rgba(255,255,255,.6)",marginLeft:4}}>{conNombre} con nombre</span>}
          </div>
          <div style={{display:"flex",gap:8}}>
            {!editProject && <Btn onClick={addDraft}><i className="ti ti-plus"/> Agregar proyecto</Btn>}
            <Btn primary disabled={saving} onClick={save}><i className="ti ti-check"/> {saving ? "Guardando..." : editProject ? "Guardar cambios" : "Guardar " + conNombre + " proyecto(s)"}</Btn>
            <button onClick={onClose} style={{background:"rgba(255,255,255,.15)",border:"none",borderRadius:6,color:"#fff",padding:"4px 10px",cursor:"pointer",fontSize:13}}>✕</button>
          </div>
        </div>

        {!editProject && (
          <div style={{display:"flex",gap:4,padding:"0.6rem 1rem 0",background:y.grayBg,borderBottom:"1px solid "+y.border,overflowX:"auto",flexShrink:0}}>
            {drafts.map((d, i) => (
              <div key={d._key} onClick={() => setActive(i)} style={{
                padding:"0.4rem 1rem",borderRadius:"8px 8px 0 0",cursor:"pointer",fontSize:12,fontWeight:600,
                background: active === i ? y.surface : "transparent",
                borderTop: active === i ? "2px solid "+y.primary : "2px solid transparent",
                borderLeft: active === i ? "1px solid "+y.border : "none",
                borderRight: active === i ? "1px solid "+y.border : "none",
                color: active === i ? y.primary : y.text3,
                display:"flex",alignItems:"center",gap:6,whiteSpace:"nowrap"
              }}>
                {d.nombre.trim() ? d.nombre.substring(0,20)+"..." : "Proyecto " + (i+1)}
                {drafts.length > 1 && active === i && <button onClick={e => { e.stopPropagation(); removeDraft(i); }} style={{background:"none",border:"none",color:y.primary,cursor:"pointer",fontSize:14,padding:0,lineHeight:1}}>×</button>}
              </div>
            ))}
            <button onClick={addDraft} style={{padding:"0.4rem 0.75rem",background:"none",border:"1px dashed "+y.border2,borderRadius:"8px 8px 0 0",cursor:"pointer",color:y.primary,fontSize:12,fontFamily:"inherit",whiteSpace:"nowrap"}}>
              <i className="ti ti-plus" style={{fontSize:12}}/> Nuevo
            </button>
          </div>
        )}

        <div style={{flex:1,overflowY:"auto",padding:"1.25rem"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:10,marginBottom:14}}>
            <div>
              <label style={labelStyle}>Código</label>
              <input value={current.codigo} onChange={e => updateField(active,"codigo",e.target.value)} style={{...inputStyle,fontSize:12}} />
            </div>
            <div>
              <label style={labelStyle}>Categoría</label>
              <select value={current.categoria} onChange={e => updateField(active,"categoria",e.target.value)} style={{...inputStyle,fontSize:12}}>
                {CATEGORIAS.map(c => <option key={c}>{c}</option>)}
              </select>
            </div>
            <div>
              <label style={labelStyle}>Prioridad</label>
              <select value={current.prioridad} onChange={e => updateField(active,"prioridad",e.target.value)} style={{...inputStyle,fontSize:12}}>
                <option value={1}>Alta</option>
                <option value={2}>Media</option>
                <option value={3}>Normal</option>
              </select>
            </div>
            <div>
              <label style={labelStyle}>Ticket</label>
              <input value={current.ticket} onChange={e => updateField(active,"ticket",e.target.value)} style={{...inputStyle,fontSize:12}} />
            </div>
          </div>

          <div style={{background:"#fff7ed",border:"1px solid #fed7aa",borderRadius:10,padding:"0.85rem 1rem",marginBottom:14}}>
            <div style={{fontSize:12,fontWeight:700,color:"#c2410c",marginBottom:8,display:"flex",alignItems:"center",gap:6}}>
              <i className="ti ti-pencil"/> Nombre del proyecto *
            </div>
            <textarea value={current.nombre} onChange={e => updateField(active,"nombre",e.target.value)} placeholder="Ej: Automatización de conciliaciones bancarias..." rows={2} style={{...inputStyle,width:"100%",fontSize:14,fontWeight:600,lineHeight:1.6,resize:"vertical"}} />

/* ---------- Usuarios y permisos ---------- */
function UsersModal({ session, onClose, onChanged }) {
  const [usuarios, setUsuarios] = useState([]);
  const [permisos, setPermisos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [disponible, setDisponible] = useState(true);
  const [guardandoId, setGuardandoId] = useState(null);

  useEffect(() => {
    (async () => {
      setLoading(true);
      try {
        const [{ data: us, error: e1 }, { data: pe, error: e2 }] = await Promise.all([
          supabase.from("usuarios").select("*").order("id"),
          supabase.from("proyecto_permisos").select("*")
        ]);
        if (e1) throw e1;
        setUsuarios(us || []);
        if (e2) throw e2;
        setPermisos(pe || []);
        setDisponible(true);
      } catch (e) {
        console.warn("proyecto_permisos no disponible:", e.message || e);
        setDisponible(false);
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  const rolDe = usuarioId => {
    const row = permisos.find(p => p.usuarioId === usuarioId);
    return row ? row.rol : "admin";
  };

  const cambiarRol = async (usuarioId, nuevoRol) => {
    setGuardandoId(usuarioId);
    const existing = permisos.find(p => p.usuarioId === usuarioId);
    try {
      if (existing) {
        const { error } = await supabase.from("proyecto_permisos").update({ rol: nuevoRol }).eq("id", existing.id);
        if (error) throw error;
        setPermisos(list => list.map(p => p.id === existing.id ? { ...p, rol: nuevoRol } : p));
      } else {
        const { data, error } = await supabase.from("proyecto_permisos").insert({ usuarioId, rol: nuevoRol }).select();
        if (error) throw error;
        setPermisos(list => [...list, ...(data || [])]);
      }
      onChanged && onChanged();
    } catch (e) {
      alert("No se pudo cambiar el rol: " + (e.message || e));
    } finally {
      setGuardandoId(null);
    }
  };

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,.6)",zIndex:700,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={e => e.target === e.currentTarget && onClose()}>
      <div style={{background:y.surface,borderRadius:14,width:"100%",maxWidth:720,maxHeight:"85vh",display:"flex",flexDirection:"column",boxShadow:"0 20px 50px rgba(0,0,0,.3)",overflow:"hidden"}}>
        <div style={{background:"linear-gradient(135deg,#0f172a,#1e4db7)",padding:"0.9rem 1.25rem",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <i className="ti ti-users-group" style={{fontSize:18,color:"#fff"}}/>
            <strong style={{fontSize:15,color:"#fff"}}>Usuarios y permisos</strong>
          </div>
          <button onClick={onClose} style={{background:"rgba(255,255,255,.15)",border:"none",borderRadius:6,color:"#fff",padding:"4px 10px",cursor:"pointer",fontSize:13}}>✕</button>
        </div>

        <div style={{padding:"1rem 1.25rem",overflowY:"auto"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:16}}>
            <div style={{background:y.primaryLight,border:"1px solid #c7d2fe",borderRadius:10,padding:"0.8rem 0.9rem"}}>
              <div style={{fontSize:12,fontWeight:800,color:y.primary,marginBottom:4}}>Administrador</div>
              <div style={{fontSize:11,color:y.text2,lineHeight:1.5}}>Acceso total: crear, editar, eliminar proyectos y gestionar usuarios.</div>
            </div>
            <div style={{background:y.warningBg,border:"1px solid #fde68a",borderRadius:10,padding:"0.8rem 0.9rem"}}>
              <div style={{fontSize:12,fontWeight:800,color:y.warning,marginBottom:4}}>Editor</div>
              <div style={{fontSize:11,color:y.text2,lineHeight:1.5}}>Crea y edita proyectos, mueve el Kanban y comenta. No puede eliminar ni gestionar usuarios.</div>
            </div>
            <div style={{background:y.grayBg,border:"1px solid "+y.border,borderRadius:10,padding:"0.8rem 0.9rem"}}>
              <div style={{fontSize:12,fontWeight:800,color:y.gray,marginBottom:4}}>Solo lectura</div>
              <div style={{fontSize:11,color:y.text2,lineHeight:1.5}}>Ve proyectos, filtra y exporta a Excel. No puede crear, editar ni comentar.</div>
            </div>
          </div>

          {!disponible ? (
            <div style={{fontSize:12,color:y.text3,padding:"1rem",textAlign:"center"}}>Esta función todavía no está activada en la base de datos (falta crear la tabla "proyecto_permisos"). Mientras tanto, todos los usuarios activos tienen acceso completo (Administrador).</div>
          ) : loading ? (
            <div style={{fontSize:12,color:y.text3,padding:"1rem",textAlign:"center"}}>Cargando usuarios...</div>
          ) : (
            <div style={{border:"1px solid "+y.border,borderRadius:10,overflow:"hidden"}}>
              <table style={{width:"100%",borderCollapse:"collapse"}}>
                <thead>
                  <tr style={{background:y.grayBg}}>
                    <th style={{padding:"0.5rem 0.75rem",textAlign:"left",fontSize:10,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>Usuario</th>
                    <th style={{padding:"0.5rem 0.75rem",textAlign:"left",fontSize:10,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>Estado</th>
                    <th style={{padding:"0.5rem 0.75rem",textAlign:"left",fontSize:10,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>Rol en Proyectos</th>
                  </tr>
                </thead>
                <tbody>
                  {usuarios.map(u => (
                    <tr key={u.id} style={{borderTop:"1px solid "+y.border}}>
                      <td style={{padding:"0.55rem 0.75rem",fontSize:12.5}}>
                        <div style={{fontWeight:700,color:y.text}}>{u.nombre || u.usuario}{u.id === session.id && <span style={{fontWeight:400,color:y.text3}}> (tú)</span>}</div>
                        <div style={{fontSize:10.5,color:y.text3}}>{u.usuario}</div>
                      </td>
                      <td style={{padding:"0.55rem 0.75rem"}}>
                        <span style={{display:"inline-flex",alignItems:"center",padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:700,background: u.estado==="Activo" ? y.successBg : y.grayBg, color: u.estado==="Activo" ? y.success : y.gray}}>{u.estado || "—"}</span>
                      </td>
                      <td style={{padding:"0.55rem 0.75rem"}}>
                        <select value={rolDe(u.id)} disabled={guardandoId === u.id} onChange={e => cambiarRol(u.id, e.target.value)} style={{...inputStyle,fontSize:12,width:"auto",padding:"0.3rem 0.5rem"}}>
                          <option value="admin">Administrador</option>
                          <option value="editor">Editor</option>
                          <option value="lector">Solo lectura</option>
                        </select>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

/* ---------- App principal ---------- */
function App() {
  const [session, setSession] = useState(() => {
    try { return JSON.parse(localStorage.getItem("kielsa_proy_session") || "null"); } catch (e) { return null; }
  });
  const [proyectos, setProyectos] = useState([]);
  const [paises, setPaises] = useState([]);
  const [tareas, setTareas] = useState([]);
  const [permisos, setPermisos] = useState([]);
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState("tarjetas");
  const [filtroCategoria, setFiltroCategoria] = useState("");
  const [filtroEstado, setFiltroEstado] = useState("");
  const [filtroPais, setFiltroPais] = useState("");
  const [alertasAbiertas, setAlertasAbiertas] = useState(true);
  const [modal, setModal] = useState(null); // {mode:"add"|"edit", project}
  const [modalUsuarios, setModalUsuarios] = useState(false);
  const [toDelete, setToDelete] = useState(null);
  const [deleting, setDeleting] = useState(false);

  const cargarDatos = async () => {
    setLoading(true);
    try {
      const [{ data: pr, error: e1 }, { data: pa, error: e2 }] = await Promise.all([
        supabase.from("proyectos").select("*").order("id"),
        supabase.from("paises").select("*").order("id")
      ]);
      if (e1) throw e1;
      if (e2) throw e2;
      setProyectos(pr || []);
      setPaises(pa || []);
    } catch (e) {
      console.error(e);
      alert("No se pudieron cargar los datos: " + (e.message || e));
    }
    await Promise.all([cargarTareas(), cargarPermisos()]);
    setLoading(false);
  };

  const cargarTareas = async () => {
    try {
      const { data, error } = await supabase.from("proyecto_tareas").select("*").order("id");
      if (error) throw error;
      setTareas(data || []);
    } catch (e) {
      // Tabla todavía no creada en Supabase: la app sigue funcionando con el avance manual.
      console.warn("proyecto_tareas no disponible:", e.message || e);
      setTareas([]);
    }
  };

  const cargarPermisos = async () => {
    try {
      const { data, error } = await supabase.from("proyecto_permisos").select("*");
      if (error) throw error;
      setPermisos(data || []);
    } catch (e) {
      // Tabla todavía no creada en Supabase: mientras tanto, todos los usuarios son Administrador.
      console.warn("proyecto_permisos no disponible:", e.message || e);
      setPermisos([]);
    }
  };

  useEffect(() => { if (session) cargarDatos(); }, [session]);

  // Rol del usuario que tiene la sesión abierta en esta página. Si no tiene una fila
  // asignada en proyecto_permisos, por seguridad y compatibilidad se trata como Administrador.
  const miRol = useMemo(() => {
    if (!session) return "lector";
    const row = permisos.find(p => p.usuarioId === session.id);
    return row ? row.rol : "admin";
  }, [permisos, session]);
  const puedeEditar = miRol === "admin" || miRol === "editor";
  const puedeEliminar = miRol === "admin";

  const tareasPorProyecto = useMemo(() => {
    const map = {};
    tareas.forEach(t => {
      if (!map[t.proyectoId]) map[t.proyectoId] = [];
      map[t.proyectoId].push(t);
    });
    return map;
  }, [tareas]);

  // Alertas automáticas de vencimiento: se recalculan solas según la fecha de fin,
  // no dependen de que alguien marque el proyecto como "Vencido" a mano.
  const alertas = useMemo(() => {
    return proyectos
      .map(p => ({ project: p, v: estadoVencimiento(p) }))
      .filter(x => x.v)
      .sort((a, b) => {
        if (a.v.tipo !== b.v.tipo) return a.v.tipo === "vencido" ? -1 : 1;
        return a.v.tipo === "vencido" ? b.v.dias - a.v.dias : a.v.dias - b.v.dias;
      });
  }, [proyectos]);

  const login = (user) => {
    setSession(user);
    localStorage.setItem("kielsa_proy_session", JSON.stringify(user));
  };
  const logout = () => {
    setSession(null);
    localStorage.removeItem("kielsa_proy_session");
    setProyectos([]); setPaises([]);
  };

  const nombrePais = id => { const p = paises.find(x => x.id === id); return p ? p.nombre : ""; };

  const filtrados = useMemo(() => proyectos.filter(p =>
    (!filtroCategoria || p.categoria === filtroCategoria) &&
    (!filtroEstado || p.estado === filtroEstado) &&
    (!filtroPais || p.pais_id === parseInt(filtroPais))
  ), [proyectos, filtroCategoria, filtroEstado, filtroPais]);

  const total = proyectos.length;
  const cumplidos = proyectos.filter(p => p.estado === "Cumplido").length;
  const enProgreso = proyectos.filter(p => ["En progreso","En dimensionamiento"].includes(p.estado)).length;
  const pendientes = proyectos.filter(p => p.estado === "Pendiente").length;
  const avancePromedio = total ? Math.round(proyectos.reduce((s,p) => s + avanceEfectivo(p, tareasPorProyecto[p.id]), 0) / total * 100) : 0;

  const eliminar = async () => {
    setDeleting(true);
    try {
      const { error } = await supabase.from("proyectos").delete().eq("id", toDelete.id);
      if (error) throw error;
      setToDelete(null);
      cargarDatos();
    } catch (e) {
      console.error(e);
      alert("No se pudo eliminar: " + (e.message || e));
    } finally {
      setDeleting(false);
    }
  };

  // Usado por el Kanban al soltar una tarjeta en otra columna.
  const cambiarEstado = async (id, nuevoEstado) => {
    const anterior = proyectos.find(p => p.id === id);
    if (!anterior || anterior.estado === nuevoEstado) return;
    setProyectos(list => list.map(p => p.id === id ? { ...p, estado: nuevoEstado } : p)); // optimista
    try {
      const { error } = await supabase.from("proyectos").update({ estado: nuevoEstado }).eq("id", id);
      if (error) throw error;
    } catch (e) {
      console.error(e);
      alert("No se pudo mover el proyecto: " + (e.message || e));
      setProyectos(list => list.map(p => p.id === id ? anterior : p)); // revertir
    }
  };

  const exportarExcel = () => {
    const filas = filtrados.map(p => ({
      "Código": p.codigo || "",
      "Categoría": p.categoria || "",
      "Prioridad": p.prioridad === 1 ? "Alta" : p.prioridad === 2 ? "Media" : "Normal",
      "Nombre": p.nombre || "",
      "Área": p.area || "",
      "País": nombrePais(p.pais_id),
      "Responsable": p.responsable || "",
      "Ticket": p.ticket || "",
      "Fecha inicio": p.fecha_inicio || "",
      "Fecha fin": p.fecha_fin || "",
      "Avance (%)": Math.round((parseFloat(p.avance)||0)*100),
      "Estado": p.estado || "",
      "Observación": p.observacion || ""
    }));
    const ws = XLSX.utils.json_to_sheet(filas);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Proyectos");
    XLSX.writeFile(wb, "Proyectos_KielsaCI_" + new Date().toISOString().split("T")[0] + ".xlsx");
  };

  if (!session) return <Login onLogin={login} />;

  return (
    <div style={{minHeight:"100vh",background:y.bg}}>
      {/* Header */}
      <div style={{background:"linear-gradient(135deg,#0f172a,#1e4db7)",padding:"0.9rem 1.5rem",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <i className="ti ti-briefcase" style={{fontSize:22,color:"#fff"}}/>
          <div>
            <div style={{fontSize:16,fontWeight:800,color:"#fff"}}>Kielsa CI — Proyectos</div>
            <div style={{fontSize:11,color:"rgba(255,255,255,.65)"}}>Vista independiente del módulo de Proyectos</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div onClick={() => setAlertasAbiertas(v => !v)} title="Alertas de vencimiento" style={{position:"relative",width:34,height:34,borderRadius:8,background:"rgba(255,255,255,.12)",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
            <i className="ti ti-bell" style={{fontSize:15,color:"#fff"}}/>
            {alertas.length > 0 && (
              <span style={{position:"absolute",top:-4,right:-4,background:y.danger,color:"#fff",fontSize:9,fontWeight:800,borderRadius:20,padding:"1px 5px",border:"2px solid #16234a",lineHeight:1.3}}>{alertas.length}</span>
            )}
          </div>
          {miRol === "admin" && (
            <div onClick={() => setModalUsuarios(true)} title="Usuarios y permisos" style={{width:34,height:34,borderRadius:8,background:"rgba(255,255,255,.12)",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
              <i className="ti ti-users-group" style={{fontSize:15,color:"#fff"}}/>
            </div>
          )}
          <div style={{fontSize:12,color:"rgba(255,255,255,.85)"}}>
            <i className="ti ti-user-circle"/> {session.nombre}
            {miRol !== "admin" && <span style={{marginLeft:6,fontSize:10,background:"rgba(255,255,255,.15)",padding:"2px 7px",borderRadius:10,textTransform:"uppercase",fontWeight:700}}>{miRol === "editor" ? "Editor" : "Solo lectura"}</span>}
          </div>
          <button onClick={logout} style={{background:"rgba(255,255,255,.15)",border:"none",borderRadius:6,color:"#fff",padding:"6px 12px",cursor:"pointer",fontSize:12,display:"flex",alignItems:"center",gap:6}}>
            <i className="ti ti-logout"/> Salir
          </button>
        </div>
      </div>

      <div style={{maxWidth:1400,margin:"0 auto",padding:"1.25rem"}}>
        {loading ? (
          <div style={{textAlign:"center",padding:"4rem",color:y.text3}}>
            <i className="ti ti-loader-2" style={{fontSize:32}}/>
            <div style={{marginTop:8,fontSize:13}}>Cargando proyectos...</div>
          </div>
        ) : (
          <React.Fragment>
            {/* KPIs */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:12,marginBottom:16}}>
              {[
                { l:"Total proyectos", v:total, c:y.primary, bg:y.primaryLight, ic:"ti-briefcase" },
                { l:"Cumplidos", v:cumplidos, c:y.success, bg:y.successBg, ic:"ti-circle-check" },
                { l:"En progreso", v:enProgreso, c:"#0ea5e9", bg:"#e0f2fe", ic:"ti-progress" },
                { l:"Pendientes", v:pendientes, c:y.warning, bg:y.warningBg, ic:"ti-clock" },
                { l:"Avance promedio", v:avancePromedio+"%", c: avancePromedio>=70?y.success:y.warning, bg: avancePromedio>=70?y.successBg:y.warningBg, ic:"ti-chart-pie" }
              ].map(k => (
                <div key={k.l} style={{background:y.surface,border:"1px solid "+y.border,borderRadius:12,padding:"0.9rem 1rem",borderTop:"3px solid "+k.c}}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                    <span style={{fontSize:10,color:y.text3,fontWeight:700,textTransform:"uppercase"}}>{k.l}</span>
                    <div style={{width:28,height:28,borderRadius:7,background:k.bg,display:"flex",alignItems:"center",justifyContent:"center"}}>
                      <i className={"ti "+k.ic} style={{fontSize:14,color:k.c}}/>
                    </div>
                  </div>
                  <div style={{fontSize:24,fontWeight:800,color:k.c}}>{k.v}</div>
                </div>
              ))}
            </div>

            {/* Resumen por categoría */}
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:16}}>
              {CATEGORIAS.map(cat => {
                const items = proyectos.filter(p => p.categoria === cat);
                const avance = items.length ? Math.round(items.reduce((s,p) => s+avanceEfectivo(p, tareasPorProyecto[p.id]),0)/items.length*100) : 0;
                const { c, bg, ic } = CATEGORIA_ICONOS[cat] || { c:y.gray, bg:y.grayBg, ic:"ti-folder" };
                return (
                  <div key={cat} onClick={() => setFiltroCategoria(filtroCategoria === cat ? "" : cat)} style={{background:y.surface,border:"2px solid "+(filtroCategoria===cat?c:y.border),borderRadius:12,padding:"0.85rem 1rem",cursor:"pointer"}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                      <div style={{width:32,height:32,borderRadius:8,background:bg,display:"flex",alignItems:"center",justifyContent:"center",color:c}}>
                        <i className={"ti "+ic} style={{fontSize:16}}/>
                      </div>
                      <div>
                        <div style={{fontSize:12,fontWeight:700,color:y.text}}>{cat}</div>
                        <div style={{fontSize:10,color:y.text3}}>{items.length} proyectos</div>
                      </div>
                      <div style={{marginLeft:"auto",fontSize:16,fontWeight:800,color:c}}>{avance}%</div>
                    </div>
                    <div style={{height:6,background:y.border,borderRadius:3,overflow:"hidden"}}>
                      <div style={{height:"100%",borderRadius:3,background:c,width:avance+"%"}}/>
                    </div>
                  </div>
                );
              })}
            </div>

            {/* Alertas de vencimiento */}
            {alertas.length > 0 && alertasAbiertas && (
              <div style={{background:y.surface,border:"1px solid "+y.border,borderLeft:"4px solid "+y.danger,borderRadius:12,marginBottom:16,overflow:"hidden",boxShadow:"0 1px 3px rgba(0,0,0,.06)"}}>
                <div style={{padding:"0.85rem 1.1rem",borderBottom:"1px solid "+y.border,display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,flexWrap:"wrap",background:"linear-gradient(to right,#fafbff,#fff)"}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <i className="ti ti-alert-triangle" style={{fontSize:16,color:y.danger}}/>
                    <span style={{fontSize:13,fontWeight:700,color:y.text}}>Alertas de vencimiento ({alertas.length})</span>
                  </div>
                  <span style={{fontSize:11,color:y.text3}}>Basado en la fecha de fin de cada proyecto</span>
                </div>
                <div>
                  {alertas.map(({ project: p, v }) => (
                    <div key={p.id} onClick={() => puedeEditar && setModal({mode:"edit", project:p})} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0.7rem 0.9rem",borderBottom:"1px solid "+y.grayBg,gap:10,cursor: puedeEditar ? "pointer" : "default"}}>
                      <div style={{display:"flex",alignItems:"center",gap:10,minWidth:0}}>
                        <div style={{width:32,height:32,borderRadius:9,background: v.tipo==="vencido"?y.dangerBg:y.warningBg,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                          <i className={"ti "+(v.tipo==="vencido"?"ti-clock":"ti-bell")} style={{fontSize:15,color: v.tipo==="vencido"?y.danger:y.warning}}/>
                        </div>
                        <div style={{minWidth:0}}>
                          <div style={{fontSize:13,fontWeight:700,color:y.text,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{p.nombre}{p.pais_id ? " — "+bandera(nombrePais(p.pais_id))+" "+nombrePais(p.pais_id) : ""}</div>
                          <div style={{fontSize:11,color:y.text3}}>Fecha fin: {p.fecha_fin}{p.responsable ? " · Responsable: "+p.responsable : ""}</div>
                        </div>
                      </div>
                      <span style={{display:"inline-flex",alignItems:"center",padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:700,whiteSpace:"nowrap",background: v.tipo==="vencido"?y.dangerBg:y.warningBg,color: v.tipo==="vencido"?y.danger:y.warning}}>
                        {textoVencimiento(v)}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Filtros y acciones */}
            <Card>
              <CardHeader
                icon="ti-briefcase"
                left={filtrados.length + " proyectos"}
                right={
                  <React.Fragment>
                    <select value={filtroCategoria} onChange={e => setFiltroCategoria(e.target.value)} style={{fontSize:11,padding:"0.28rem 0.55rem",borderRadius:6,border:"1px solid "+y.border2,color:y.text2}}>
                      <option value="">Todas las categorías</option>
                      {CATEGORIAS.map(c => <option key={c}>{c}</option>)}
                    </select>
                    <select value={filtroEstado} onChange={e => setFiltroEstado(e.target.value)} style={{fontSize:11,padding:"0.28rem 0.55rem",borderRadius:6,border:"1px solid "+y.border2,color:y.text2}}>
                      <option value="">Todos los estados</option>
                      {ESTADOS.map(s => <option key={s}>{s}</option>)}
                    </select>
                    <select value={filtroPais} onChange={e => setFiltroPais(e.target.value)} style={{fontSize:11,padding:"0.28rem 0.55rem",borderRadius:6,border:"1px solid "+y.border2,color:y.text2}}>
                      <option value="">Todos los países</option>
                      {paises.map(p => <option key={p.id} value={p.id}>{bandera(p.nombre)} {p.nombre}</option>)}
                    </select>
                    <div style={{display:"flex",border:"1px solid "+y.border2,borderRadius:6,overflow:"hidden"}}>
                      {["tarjetas","kanban","tabla"].map(v => (
                        <button key={v} title={v==="tarjetas"?"Tarjetas":v==="kanban"?"Kanban":"Tabla"} onClick={() => setView(v)} style={{padding:"0.28rem 0.6rem",border:"none",background: view===v ? y.primary : y.surface, color: view===v ? "#fff" : y.text2, cursor:"pointer",fontSize:11,fontWeight:600}}>
                          <i className={"ti "+(v==="tarjetas"?"ti-layout-grid":v==="kanban"?"ti-layout-kanban":"ti-list")}/>
                        </button>
                      ))}
                    </div>
                    <Btn sm onClick={exportarExcel}><i className="ti ti-file-spreadsheet"/> Excel</Btn>
                    {puedeEditar && <Btn primary sm onClick={() => setModal({mode:"add"})}><i className="ti ti-plus"/> Agregar proyecto</Btn>}
                  </React.Fragment>
                }
              />

              {view === "tarjetas" ? (
                <div style={{padding:"1rem",display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:12}}>
                  {filtrados.length === 0 && (
                    <div style={{gridColumn:"1 / -1",padding:"3rem",textAlign:"center",color:y.text3}}>
                      <i className="ti ti-briefcase-off" style={{fontSize:48,display:"block",marginBottom:12,opacity:.3}}/>
                      <div style={{fontSize:15,fontWeight:600}}>Sin proyectos</div>
                    </div>
                  )}
                  {filtrados.map(p => {
                    const { c, bg } = CATEGORIA_ICONOS[p.categoria] || { c:y.gray, bg:y.grayBg };
                    const tareasP = tareasPorProyecto[p.id] || [];
                    const avancePct = Math.round(avanceEfectivo(p, tareasP)*100);
                    const avanceColor = avancePct>=80?y.success:avancePct>=50?y.warning:y.danger;
                    const v = estadoVencimiento(p);
                    return (
                      <div key={p.id} style={{background:y.surface,border:"1px solid "+y.border,borderLeft: v ? "4px solid "+(v.tipo==="vencido"?y.danger:y.warning) : "1px solid "+y.border,borderRadius:12,overflow:"hidden",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}}>
                        <div style={{padding:"0.85rem 1rem",borderBottom:"1px solid "+y.border,background:"linear-gradient(to right,"+bg+",#fff)"}}>
                          <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:8,marginBottom:6}}>
                            <span style={{fontSize:9,fontWeight:700,padding:"2px 7px",borderRadius:10,background:bg,color:c,textTransform:"uppercase"}}>{p.categoria}</span>
                            <div style={{display:"flex",gap:4}}>
                              {p.prioridad === 1 && <span style={{fontSize:9,fontWeight:700,color:y.danger,background:y.dangerBg,padding:"2px 6px",borderRadius:6}}>ALTA</span>}
                              <Badge label={p.estado || "Pendiente"} />
                            </div>
                          </div>
                          <div style={{fontSize:13,fontWeight:700,color:y.text,lineHeight:1.4,marginBottom:4}}>{p.nombre}</div>
                          {p.codigo && <div style={{fontSize:10,color:y.text3}}>#{p.codigo}</div>}
                        </div>
                        <div style={{padding:"0.85rem 1rem"}}>
                          <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
                            {p.pais_id && <div style={{fontSize:11,color:y.text2,display:"flex",alignItems:"center",gap:3}}><i className="ti ti-map-pin" style={{fontSize:11,color:y.text3}}/>{bandera(nombrePais(p.pais_id))} {nombrePais(p.pais_id)}</div>}
                            {p.area && <div style={{fontSize:11,color:y.text2,display:"flex",alignItems:"center",gap:3}}><i className="ti ti-building" style={{fontSize:11,color:y.text3}}/>{p.area}</div>}
                            {p.responsable && <div style={{fontSize:11,color:y.text2,display:"flex",alignItems:"center",gap:3}}><i className="ti ti-user" style={{fontSize:11,color:y.text3}}/>{p.responsable}</div>}
                            {p.ticket && <div style={{fontSize:11,color:y.primary,fontWeight:600}}>Ticket #{p.ticket}</div>}
                          </div>
                          {p.fecha_inicio && (
                            <div style={{fontSize:10,color:y.text3,marginBottom:6,display:"flex",gap:8}}>
                              <span><i className="ti ti-calendar-event"/> {p.fecha_inicio}</span>
                              {p.fecha_fin && <span>→ {p.fecha_fin}</span>}
                            </div>
                          )}
                          <div style={{marginBottom:10}}>
                            <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:4}}>
                              <span style={{color:y.text2,fontWeight:600}}>Avance{tareasP.length > 0 && " · " + tareasP.filter(t=>t.completada).length + "/" + tareasP.length + " tareas"}</span>
                              <span style={{color:avanceColor,fontWeight:700}}>{avancePct}%</span>
                            </div>
                            <div style={{height:8,background:y.border,borderRadius:4,overflow:"hidden"}}>
                              <div style={{height:"100%",borderRadius:4,width:avancePct+"%",background:avanceColor}}/>
                            </div>
                          </div>
                          {v && (
                            <div style={{display:"flex",alignItems:"center",gap:6,fontSize:11,fontWeight:700,marginBottom:10,padding:"0.3rem 0.5rem",borderRadius:7,background: v.tipo==="vencido"?y.dangerBg:y.warningBg,color: v.tipo==="vencido"?y.danger:y.warning}}>
                              <i className={"ti "+(v.tipo==="vencido"?"ti-alert-triangle":"ti-bell")} style={{fontSize:13}}/>
                              {textoVencimiento(v)}
                            </div>
                          )}
                          {p.observacion && <div style={{fontSize:11,color:y.text2,background:y.grayBg,borderRadius:6,padding:"0.4rem 0.6rem",marginBottom:10}}>{p.observacion}</div>}
                          {(puedeEditar || puedeEliminar) && (
                            <div style={{display:"flex",justifyContent:"flex-end",gap:6,borderTop:"1px solid "+y.border,paddingTop:8}}>
                              {puedeEditar && <Btn sm onClick={() => setModal({mode:"edit", project:p})}><i className="ti ti-pencil"/> Editar</Btn>}
                              {puedeEliminar && <Btn sm danger onClick={() => setToDelete(p)}><i className="ti ti-trash"/></Btn>}
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              ) : view === "kanban" ? (
                <div style={{padding:"1rem",display:"flex",gap:12,overflowX:"auto"}}>
                  {ESTADOS.map(estado => {
                    const items = filtrados.filter(p => (p.estado || "Pendiente") === estado);
                    const [colBg, colColor] = ESTADO_COLOR[estado] || [y.grayBg, y.gray];
                    return (
                      <div key={estado}
                        onDragOver={e => e.preventDefault()}
                        onDrop={e => { e.preventDefault(); if (!puedeEditar) return; const id = parseInt(e.dataTransfer.getData("text/plain")); if (id) cambiarEstado(id, estado); }}
                        style={{minWidth:250,width:250,flexShrink:0,background:y.grayBg,borderRadius:10,padding:"0.6rem",display:"flex",flexDirection:"column"}}>
                        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0.3rem 0.4rem",marginBottom:8}}>
                          <span style={{fontSize:11,fontWeight:700,color:colColor}}>{estado}</span>
                          <span style={{fontSize:10,fontWeight:700,color:y.text3,background:y.surface,borderRadius:10,padding:"1px 8px"}}>{items.length}</span>
                        </div>
                        <div style={{display:"flex",flexDirection:"column",gap:8,minHeight:60}}>
                          {items.length === 0 && <div style={{fontSize:11,color:y.text3,textAlign:"center",padding:"1rem 0"}}>Sin proyectos</div>}
                          {items.map(p => {
                            const tareasP = tareasPorProyecto[p.id] || [];
                            const avancePct = Math.round(avanceEfectivo(p, tareasP)*100);
                            const { c: catColor, bg: catBg } = CATEGORIA_ICONOS[p.categoria] || { c:y.gray, bg:y.grayBg };
                            const v = estadoVencimiento(p);
                            return (
                              <div key={p.id} draggable={puedeEditar}
                                onDragStart={e => puedeEditar && e.dataTransfer.setData("text/plain", String(p.id))}
                                onClick={() => puedeEditar && setModal({mode:"edit", project:p})}
                                style={{background:y.surface,border:"1px solid "+y.border,borderLeft: v ? "3px solid "+(v.tipo==="vencido"?y.danger:y.warning) : "1px solid "+y.border,borderRadius:8,padding:"0.6rem 0.7rem",cursor: puedeEditar ? "grab" : "default",boxShadow:"0 1px 3px rgba(0,0,0,.05)"}}>
                                <div style={{fontSize:11,fontWeight:700,color:y.text,marginBottom:6,lineHeight:1.3}}>{p.nombre}</div>
                                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
                                  <span style={{fontSize:9,fontWeight:700,padding:"1px 6px",borderRadius:8,background:catBg,color:catColor}}>{p.categoria}</span>
                                  {p.prioridad === 1 && <span style={{fontSize:9,fontWeight:700,color:y.danger}}>ALTA</span>}
                                </div>
                                <div style={{height:5,background:y.border,borderRadius:3,overflow:"hidden",marginBottom:4}}>
                                  <div style={{height:"100%",width:avancePct+"%",background:y.primary,borderRadius:3}}/>
                                </div>
                                <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:y.text3}}>
                                  <span>{p.responsable || "—"}</span>
                                  <span>{avancePct}%</span>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
              ) : (
                <div style={{overflowX:"auto"}}>
                  <table style={{borderCollapse:"collapse",width:"100%",minWidth:1100}}>
                    <thead>
                      <tr style={{background:y.grayBg}}>
                        {["Cód.","Categoría","Nombre","Área","País","Responsable","Fechas","Avance","Estado","Acciones"].map(h => (
                          <th key={h} style={{padding:"0.5rem 0.6rem",textAlign:"left",fontSize:10,fontWeight:700,color:y.text3,borderBottom:"2px solid "+y.border2,textTransform:"uppercase",whiteSpace:"nowrap"}}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {filtrados.length === 0 && (
                        <tr><td colSpan={10} style={{padding:"2rem",textAlign:"center",color:y.text3}}>Sin proyectos</td></tr>
                      )}
                      {filtrados.map(p => {
                        const tareasP = tareasPorProyecto[p.id] || [];
                        const avancePct = Math.round(avanceEfectivo(p, tareasP)*100);
                        const v = estadoVencimiento(p);
                        return (
                          <tr key={p.id} style={{borderBottom:"1px solid "+y.border}}>
                            <td style={{padding:"6px 8px",fontSize:12}}>{p.codigo}</td>
                            <td style={{padding:"6px 8px",fontSize:12}}>{p.categoria}</td>
                            <td style={{padding:"6px 8px",fontSize:12,fontWeight:600,maxWidth:260}}>{p.nombre}</td>
                            <td style={{padding:"6px 8px",fontSize:12}}>{p.area}</td>
                            <td style={{padding:"6px 8px",fontSize:12}}>{p.pais_id ? bandera(nombrePais(p.pais_id))+" "+nombrePais(p.pais_id) : ""}</td>
                            <td style={{padding:"6px 8px",fontSize:12}}>{p.responsable}</td>
                            <td style={{padding:"6px 8px",fontSize:11,color:y.text3}}>
                              {p.fecha_inicio}{p.fecha_fin ? " → "+p.fecha_fin : ""}
                              {v && (
                                <div style={{marginTop:2,fontSize:10,fontWeight:700,color: v.tipo==="vencido"?y.danger:y.warning}}>
                                  <i className={"ti "+(v.tipo==="vencido"?"ti-alert-triangle":"ti-bell")}/> {v.tipo==="vencido" ? "Vencido hace "+v.dias+"d" : "Vence en "+v.dias+"d"}
                                </div>
                              )}
                            </td>
                            <td style={{padding:"6px 8px",fontSize:12}}>{avancePct}%{tareasP.length > 0 && <div style={{fontSize:10,color:y.text3}}>{tareasP.filter(t=>t.completada).length}/{tareasP.length} tareas</div>}</td>
                            <td style={{padding:"6px 8px"}}><Badge label={p.estado || "Pendiente"} /></td>
                            <td style={{padding:"6px 8px",whiteSpace:"nowrap"}}>
                              {puedeEditar && <Btn sm onClick={() => setModal({mode:"edit", project:p})}><i className="ti ti-pencil"/></Btn>}{" "}
                              {puedeEliminar && <Btn sm danger onClick={() => setToDelete(p)}><i className="ti ti-trash"/></Btn>}
                              {!puedeEditar && !puedeEliminar && <span style={{fontSize:11,color:y.text3}}>—</span>}
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
            </Card>
          </React.Fragment>
        )}
      </div>

      {modal && (
        <ProjectModal
          paises={paises}
          session={session}
          editProject={modal.mode === "edit" ? modal.project : null}
          onClose={() => setModal(null)}
          onSaved={() => { setModal(null); cargarDatos(); }}
          onTareasChanged={cargarTareas}
        />
      )}
      {toDelete && (
        <ConfirmDelete
          nombre={toDelete.nombre}
          deleting={deleting}
          onConfirm={eliminar}
          onClose={() => setToDelete(null)}
        />
      )}
      {modalUsuarios && (
        <UsersModal
          session={session}
          onClose={() => setModalUsuarios(false)}
          onChanged={cargarPermisos}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
