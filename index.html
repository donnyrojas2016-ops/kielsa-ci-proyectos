/* ---------- Carga de trabajo ---------- */
// Nivel de carga según cuántas tareas activas (no completadas) tiene una persona
// en TODOS los proyectos a la vez. 1-2: Baja. 3-5: Media. 6+: Alta.
const CARGA_COLOR = {
  "Baja": [y.successBg, y.success],
  "Media": [y.warningBg, y.warning],
  "Alta": [y.dangerBg, y.danger]
};
function nivelCarga(activas) {
  if (activas <= 2) return "Baja";
  if (activas <= 5) return "Media";
  return "Alta";
}

// % de avance de una tarea individual: usa la columna nueva "porcentaje_avance" si existe;
// si la tarea es de antes de tener Cronograma, se deriva del check "completada" (100 o 0).
function avanceTarea(t) {
  if (t.porcentaje_avance !== null && t.porcentaje_avance !== undefined) return parseFloat(t.porcentaje_avance) || 0;
  return t.completada ? 100 : 0;
}

// Estatus que se muestra para una tarea: si ya se marcó "Completada" se respeta,
// si no, se revisa si ya se pasó de la fecha de entrega para marcarla "Vencida" sola,
// igual que ya hacemos con la fecha de vencimiento del proyecto.
function estatusEfectivoTarea(t) {
  const base = t.estatus || (t.completada ? "Completada" : "Pendiente");
  if (base === "Completada") return "Completada";
  if (!t.fecha_entrega) return base;
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const fin = new Date(t.fecha_entrega + "T00:00:00");
  if (!isNaN(fin.getTime()) && fin < hoy) return "Vencida";
  return base;
}

function duracionDias(inicio, entrega) {
  if (!inicio || !entrega) return null;
  const a = new Date(inicio + "T00:00:00");
  const b = new Date(entrega + "T00:00:00");
  if (isNaN(a.getTime()) || isNaN(b.getTime())) return null;
  return Math.round((b - a) / 86400000);
}

// Si el proyecto tiene tareas (Cronograma), el avance se calcula solo: promedio del % de avance de cada tarea.
// Si no tiene tareas todavía, se usa el % que la persona escribió a mano (compatibilidad con proyectos existentes).
function avanceEfectivo(proyecto, tareasDelProyecto) {
  if (tareasDelProyecto && tareasDelProyecto.length > 0) {
    const suma = tareasDelProyecto.reduce((s, t) => s + avanceTarea(t), 0);
    return (suma / tareasDelProyecto.length) / 100;
  }
  return parseFloat(proyecto.avance) || 0;
}

// Calcula si un proyecto está vencido o a punto de vencer según su fecha_fin real,
// sin depender de que alguien haya cambiado manualmente el campo "estado".
// Los proyectos ya Cumplidos o Cancelados no generan alerta.
function estadoVencimiento(p) {
  if (!p.fecha_fin) return null;
  if (p.estado === "Cumplido" || p.estado === "Cancelado") return null;
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const fin = new Date(p.fecha_fin + "T00:00:00");
  if (isNaN(fin.getTime())) return null;
  const dias = Math.round((fin - hoy) / 86400000);
  if (dias < 0) return { tipo: "vencido", dias: Math.abs(dias) };
  if (dias <= 7) return { tipo: "pronto", dias };
  return null;
}
function textoVencimiento(v) {
  if (v.tipo === "vencido") return "Vencido hace " + v.dias + (v.dias === 1 ? " día" : " días");
  if (v.dias === 0) return "Vence hoy";
  return "Vence en " + v.dias + (v.dias === 1 ? " día" : " días");
}

/* ---------- Componentes base ---------- */
function Badge({ label }) {
  const [bg, color] = ESTADO_COLOR[label] || [y.grayBg, y.gray];
  return <span style={{display:"inline-flex",alignItems:"center",padding:"3px 10px",borderRadius:20,fontSize:11,fontWeight:700,whiteSpace:"nowrap",background:bg,color}}>{label}</span>;
}

function Btn({ children, primary, danger, outline, sm, onClick, disabled, title, type }) {
  return (
    <button type={type||"button"} onClick={onClick} disabled={disabled} title={title} style={{
      display:"inline-flex",alignItems:"center",gap:6,
      padding: sm ? "0.25rem 0.6rem" : "0.42rem 0.9rem",
      fontSize: sm ? 11 : 13, fontWeight:600,
      border: primary ? "1px solid "+y.primary : danger ? "none" : "1px solid "+y.border2,

/* ---------- Login ---------- */
function Login({ onLogin }) {
  const [usuario, setUsuario] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState(false);
  const [loading, setLoading] = useState(false);

  const submit = async () => {
    setLoading(true); setError(false);
    try {
      // Antes esto traía TODOS los usuarios (con su contraseña en texto) en una sola llamada,
      // sin importar quién la hiciera ni si el usuario/clave eran correctos. Filtrar por el
      // usuario que se está escribiendo hace que solo viaje por la red esa una fila, no la
      // contraseña de todos los demás.
      const { data, error: err } = await supabase.from("usuarios").select("*").eq("usuario", usuario);
      if (err) throw err;
      const found = (data || []).find(u => u.usuario === usuario && u.password === password && u.estado === "Activo");
      if (found) {
        onLogin({ id: found.id, usuario: found.usuario, nombre: found.nombre || found.usuario });
      } else {
        setError(true);
        setPassword("");
      }
    } catch (e) {
      console.error(e);
      alert("No se pudo validar el usuario. Intenta de nuevo.");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#0f1e5c,#1e4db7 50%,#3b82f6)"}}>
      <style>{"@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}"}</style>
      <div style={{background:"#fff",borderRadius:20,padding:"2.5rem 2.25rem",width:400,boxShadow:"0 24px 80px rgba(0,0,0,.3)",animation:"fadeIn .4s ease"}}>
        <div style={{textAlign:"center",marginBottom:"1.75rem"}}>
          <div style={{marginBottom:12,display:"flex",justifyContent:"center"}}>
            <img src={KIELSA_LOGO} alt="Kielsa" style={{height:52,objectFit:"contain"}} />
          </div>
          <div style={{fontSize:20,fontWeight:800,color:y.text}}>Kielsa CI — Proyectos</div>
          <div style={{fontSize:12,color:y.text3,marginTop:4}}>Ingresa con tu usuario de Kielsa CI</div>
        </div>
        {error && <div style={{background:y.dangerBg,color:y.danger,borderRadius:9,padding:"0.6rem 0.9rem",fontSize:12,marginBottom:16,display:"flex",gap:7,alignItems:"center"}}><i className="ti ti-alert-circle"/>Usuario y clave incorrectas</div>}
        <form onSubmit={e => { e.preventDefault(); if(!loading) submit(); }}>
          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontSize:11,fontWeight:700,color:y.text2,marginBottom:6,textTransform:"uppercase",letterSpacing:"0.04em"}}>Usuario</label>
            <input name="username" autoComplete="username" value={usuario} onChange={e => setUsuario(e.target.value)} placeholder="tu.usuario" style={{...inputStyle,fontSize:14,padding:"0.55rem 0.8rem"}} />
          </div>
          <div style={{marginBottom:20}}>
            <label style={{display:"block",fontSize:11,fontWeight:700,color:y.text2,marginBottom:6,textTransform:"uppercase",letterSpacing:"0.04em"}}>Contraseña</label>
            <input name="password" type="password" autoComplete="current-password" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" style={{...inputStyle,fontSize:14,padding:"0.55rem 0.8rem"}} />
          </div>
          <button type="submit" disabled={loading} style={{width:"100%",padding:"0.7rem",background:"linear-gradient(135deg,"+y.primary+",#3b82f6)",color:"#fff",border:"none",borderRadius:10,fontSize:14,fontWeight:700,cursor:loading?"not-allowed":"pointer",opacity:loading?0.7:1,fontFamily:"inherit"}}>
            {loading ? "Verificando..." : "Entrar →"}
          </button>
        </form>
        <div style={{textAlign:"center",marginTop:18,fontSize:10.5,color:y.text3}}>Desarrollado por Donny Rojas</div>
      </div>
    </div>
  );
}

/* ---------- Formulario de una tarea del Cronograma (agregar o editar) ---------- */
function TareaForm({ tarea, tareasProyecto, responsables, responsablesDisponibles, onGuardar, onCancelar }) {
  const [titulo, setTitulo] = useState(tarea ? tarea.titulo || "" : "");
  const [responsable, setResponsable] = useState(tarea ? tarea.responsable || "" : "");
  const [dependeId, setDependeId] = useState(tarea && tarea.depende_id ? String(tarea.depende_id) : "");
  const [fechaInicio, setFechaInicio] = useState(tarea ? tarea.fecha_inicio || "" : "");
  const [fechaEntrega, setFechaEntrega] = useState(tarea ? tarea.fecha_entrega || "" : "");
  const [avance, setAvance] = useState(tarea ? avanceTarea(tarea) : 0);
  const [estatus, setEstatus] = useState(tarea ? (tarea.estatus || (tarea.completada ? "Completada" : "Pendiente")) : "Pendiente");

  const opcionesDependencia = tareasProyecto.filter(t => !tarea || t.id !== tarea.id);

  const guardar = () => {
    if (!titulo.trim()) { alert("El nombre de la tarea es obligatorio."); return; }
    onGuardar({
      titulo: titulo.trim(),
      responsable: responsable || null,
      depende_id: dependeId ? parseInt(dependeId) : null,
      fecha_inicio: fechaInicio || null,
      fecha_entrega: fechaEntrega || null,
      porcentaje_avance: parseInt(avance) || 0,
      estatus,
      completada: estatus === "Completada"
    });
  };

  return (
    <div style={{background:y.primaryLight,border:"1px solid #c7d2fe",borderRadius:10,padding:"0.9rem 1rem",marginBottom:12}}>
      <div style={{marginBottom:10}}>
        <label style={{...labelStyle,color:y.primary}}>Nombre de la tarea *</label>
        <input autoFocus value={titulo} onChange={e => setTitulo(e.target.value)} placeholder="Ej: Descarga de activos fijos de la contabilidad" style={{...inputStyle,fontSize:12.5}} />
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        <div>
          <label style={{...labelStyle,color:y.primary}}>Responsable de la tarea</label>
          {responsablesDisponibles && responsables && responsables.length > 0 ? (
            <select value={responsable} onChange={e => setResponsable(e.target.value)} style={{...inputStyle,fontSize:12.5}}>
              <option value="">—</option>
              {responsable && !responsables.some(r => r.nombre === responsable) && <option value={responsable}>{responsable}</option>}
              {responsables.map(r => <option key={r.id} value={r.nombre}>{r.nombre}</option>)}
            </select>
          ) : (
            <input value={responsable} onChange={e => setResponsable(e.target.value)} style={{...inputStyle,fontSize:12.5}} />
          )}
        </div>
        <div>
          <label style={{...labelStyle,color:y.primary}}>Depende de</label>
          <select value={dependeId} onChange={e => setDependeId(e.target.value)} style={{...inputStyle,fontSize:12.5}}>
            <option value="">— Ninguna —</option>
            {opcionesDependencia.map((t, i) => (
              <option key={t.id} value={t.id}>EDT {tareasProyecto.indexOf(t) + 1} — {t.titulo.substring(0,30)}</option>
            ))}
          </select>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
        <div>
          <label style={{...labelStyle,color:y.primary}}>Fecha de inicio</label>
          <input type="date" value={fechaInicio} onChange={e => setFechaInicio(e.target.value)} style={{...inputStyle,fontSize:12.5}} />
        </div>
        <div>
          <label style={{...labelStyle,color:y.primary}}>Fecha de entrega</label>
          <input type="date" value={fechaEntrega} onChange={e => setFechaEntrega(e.target.value)} style={{...inputStyle,fontSize:12.5}} />
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
        <div>
          <label style={{...labelStyle,color:y.primary}}>% de avance</label>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <input type="range" min={0} max={100} value={avance} onChange={e => setAvance(parseInt(e.target.value))} style={{flex:1}} />
            <span style={{fontSize:12,fontWeight:700,color:y.primary,minWidth:32}}>{avance}%</span>
          </div>
        </div>
        <div>
          <label style={{...labelStyle,color:y.primary}}>Estatus</label>
          <select value={estatus} onChange={e => { setEstatus(e.target.value); if (e.target.value === "Completada") setAvance(100); }} style={{...inputStyle,fontSize:12.5}}>
            {TAREA_ESTADOS.map(s => <option key={s}>{s}</option>)}
          </select>
        </div>
      </div>

      <div style={{display:"flex",justifyContent:"flex-end",gap:8}}>
        <Btn sm onClick={onCancelar}>Cancelar</Btn>
        <Btn sm primary onClick={guardar}>{tarea ? "Guardar cambios" : "Agregar tarea"}</Btn>
      </div>
    </div>
  );
}

/* ---------- Plan de acción (Cronograma) del proyecto seleccionado ---------- */
function PlanAccionPanel({ proyecto, tareasProyecto, responsables, responsablesDisponibles, puedeEditar, onTareasChanged, onClose }) {
  const [cargando, setCargando] = useState(false);
  const [tareaForm, setTareaForm] = useState(null); // null | {mode:"add"} | {mode:"edit", tarea}

  const avancePctTareas = tareasProyecto.length ? Math.round(tareasProyecto.reduce((s,t) => s + avanceTarea(t), 0) / tareasProyecto.length) : 0;

  const guardarTarea = async (payload) => {
    setCargando(true);
    try {
      if (tareaForm && tareaForm.mode === "edit") {
        const { error } = await supabase.from("proyecto_tareas").update(payload).eq("id", tareaForm.tarea.id);
        if (error) throw error;
      } else {
        const { error } = await supabase.from("proyecto_tareas").insert({ proyectoId: proyecto.id, ...payload });
        if (error) throw error;
      }
      setTareaForm(null);
      await onTareasChanged();
    } catch (e) {
      alert("No se pudo guardar la tarea: " + (e.message || e) + (/column/i.test(e.message||"") ? "\n\n(Puede que falte correr el SQL del Cronograma en Supabase — ver README.)" : ""));
    } finally {
      setCargando(false);
    }
  };

  const eliminarTarea = async (tarea) => {
    if (!window.confirm('¿Eliminar la tarea "' + tarea.titulo + '"?')) return;
    setCargando(true);
    try {
      const { error } = await supabase.from("proyecto_tareas").delete().eq("id", tarea.id);
      if (error) throw error;
      await onTareasChanged();
    } catch (e) {
      alert("No se pudo eliminar la tarea: " + (e.message || e));
    } finally {
      setCargando(false);
    }
  };

  const nombreArchivoBase = (proyecto.codigo || proyecto.nombre || "proyecto").toString().replace(/[^\w\-]+/g,"_").substring(0,40);

  const exportarPlanExcel = () => {
    const filas = [
      ["Proyecto", proyecto.nombre || ""],
      ["Código", proyecto.codigo || ""],
      []
    ];
    filas.push(["EDT","Tarea","Responsable","Inicio","Entrega","% Avance","Estatus"]);
    tareasProyecto.forEach((t,i) => filas.push([i+1, t.titulo, t.responsable||"", t.fecha_inicio||"", t.fecha_entrega||"", avanceTarea(t), estatusEfectivoTarea(t)]));
    const ws = XLSX.utils.aoa_to_sheet(filas);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Cronograma");
    XLSX.writeFile(wb, "Cronograma_" + nombreArchivoBase + ".xlsx");
  };

  const exportarPlanPDF = () => {
    const doc = new window.jspdf.jsPDF({ orientation: "landscape" });
    doc.setFontSize(14);
    doc.text(proyecto.nombre || "Plan de acción", 14, 15);
    doc.setFontSize(9);
    doc.setTextColor(120);
    doc.text("Generado el " + new Date().toLocaleDateString("es-HN") + " · " + tareasProyecto.length + " tarea(s) · Avance general " + avancePctTareas + "%", 14, 21);
    const filas = tareasProyecto.map((t,i) => [i+1, t.titulo, t.responsable||"", t.fecha_inicio||"", t.fecha_entrega||"", avanceTarea(t)+"%", estatusEfectivoTarea(t)]);
    doc.autoTable({
      head: [["EDT","Tarea","Responsable","Inicio","Entrega","Avance","Estatus"]],
      body: filas,
      startY: 26,
      styles: { fontSize: 8, cellPadding: 2 },
      headStyles: { fillColor: [30, 77, 183] },
      margin: { left: 14, right: 14 }
    });
    doc.save("Plan_" + nombreArchivoBase + ".pdf");
  };

  return (
    <Card>
      <CardHeader
        icon="ti-list-check"
        left={"Plan de acción — " + (proyecto.nombre || "")}
        right={
          <React.Fragment>
            <Btn sm onClick={exportarPlanExcel}><i className="ti ti-file-spreadsheet"/> Excel</Btn>
            <Btn sm onClick={exportarPlanPDF}><i className="ti ti-file-type-pdf"/> PDF</Btn>
            {onClose && <Btn sm onClick={onClose}><i className="ti ti-x"/> Cerrar</Btn>}
          </React.Fragment>
        }
      />
      <div style={{padding:"1rem 1.1rem"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12,gap:8,flexWrap:"wrap"}}>
          <span style={{fontSize:12.5,fontWeight:700,color:y.text}}>{tareasProyecto.length} {tareasProyecto.length===1?"tarea":"tareas"}</span>
          {puedeEditar && !tareaForm && (
            <Btn sm primary onClick={() => setTareaForm({mode:"add"})}><i className="ti ti-plus"/> Agregar tarea</Btn>
          )}
        </div>

        {tareaForm && (
          <TareaForm
            tarea={tareaForm.mode === "edit" ? tareaForm.tarea : null}
            tareasProyecto={tareasProyecto}
            responsables={responsables}
            responsablesDisponibles={responsablesDisponibles}
            onGuardar={guardarTarea}
            onCancelar={() => setTareaForm(null)}
          />
        )}

        {tareasProyecto.length === 0 ? (
          <div style={{fontSize:12,color:y.text3,padding:"1rem 0"}}>Sin tareas todavía{puedeEditar ? " — agrega la primera con el botón de arriba." : "."}</div>
        ) : (
          <React.Fragment>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
              <thead>
                <tr style={{background:y.grayBg}}>
                  {["EDT","Tarea","Responsable","Depende de","Inicio","Entrega","Días","% Avance","Estatus",""].map(h => (
                    <th key={h} style={{textAlign:"left",fontSize:10,fontWeight:800,color:y.text3,textTransform:"uppercase",letterSpacing:.3,padding:"0.5rem 0.5rem",borderBottom:"1px solid "+y.border,whiteSpace:"nowrap"}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {tareasProyecto.map((t, i) => {
                  const est = estatusEfectivoTarea(t);
                  const [estBg, estColor] = TAREA_ESTADO_COLOR[est] || [y.grayBg, y.gray];
                  const dias = duracionDias(t.fecha_inicio, t.fecha_entrega);
                  const dep = t.depende_id ? tareasProyecto.findIndex(x => x.id === t.depende_id) : -1;
                  const pct = avanceTarea(t);
                  return (
                    <tr key={t.id} style={{borderBottom:"1px solid "+y.grayBg}}>
                      <td style={{padding:"0.5rem",fontWeight:800,color:y.text3,fontSize:11}}>{i+1}</td>
                      <td style={{padding:"0.5rem",color:y.text,maxWidth:220}}>{t.titulo}</td>
                      <td style={{padding:"0.5rem",color:y.text2,whiteSpace:"nowrap"}}>{t.responsable || "—"}</td>
                      <td style={{padding:"0.5rem",color:y.text3,whiteSpace:"nowrap"}}>{dep >= 0 ? "EDT " + (dep+1) : "—"}</td>
                      <td style={{padding:"0.5rem",color:y.text2,whiteSpace:"nowrap"}}>{t.fecha_inicio || "—"}</td>
                      <td style={{padding:"0.5rem",color:y.text2,whiteSpace:"nowrap"}}>{t.fecha_entrega || "—"}</td>
                      <td style={{padding:"0.5rem",color:y.text2}}>{dias!=null ? dias : "—"}</td>
                      <td style={{padding:"0.5rem",whiteSpace:"nowrap"}}>
                        <span style={{display:"inline-block",width:44,height:6,borderRadius:20,background:y.border,position:"relative",marginRight:6,verticalAlign:"middle"}}>
                          <span style={{position:"absolute",left:0,top:0,bottom:0,borderRadius:20,background:y.primary,width:pct+"%"}}/>
                        </span>
                        {pct}%
                      </td>
                      <td style={{padding:"0.5rem"}}>
                        <span style={{display:"inline-flex",padding:"3px 9px",borderRadius:20,fontSize:10.5,fontWeight:700,background:estBg,color:estColor,whiteSpace:"nowrap"}}>{est}</span>
                      </td>
                      <td style={{padding:"0.5rem",textAlign:"right",whiteSpace:"nowrap"}}>
                        {puedeEditar && (
                          <React.Fragment>
                            <button onClick={() => setTareaForm({mode:"edit", tarea:t})} style={{background:"none",border:"none",color:y.text3,cursor:"pointer",padding:3}} title="Editar"><i className="ti ti-pencil" style={{fontSize:13}}/></button>
                            <button onClick={() => eliminarTarea(t)} style={{background:"none",border:"none",color:y.text3,cursor:"pointer",padding:3}} title="Eliminar"><i className="ti ti-trash" style={{fontSize:13}}/></button>
                          </React.Fragment>
                        )}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
          </React.Fragment>
        )}

        {tareasProyecto.length > 0 && (
          <div style={{background:y.primaryLight,borderRadius:10,padding:"0.75rem 1rem",marginTop:14,display:"flex",alignItems:"center",gap:12,fontSize:12.5,color:y.text2}}>
            <i className="ti ti-chart-bar" style={{color:y.primary}}/>
            Avance general del proyecto (promedio de {tareasProyecto.length} {tareasProyecto.length===1?"tarea":"tareas"}):
            <strong style={{color:y.primary}}>{avancePctTareas}%</strong>
          </div>
        )}
      </div>
    </Card>
  );
}

function ProjectModal({ paises, session, areasCatalogo, areasDisponibles, responsables, responsablesDisponibles, editProject, tareasProyecto = [], onTareasChanged, puedeEditar = true, onClose, onSaved }) {
  const [drafts, setDrafts] = useState(() => editProject ? [{ ...editProject }] : [nuevoProyecto()]);
  const [saving, setSaving] = useState(false);
  const [tab, setTab] = useState("datos"); // datos | comentarios (solo aplica en modo edición)

  // ---- Plan de trabajo capturado al crear proyecto(s) nuevo(s) (solo aplica en modo "agregar") ----
  // Se guarda en memoria por cada borrador (clave d._key) hasta que se guarde el proyecto;
  // en ese momento se crea de verdad en proyecto_tareas con el id real del proyecto recién creado.
  const [draftTareas, setDraftTareas] = useState({}); // { [d._key]: [{id: localId, titulo, ...}] }
  const [tareaFormDraft, setTareaFormDraft] = useState(null); // null | {mode:"add", key} | {mode:"edit", key, tarea}
  // Fila del formulario de tabla cuyo Plan de trabajo está desplegado (solo modo "agregar" con varios proyectos).
  const [planAbiertoKey, setPlanAbiertoKey] = useState(() => !editProject && drafts[0] ? drafts[0]._key : null);

  const guardarTareaDraft = (payload) => {
    const key = tareaFormDraft && tareaFormDraft.key;
    if (!key) return;
    setDraftTareas(map => {
      const lista = map[key] || [];
      let nueva;
      if (tareaFormDraft.mode === "edit") {
        nueva = lista.map(t => t.id === tareaFormDraft.tarea.id ? { ...t, ...payload } : t);
      } else {
        nueva = [...lista, { id: "local_" + Date.now() + "_" + Math.random(), ...payload }];
      }
      return { ...map, [key]: nueva };
    });
    setTareaFormDraft(null);
  };
  const eliminarTareaDraft = (key, tarea) => {
    setDraftTareas(map => ({ ...map, [key]: (map[key] || []).filter(t => t.id !== tarea.id) }));
  };

  // ---- Comentarios / bitácora del proyecto (solo aplica en modo edición) ----
  const [comentarios, setComentarios] = useState([]);
  const [cargandoComentarios, setCargandoComentarios] = useState(false);
  const [comentariosDisponibles, setComentariosDisponibles] = useState(true);
  const [nuevoComentario, setNuevoComentario] = useState("");
  const [enviandoComentario, setEnviandoComentario] = useState(false);

  useEffect(() => {
    if (!editProject) return;
    (async () => {
      setCargandoComentarios(true);
      try {
        const { data, error } = await supabase.from("proyecto_comentarios").select("*").eq("proyectoId", editProject.id).order("id");
        if (error) throw error;
        setComentarios(data || []);
        setComentariosDisponibles(true);
      } catch (e) {
        console.warn("Tabla proyecto_comentarios no disponible:", e.message || e);
        setComentariosDisponibles(false);
      } finally {
        setCargandoComentarios(false);
      }
    })();
  }, [editProject]);

  const agregarComentario = async () => {
    const texto = nuevoComentario.trim();
    if (!texto || !editProject) return;
    setEnviandoComentario(true);
    try {
      const autor = (session && session.nombre) || "Usuario";
      const { data, error } = await supabase.from("proyecto_comentarios").insert({ proyectoId: editProject.id, autor, texto }).select();
      if (error) throw error;
      setComentarios(list => [...list, ...(data || [])]);
      setNuevoComentario("");
    } catch (e) {
      alert("No se pudo agregar el comentario: " + (e.message || e));
    } finally {
      setEnviandoComentario(false);
    }
  };

  const eliminarComentario = async (comentario) => {
    setComentarios(list => list.filter(c => c.id !== comentario.id));
    try {
      const { error } = await supabase.from("proyecto_comentarios").delete().eq("id", comentario.id);
      if (error) throw error;
    } catch (e) {
      alert("No se pudo eliminar el comentario: " + (e.message || e));
      setComentarios(list => [...list, comentario]);
    }
  };

  const formatearFecha = iso => {
    if (!iso) return "";
    try {
      const d = new Date(iso);
      return d.toLocaleString("es-HN", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
    } catch (e) { return iso; }
  };

  const updateField = (idx, key, value) => setDrafts(list => list.map((d, i) => i === idx ? { ...d, [key]: value } : d));
  const addDraft = () => {
    const nuevo = nuevoProyecto();
    setDrafts(list => [...list, nuevo]);
    setPlanAbiertoKey(nuevo._key);
  };
  const removeDraft = idx => {
    const removido = drafts[idx];
    if (removido && planAbiertoKey === removido._key) setPlanAbiertoKey(null);
    setDrafts(list => list.filter((_, i) => i !== idx));
  };

  const normalize = d => {
    const { _key, id, ...rest } = d;
    return {
      ...rest,
      pais_id: rest.pais_id ? parseInt(rest.pais_id) : null,
      prioridad: parseInt(rest.prioridad) || 3,
      avance: parseFloat(rest.avance) || 0,
      actualizado_en: new Date().toISOString(),
      actualizado_por: (session && session.nombre) || "Usuario"
    };
  };

  const save = async () => {
    try {
      if (editProject) {
        const d = drafts[0];
        if (!d.nombre.trim()) { alert("El nombre del proyecto es obligatorio"); return; }
        setSaving(true);
        const payload = normalize(d);
        const { error } = await supabase.from("proyectos").update(payload).eq("id", editProject.id);
        if (error) throw error;
      } else {
        const listos = drafts.filter(d => d.nombre.trim());
        if (!listos.length) { alert("Agrega al menos un proyecto con nombre"); return; }
        setSaving(true);
        for (const d of listos) {
          const payload = normalize(d);
          const { data, error } = await supabase.from("proyectos").insert(payload).select();
          if (error) throw error;
          const nuevoId = data && data[0] && data[0].id;
          const tareasDelDraft = draftTareas[d._key] || [];
          if (nuevoId && tareasDelDraft.length) {
            try {
              const filas = tareasDelDraft.map(t => {
                const { id, depende_id, ...resto } = t;
                return { proyectoId: nuevoId, ...resto };
              });
              const { data: insertadas, error: errT } = await supabase.from("proyecto_tareas").insert(filas).select();
              if (errT) throw errT;
              // Segunda pasada: ahora que ya existen ids reales, resolver las dependencias
              // entre tareas del mismo plan (que antes apuntaban al id temporal en memoria).
              const mapaIds = {};
              tareasDelDraft.forEach((t, i) => { if (insertadas[i]) mapaIds[t.id] = insertadas[i].id; });
              for (let i = 0; i < tareasDelDraft.length; i++) {
                const original = tareasDelDraft[i];
                if (original.depende_id && mapaIds[original.depende_id] && insertadas[i]) {
                  await supabase.from("proyecto_tareas").update({ depende_id: mapaIds[original.depende_id] }).eq("id", insertadas[i].id);
                }
              }
            } catch (eT) {
              console.warn("El proyecto se creó, pero no se pudo guardar su plan de trabajo:", eT.message || eT);
              alert("El proyecto se creó, pero no se pudo guardar el plan de trabajo: " + (eT.message || eT));
            }
          }
        }
      }
      onSaved();
    } catch (e) {
      console.error(e);
      alert("No se pudo guardar: " + (e.message || e) + (/column/i.test(e.message||"") ? "\n\n(Puede que falte correr el SQL nuevo en Supabase — ver README.)" : ""));
    } finally {
      setSaving(false);
    }
  };

  const conNombre = drafts.filter(d => d.nombre.trim()).length;

  // Estilos de la lista "Campo / Valor": una fila por dato, etiqueta a la izquierda y su campo editable a la derecha.
  const fvCampoStyle = { padding:"0.75rem 1rem", fontSize:11, fontWeight:800, color:y.text3, textTransform:"uppercase", letterSpacing:.3, whiteSpace:"nowrap", width:190, verticalAlign:"middle" };
  const fvValorStyle = { padding:"0.55rem 1rem", verticalAlign:"middle" };
  const inputTabla = { width:"100%", padding:"0.5rem 0.7rem", fontSize:13, border:"1px solid "+y.border2, borderRadius:8, background:y.surface, color:y.text, outline:"none", fontFamily:"inherit", boxSizing:"border-box", lineHeight:1.4 };

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,.6)",zIndex:500,display:"flex",flexDirection:"column"}} onClick={e => e.target === e.currentTarget && onClose()}>
      <div style={{background:y.surface,display:"flex",flexDirection:"column",height:"100vh",maxHeight:"100vh"}}>

        <div style={{background:"linear-gradient(135deg,#1e4db7,#2563eb)",padding:"0.85rem 1.25rem",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <i className="ti ti-briefcase" style={{fontSize:18,color:"#fff"}}/>
            <strong style={{fontSize:15,color:"#fff"}}>{editProject ? "Editar proyecto" : "Agregar proyectos"}</strong>
            {!editProject && <span style={{fontSize:12,color:"rgba(255,255,255,.6)",marginLeft:4}}>{conNombre} con nombre</span>}
          </div>
          <div style={{display:"flex",gap:8}}>
            {!editProject && <Btn onClick={addDraft}><i className="ti ti-plus"/> Agregar proyecto</Btn>}
            <Btn primary disabled={saving} onClick={save}><i className="ti ti-check"/> {saving ? "Guardando..." : editProject ? "Guardar cambios" : "Guardar " + conNombre + " proyecto(s)"}</Btn>
            <button onClick={onClose} style={{background:"rgba(255,255,255,.15)",border:"none",borderRadius:6,color:"#fff",padding:"4px 10px",cursor:"pointer",fontSize:13}}>✕</button>
          </div>
        </div>

        {editProject && (
          <div style={{display:"flex",gap:22,padding:"0 1.25rem",background:y.grayBg,borderBottom:"1px solid "+y.border,flexShrink:0}}>
            {[
              { key:"datos", label:"Datos del proyecto", icon:"ti-file-text" },
              { key:"comentarios", label:"Comentarios", icon:"ti-message-circle", count: comentarios.length }
            ].map(t => (
              <div key={t.key} onClick={() => setTab(t.key)} style={{
                padding:"0.7rem 0.1rem",cursor:"pointer",fontSize:13,fontWeight:700,
                color: tab === t.key ? y.primary : y.text3,
                borderBottom: tab === t.key ? "2px solid "+y.primary : "2px solid transparent",
                display:"flex",alignItems:"center",gap:6,whiteSpace:"nowrap"
              }}>
                <i className={"ti "+t.icon} style={{fontSize:14}}/>
                {t.label}
                {t.count > 0 && <span style={{background:y.primaryLight,color:y.primary,fontSize:10.5,fontWeight:800,padding:"1px 7px",borderRadius:20}}>{t.count}</span>}
              </div>
            ))}
          </div>
        )}

        <div style={{flex:1,overflowY:"auto",padding:"1.25rem"}}>

        {(!editProject || tab === "datos") && (
          <React.Fragment>
            <SectionTitle first>{editProject ? "Datos del proyecto" : "Datos de los proyectos"}</SectionTitle>

            {drafts.map((d, i) => {
              const tareasFila = draftTareas[d._key] || [];
              const abierto = planAbiertoKey === d._key;
              return (
                <div key={d._key || d.id || i} style={{border:"1px solid "+y.border,borderRadius:12,boxShadow:"0 1px 3px rgba(0,0,0,.05)",marginBottom: i === drafts.length - 1 ? 0 : 16,overflow:"hidden"}}>
                  {!editProject && drafts.length > 1 && (
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0.6rem 1rem",background:y.grayBg,borderBottom:"1px solid "+y.border}}>
                      <span style={{fontSize:12,fontWeight:800,color:y.primary}}>{d.nombre.trim() || "Proyecto " + (i + 1)}</span>
                      <button onClick={() => removeDraft(i)} title="Quitar este proyecto" style={{background:"none",border:"none",color:y.text3,cursor:"pointer",fontSize:12,fontWeight:700,display:"flex",alignItems:"center",gap:4}}><i className="ti ti-trash" style={{fontSize:13}}/> Quitar</button>
                    </div>
                  )}
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                    <tbody>
                      <tr style={{borderBottom:"1px solid "+y.border}}>
                        <td style={fvCampoStyle}>País</td>
                        <td style={fvValorStyle}>
                          <select value={d.pais_id} onChange={e => updateField(i,"pais_id",e.target.value)} style={inputTabla}>
                            <option value="">—</option>
                            {paises.map(p => <option key={p.id} value={p.id}>{bandera(p.nombre)} {p.nombre}</option>)}
                          </select>
                        </td>
                      </tr>
                      <tr style={{borderBottom:"1px solid "+y.border,background:y.grayBg}}>
                        <td style={fvCampoStyle}>Categoría</td>
                        <td style={fvValorStyle}>
                          <select value={d.categoria} onChange={e => updateField(i,"categoria",e.target.value)} style={inputTabla}>
                            {CATEGORIAS.map(c => <option key={c}>{c}</option>)}
                          </select>
                        </td>
                      </tr>
                      <tr style={{borderBottom:"1px solid "+y.border}}>
                        <td style={fvCampoStyle}>Prioridad</td>
                        <td style={fvValorStyle}>
                          <select value={d.prioridad} onChange={e => updateField(i,"prioridad",e.target.value)} style={inputTabla}>
                            <option value={1}>Alta</option>
                            <option value={2}>Media</option>
                            <option value={3}>Normal</option>
                          </select>
                        </td>
                      </tr>
                      <tr style={{borderBottom:"1px solid "+y.border,background:y.grayBg}}>
                        <td style={fvCampoStyle}>Código</td>
                        <td style={fvValorStyle}>
                          <input value={d.codigo} onChange={e => updateField(i,"codigo",e.target.value)} style={inputTabla} />
                        </td>
                      </tr>
                      <tr style={{borderBottom:"1px solid "+y.border}}>
                        <td style={fvCampoStyle}>Nombre del proyecto *</td>
                        <td style={fvValorStyle}>
                          <input value={d.nombre} onChange={e => updateField(i,"nombre",e.target.value)} placeholder="Ej: Automatización de conciliaciones..." style={{...inputTabla,fontWeight:600}} />
                        </td>
                      </tr>
                      <tr style={{borderBottom:"1px solid "+y.border,background:y.grayBg}}>
                        <td style={fvCampoStyle}>Descripción</td>
                        <td style={fvValorStyle}>
                          <textarea value={d.observacion} onChange={e => updateField(i,"observacion",e.target.value)} placeholder="Qué se va a hacer, notas..." rows={2} style={{...inputTabla,lineHeight:1.5,resize:"vertical"}} />
                        </td>
                      </tr>
                      <tr style={{borderBottom:"1px solid "+y.border}}>
                        <td style={fvCampoStyle}>Ticket</td>
                        <td style={fvValorStyle}>
                          <input value={d.ticket} onChange={e => updateField(i,"ticket",e.target.value)} style={inputTabla} />
                        </td>
                      </tr>
                      <tr style={{borderBottom:"1px solid "+y.border,background:y.grayBg}}>
                        <td style={fvCampoStyle}>Responsable</td>
                        <td style={fvValorStyle}>
                          {responsablesDisponibles && responsables && responsables.length > 0 ? (
                            <select value={d.responsable || ""} onChange={e => updateField(i,"responsable",e.target.value)} style={inputTabla}>
                              <option value="">—</option>
                              {d.responsable && !responsables.some(r => r.nombre === d.responsable) && (
                                <option value={d.responsable}>{d.responsable}</option>
                              )}
                              {responsables.map(r => <option key={r.id} value={r.nombre}>{r.nombre}</option>)}
                            </select>
                          ) : (
                            <input value={d.responsable} onChange={e => updateField(i,"responsable",e.target.value)} style={inputTabla} />
                          )}
                        </td>
                      </tr>
                      <tr style={{borderBottom:"1px solid "+y.border}}>
                        <td style={fvCampoStyle}>Área</td>
                        <td style={fvValorStyle}>
                          <select value={d.area} onChange={e => updateField(i,"area",e.target.value)} style={inputTabla}>
                            <option value="">—</option>
                            {(areasDisponibles && areasCatalogo && areasCatalogo.length > 0 ? areasCatalogo.map(a => a.nombre) : AREAS).map(a => <option key={a}>{a}</option>)}
                          </select>
                        </td>
                      </tr>
                      <tr style={{borderBottom:"1px solid "+y.border,background:y.grayBg}}>
                        <td style={fvCampoStyle}>Estado</td>
                        <td style={fvValorStyle}>
                          <select value={d.estado} onChange={e => updateField(i,"estado",e.target.value)} style={inputTabla}>
                            {ESTADOS.map(s => <option key={s}>{s}</option>)}
                          </select>
                        </td>
                      </tr>
                      <tr style={{borderBottom:"1px solid "+y.border}}>
                        <td style={fvCampoStyle}>Avance{editProject ? " (calculado)" : ""}</td>
                        <td style={fvValorStyle}>
                          <div style={{display:"flex",alignItems:"center",gap:8}}>
                            <input type="range" min={0} max={100} value={Math.round((d.avance||0)*100) <= 100 ? Math.round((d.avance||0)*100) : d.avance||0} onChange={e => updateField(i,"avance",parseInt(e.target.value)/100)} style={{maxWidth:260}} />
                            <span style={{fontSize:12.5,fontWeight:700,color:y.primary,minWidth:34}}>{Math.round((d.avance||0)*100)}%</span>
                          </div>
                        </td>
                      </tr>
                      <tr style={{borderBottom:"1px solid "+y.border,background:y.grayBg}}>
                        <td style={fvCampoStyle}>Fecha de solicitud</td>
                        <td style={fvValorStyle}>
                          <input type="date" value={d.fecha_solicitud||""} onChange={e => updateField(i,"fecha_solicitud",e.target.value)} style={{...inputTabla,maxWidth:220}} />
                        </td>
                      </tr>
                      <tr style={{borderBottom:"1px solid "+y.border}}>
                        <td style={fvCampoStyle}>Fecha de inicio</td>
                        <td style={fvValorStyle}>
                          <input type="date" value={d.fecha_inicio} onChange={e => updateField(i,"fecha_inicio",e.target.value)} style={{...inputTabla,maxWidth:220}} />
                        </td>
                      </tr>
                      <tr style={{borderBottom:"1px solid "+y.border,background:y.grayBg}}>
                        <td style={fvCampoStyle}>Vencimiento</td>
                        <td style={fvValorStyle}>
                          <input type="date" value={d.fecha_fin} onChange={e => updateField(i,"fecha_fin",e.target.value)} style={{...inputTabla,maxWidth:220}} />
                        </td>
                      </tr>
                      <tr>
                        <td style={fvCampoStyle}>Archivo / documento</td>
                        <td style={fvValorStyle}>
                          <input value={d.archivo_nombre||""} onChange={e => updateField(i,"archivo_nombre",e.target.value)} placeholder="Nombre o enlace del archivo" style={inputTabla} />
                        </td>
                      </tr>
                    </tbody>
                  </table>

                  {editProject && (
                    <div style={{fontSize:11,color:y.text3,padding:"0.7rem 1rem",borderTop:"1px solid "+y.border,background:y.grayBg}}>Si el proyecto tiene Plan de acción (abajo), el Avance se calcula solo a partir de las tareas.</div>
                  )}

                  {!editProject && (
                    <div style={{borderTop:"1px solid "+y.border,padding:"0.75rem 1rem",background:y.grayBg}}>
                      <Btn sm onClick={() => setPlanAbiertoKey(k => k === d._key ? null : d._key)}>
                        <i className="ti ti-list-check"/> Plan de trabajo — {tareasFila.length} tarea{tareasFila.length === 1 ? "" : "s"}
                        <i className={"ti " + (abierto ? "ti-chevron-up" : "ti-chevron-down")} style={{marginLeft:2}}/>
                      </Btn>

                      {abierto && (
                        <div style={{marginTop:12}}>
                          <div style={{fontSize:11.5,color:y.text3,marginBottom:10}}>
                            Se guarda junto con este proyecto al hacer clic en "Guardar". También puedes dejarlo vacío por ahora y agregar las tareas después, editando el proyecto.
                          </div>

                          {tareaFormDraft && tareaFormDraft.key === d._key && (
                            <TareaForm
                              tarea={tareaFormDraft.mode === "edit" ? tareaFormDraft.tarea : null}
                              tareasProyecto={draftTareas[d._key] || []}
                              responsables={responsables}
                              responsablesDisponibles={responsablesDisponibles}
                              onGuardar={guardarTareaDraft}
                              onCancelar={() => setTareaFormDraft(null)}
                            />
                          )}
                          {!(tareaFormDraft && tareaFormDraft.key === d._key) && (
                            <Btn sm onClick={() => setTareaFormDraft({mode:"add", key:d._key})}><i className="ti ti-plus"/> Agregar tarea al plan</Btn>
                          )}

                          {(draftTareas[d._key] || []).length > 0 && (
                            <div style={{marginTop:12,overflowX:"auto"}}>
                              <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                                <thead>
                                  <tr>
                                    {["Tarea","Responsable","Inicio","Entrega","% Avance","Estatus",""].map(h => (
                                      <th key={h} style={{textAlign:"left",fontSize:10,fontWeight:800,color:y.text3,textTransform:"uppercase",letterSpacing:.3,padding:"0.5rem 0.5rem",borderBottom:"1px solid "+y.border,whiteSpace:"nowrap",background:y.surface}}>{h}</th>
                                    ))}
                                  </tr>
                                </thead>
                                <tbody>
                                  {(draftTareas[d._key] || []).map(t => {
                                    const est = estatusEfectivoTarea(t);
                                    const [estBg, estColor] = TAREA_ESTADO_COLOR[est] || [y.grayBg, y.gray];
                                    return (
                                      <tr key={t.id} style={{borderBottom:"1px solid "+y.border}}>
                                        <td style={{padding:"0.5rem",color:y.text,maxWidth:220,background:y.surface}}>{t.titulo}</td>
                                        <td style={{padding:"0.5rem",color:y.text2,whiteSpace:"nowrap",background:y.surface}}>{t.responsable || "—"}</td>
                                        <td style={{padding:"0.5rem",color:y.text2,whiteSpace:"nowrap",background:y.surface}}>{t.fecha_inicio || "—"}</td>
                                        <td style={{padding:"0.5rem",color:y.text2,whiteSpace:"nowrap",background:y.surface}}>{t.fecha_entrega || "—"}</td>
                                        <td style={{padding:"0.5rem",background:y.surface}}>{avanceTarea(t)}%</td>
                                        <td style={{padding:"0.5rem",background:y.surface}}>
                                          <span style={{display:"inline-flex",padding:"3px 9px",borderRadius:20,fontSize:10.5,fontWeight:700,background:estBg,color:estColor,whiteSpace:"nowrap"}}>{est}</span>
                                        </td>
                                        <td style={{padding:"0.5rem",textAlign:"right",whiteSpace:"nowrap",background:y.surface}}>
                                          <button onClick={() => setTareaFormDraft({mode:"edit", key:d._key, tarea:t})} style={{background:"none",border:"none",color:y.text3,cursor:"pointer",padding:3}} title="Editar"><i className="ti ti-pencil" style={{fontSize:13}}/></button>
                                          <button onClick={() => eliminarTareaDraft(d._key, t)} style={{background:"none",border:"none",color:y.text3,cursor:"pointer",padding:3}} title="Eliminar"><i className="ti ti-trash" style={{fontSize:13}}/></button>
                                        </td>
                                      </tr>
                                    );
                                  })}
                                </tbody>
                              </table>
                            </div>
                          )}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}

            {!editProject && (
              <div style={{marginTop:14}}>
                <Btn onClick={addDraft}><i className="ti ti-plus"/> Agregar otro proyecto</Btn>
              </div>
            )}

            {editProject && (
              <React.Fragment>
                <SectionTitle>Plan de acción</SectionTitle>
                <div style={{fontSize:11.5,color:y.text3,marginBottom:10}}>
                  Agrega, edita o elimina aquí las tareas del plan de acción de este proyecto. Los cambios de las tareas se guardan de inmediato, sin necesidad de hacer clic en "Guardar cambios".
                </div>
                <PlanAccionPanel
                  proyecto={editProject}
                  tareasProyecto={tareasProyecto}
                  responsables={responsables}
                  responsablesDisponibles={responsablesDisponibles}
                  puedeEditar={puedeEditar}
                  onTareasChanged={onTareasChanged}
                />
              </React.Fragment>
            )}

            {editProject && editProject.actualizado_en && (
              <div style={{fontSize:11,color:y.text3,display:"flex",alignItems:"center",gap:5,marginTop:14}}>
                <i className="ti ti-clock" style={{fontSize:12}}/>
                Última actualización: {formatearFecha(editProject.actualizado_en)} — {editProject.actualizado_por || "—"}
              </div>
            )}
          </React.Fragment>
        )}

        {editProject && tab === "comentarios" && (
          <React.Fragment>
            {!comentariosDisponibles ? (
              <div style={{fontSize:12,color:y.text3}}>Esta función todavía no está activada en la base de datos (falta crear la tabla "proyecto_comentarios").</div>
            ) : cargandoComentarios ? (
              <div style={{fontSize:12,color:y.text3}}>Cargando comentarios...</div>
            ) : (
              <React.Fragment>
                <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:10}}>
                  {comentarios.length === 0 && <div style={{fontSize:12,color:y.text3}}>Sin comentarios todavía — escribe el primero abajo.</div>}
                  {comentarios.map(c => (
                    <div key={c.id} style={{background:y.grayBg,border:"1px solid "+y.border,borderRadius:8,padding:"0.6rem 0.75rem"}}>
                      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,marginBottom:3}}>
                        <div style={{display:"flex",alignItems:"baseline",gap:6,minWidth:0}}>
                          <span style={{fontSize:12,fontWeight:700,color:y.text}}>{c.autor || "Usuario"}</span>
                          <span style={{fontSize:10,color:y.text3}}>{formatearFecha(c.createdAt)}</span>
                        </div>
                        <button onClick={() => eliminarComentario(c)} style={{background:"none",border:"none",color:y.text3,cursor:"pointer",fontSize:15,lineHeight:1,padding:2,flexShrink:0}}>×</button>
                      </div>
                      <div style={{fontSize:12.5,color:y.text2,whiteSpace:"pre-wrap"}}>{c.texto}</div>
                    </div>
                  ))}
                </div>
                <div style={{display:"flex",gap:6,alignItems:"flex-end"}}>
                  <textarea value={nuevoComentario} onChange={e => setNuevoComentario(e.target.value)} onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); agregarComentario(); } }} placeholder="Escribe un comentario para el equipo..." rows={2} style={{...inputStyle,fontSize:12.5,resize:"vertical"}} />
                  <Btn sm primary disabled={enviandoComentario || !nuevoComentario.trim()} onClick={agregarComentario}><i className="ti ti-send"/> Enviar</Btn>
                </div>
              </React.Fragment>
            )}
          </React.Fragment>
        )}

        </div>

        <div style={{padding:"0.75rem 1.25rem",borderTop:"1px solid "+y.border,display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0,background:y.grayBg}}>
          <span style={{fontSize:12,color:y.text3}}>
            {editProject ? "Editando proyecto" : drafts.length + (drafts.length === 1 ? " proyecto · " : " proyectos · ") + conNombre + " listos para guardar"}
          </span>
          <div style={{display:"flex",gap:8}}>
            <Btn onClick={onClose}>Cancelar</Btn>
            <Btn primary disabled={saving || (!editProject && conNombre === 0)} onClick={save}>
              <i className="ti ti-check"/> {saving ? "Guardando..." : editProject ? "Guardar cambios" : "Guardar " + conNombre + " proyecto(s)"}
            </Btn>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------- Usuarios (administrar: crear, editar, inactivar, país) ---------- */
function UsuarioFormModal({ paises, editUser, editPaisIds, onClose, onSaved }) {
  const [usuario, setUsuario] = useState(editUser ? editUser.usuario || "" : "");
  const [password, setPassword] = useState("");
  const [nombre, setNombre] = useState(editUser ? editUser.nombre || "" : "");
  const [estado, setEstado] = useState(editUser ? editUser.estado || "Activo" : "Activo");
  const [paisIds, setPaisIds] = useState(editPaisIds || []);
  const [saving, setSaving] = useState(false);

  const togglePais = id => {
    setPaisIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  };
  const seleccionarTodos = () => setPaisIds(paises.map(p => p.id));
  const seleccionarNinguno = () => setPaisIds([]);

  const guardar = async () => {
    if (!usuario.trim() || !nombre.trim()) { alert("Usuario y nombre son requeridos."); return; }
    if (!editUser && !password.trim()) { alert("La contraseña es requerida para un usuario nuevo."); return; }
    setSaving(true);
    try {
      // evitar usuario duplicado
      const { data: existentes, error: eDup } = await supabase.from("usuarios").select("id").eq("usuario", usuario.trim());
      if (eDup) throw eDup;
      if ((existentes || []).some(x => x.id !== (editUser && editUser.id))) {
        alert("Ya existe un usuario con ese nombre de usuario.");
        setSaving(false);
        return;
      }

      let usuarioId = editUser ? editUser.id : null;
      if (editUser) {
        const payload = { usuario: usuario.trim(), nombre: nombre.trim(), estado };
        if (password.trim()) payload.password = password.trim();
        const { error } = await supabase.from("usuarios").update(payload).eq("id", editUser.id);
        if (error) throw error;
      } else {
        const { data, error } = await supabase.from("usuarios").insert([{ usuario: usuario.trim(), password: password.trim(), nombre: nombre.trim(), estado }]).select();
        if (error) throw error;
        usuarioId = data && data[0] && data[0].id;
      }

      if (usuarioId) {
        try {
          // Reemplaza por completo la lista de países asignados: borra lo anterior y vuelve a insertar lo seleccionado.
          await supabase.from("proyecto_usuario_paises").delete().eq("usuarioId", usuarioId);
          if (paisIds.length > 0) {
            await supabase.from("proyecto_usuario_paises").insert(paisIds.map(pid => ({ usuarioId, pais_id: pid })));
          }
        } catch (e) {
          console.warn("proyecto_usuario_paises no disponible:", e.message || e);
        }
      }

      onSaved();
      onClose();
    } catch (e) {
      alert("No se pudo guardar: " + (e.message || e));
    } finally {
      setSaving(false);
    }
  };

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(15,23,42,.6)",zIndex:600,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={e => e.target === e.currentTarget && onClose()}>
      <div style={{background:y.surface,borderRadius:12,padding:"1.5rem",width:460,maxWidth:"92vw",maxHeight:"88vh",overflowY:"auto",boxShadow:"0 20px 50px rgba(0,0,0,.3)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
          <strong style={{fontSize:15,color:y.text}}>{editUser ? "Editar usuario" : "Agregar usuario"}</strong>
          <button onClick={onClose} style={{background:"none",border:"none",color:y.text3,cursor:"pointer",fontSize:18,lineHeight:1}}>✕</button>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div>
            <label style={{fontSize:11,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>Usuario *</label>
            <input value={usuario} onChange={e => setUsuario(e.target.value)} style={{...inputStyle, marginTop:4}} placeholder="nombre.apellido" />
          </div>
          <div>
            <label style={{fontSize:11,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>{editUser ? "Contraseña (vacío = sin cambiar)" : "Contraseña *"}</label>
            <input type="password" value={password} onChange={e => setPassword(e.target.value)} style={{...inputStyle, marginTop:4}} placeholder="••••••••" />
          </div>
          <div>
            <label style={{fontSize:11,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>Nombre completo *</label>
            <input value={nombre} onChange={e => setNombre(e.target.value)} style={{...inputStyle, marginTop:4}} placeholder="Nombre Apellido" />
          </div>
          <div>
            <label style={{fontSize:11,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>Estado</label>
            <select value={estado} onChange={e => setEstado(e.target.value)} style={{...inputStyle, marginTop:4}}>
              <option>Activo</option>
              <option>Inactivo</option>
            </select>
          </div>
          <div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
              <label style={{fontSize:11,fontWeight:700,color:y.text3,textTransform:"uppercase"}}>Países ({paisIds.length === paises.length && paises.length > 0 ? "todos" : paisIds.length})</label>
              <div style={{display:"flex",gap:10}}>
                <button type="button" onClick={seleccionarTodos} style={{background:"none",border:"none",color:y.primary,fontSize:11,fontWeight:600,cursor:"pointer",padding:0}}>Todos</button>
                <button type="button" onClick={seleccionarNinguno} style={{background:"none",border:"none",color:y.text3,fontSize:11,fontWeight:600,cursor:"pointer",padding:0}}>Ninguno</button>
              </div>
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:8,padding:"0.6rem",background:y.grayBg,borderRadius:8,border:"1px solid "+y.border}}>
              {paises.length === 0 && <span style={{fontSize:12,color:y.text3}}>No hay países en el catálogo.</span>}
              {paises.map(p => (
                <label key={p.id} style={{display:"flex",alignItems:"center",gap:5,fontSize:12,cursor:"pointer",padding:"4px 9px",borderRadius:7,background: paisIds.includes(p.id) ? y.primaryLight : y.surface, border:"1px solid "+(paisIds.includes(p.id) ? y.primary : y.border), fontWeight: paisIds.includes(p.id) ? 600 : 400, color: paisIds.includes(p.id) ? y.primary : y.text2}}>
                  <input type="checkbox" checked={paisIds.includes(p.id)} onChange={() => togglePais(p.id)} />
                  {bandera(p.nombre)} {p.nombre}
                </label>
              ))}
            </div>
          </div>
        </div>
        <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:20}}>
          <Btn onClick={onClose} disabled={saving}>Cancelar</Btn>
          <Btn primary onClick={guardar} disabled={saving}>{saving ? "Guardando..." : "Guardar"}</Btn>
        </div>
      </div>
    </div>
  );
}

function UsuariosView({ paises, usuarioPaises, usuarioPaisesDisponibles, onChanged }) {
  const [usuarios, setUsuarios] = useState([]);
  const [loading, setLoading] = useState(true);
  const [formAbierto, setFormAbierto] = useState(null); // null | {} (nuevo) | usuario (editar)

  const cargar = async () => {
    setLoading(true);
    try {
      const { data, error } = await supabase.from("usuarios").select("*").order("nombre");
      if (error) throw error;
      setUsuarios(data || []);
    } catch (e) {
      console.error(e);
    } finally {
      setLoading(false);
    }
  };

  useEffect(() => { cargar(); }, []);

  const paisesDe = usuarioId => {
    const filas = (usuarioPaises || []).filter(x => x.usuarioId === usuarioId);
    return filas.map(f => (paises || []).find(p => p.id === f.pais_id)).filter(Boolean);
  };

  const toggleEstado = async u => {
    const nuevo = u.estado === "Activo" ? "Inactivo" : "Activo";
    setUsuarios(prev => prev.map(x => x.id === u.id ? { ...x, estado: nuevo } : x));
    try {
      const { error } = await supabase.from("usuarios").update({ estado: nuevo }).eq("id", u.id);
      if (error) throw error;
    } catch (e) {
      setUsuarios(prev => prev.map(x => x.id === u.id ? { ...x, estado: u.estado } : x));
      alert("No se pudo cambiar el estado: " + (e.message || e));
    }
  };

  return (
    <Card mb={0}>
      <CardHeader icon="ti-users" left={"Usuarios (" + usuarios.length + ")"} right={
        <React.Fragment>
          <span style={{fontSize:11,color:y.text3}}>Cuentas que pueden entrar a esta página (misma base que Kielsa CI)</span>
          <Btn sm primary onClick={() => setFormAbierto({})}><i className="ti ti-user-plus"/> Agregar usuario</Btn>
        </React.Fragment>
